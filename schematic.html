<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Axiom · Schematic Board v3</title>
<style>
  :root{--bg:#0a0d12;--panel:#0e141b;--line:#223041;--ink:#e8e4d8;--dim:#93a1b0;
    --red:#c8452c;--blue:#3f7fc1;--gold:#d9a83a;--green:#58a36a;--silver:#d8dde3;
    --mono:ui-monospace,"Cascadia Mono","JetBrains Mono",Consolas,monospace;
    --serif:Georgia,"Times New Roman",serif}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--mono);height:100vh;overflow:hidden;display:flex;flex-direction:column}
  ::-webkit-scrollbar{width:5px;height:5px}
  ::-webkit-scrollbar-track{background:var(--bg)}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
  ::selection{background:rgba(88,163,106,0.25);color:var(--ink)}

  header{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;border-bottom:1px solid var(--line);flex-shrink:0;z-index:30;background:var(--bg)}
  .brand{display:flex;align-items:center;gap:10px}
  .brand-name{font-size:13px;letter-spacing:.3em;color:var(--silver)}
  .brand-sub{font-size:9px;letter-spacing:.12em;color:#3a4a5c;margin-top:1px}
  .hdr-tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .back{color:var(--dim);text-decoration:none;font-size:11px;letter-spacing:.12em}
  .back:hover{color:var(--ink)}

  .tb{background:none;border:1px solid var(--line);color:var(--dim);font:10px var(--mono);letter-spacing:.1em;padding:5px 10px;cursor:pointer;transition:all .15s;white-space:nowrap}
  .tb:hover{border-color:var(--dim);color:var(--ink)}
  .tb.active{border-color:var(--green);color:var(--green)}
  .tb.active-del{border-color:var(--red);color:var(--red);background:rgba(200,69,44,0.1)}
  .tb.gold{border-color:var(--gold);color:var(--gold)}
  .tb.gold:hover{background:var(--gold);color:var(--bg)}
  .sep{width:1px;height:18px;background:var(--line);margin:0 2px}

  .main{display:flex;flex:1;overflow:hidden}

  .palette{width:200px;border-right:1px solid var(--line);display:flex;flex-direction:column;background:var(--panel);flex-shrink:0;overflow:hidden}
  .pal-section{padding:8px 10px;border-bottom:1px solid rgba(34,48,65,0.5)}
  .pal-title{font-size:9px;letter-spacing:.2em;color:#5c6875;margin-bottom:6px}
  .pal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
  .pal-item{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border:1px solid transparent;cursor:pointer;transition:all .15s;border-radius:2px}
  .pal-item:hover{border-color:var(--line);background:rgba(88,163,106,0.05)}
  .pal-item.active{border-color:var(--green);background:rgba(88,163,106,0.1)}
  .pal-item svg{width:32px;height:22px}
  .pal-item span{font-size:8px;color:#5c6875;letter-spacing:.05em;text-align:center}

  .pal-scroll{flex:1;overflow-y:auto}

  .canvas-wrap{flex:1;position:relative;overflow:hidden;background:var(--bg)}
  .canvas-wrap canvas{position:absolute;top:0;left:0}
  #gridCanvas{z-index:1}
  #schematicCanvas{z-index:2}
  #overlayCanvas{z-index:3;cursor:default}
  .canvas-wrap.mode-delete #overlayCanvas{cursor:not-allowed}
  .canvas-wrap.mode-wire #overlayCanvas{cursor:crosshair}

  .right-panel{width:240px;border-left:1px solid var(--line);display:flex;flex-direction:column;background:var(--panel);flex-shrink:0;overflow:hidden}
  .rp-section{padding:10px;border-bottom:1px solid rgba(34,48,65,0.5)}
  .rp-title{font-size:9px;letter-spacing:.2em;color:#5c6875;margin-bottom:8px}
  .rp-scroll{flex:1;overflow-y:auto}

  .prop-row{display:flex;align-items:center;gap:6px;margin-bottom:6px}
  .prop-label{font-size:9px;color:#5c6875;letter-spacing:.1em;min-width:50px}
  .prop-input{flex:1;background:var(--bg);border:1px solid var(--line);color:var(--ink);font:11px var(--mono);padding:4px 6px;outline:none}
  .prop-input:focus{border-color:var(--green)}

  .notes-area{width:100%;min-height:60px;background:var(--bg);border:1px solid var(--line);color:var(--dim);font:11px var(--mono);padding:6px;outline:none;resize:vertical;line-height:1.6}
  .notes-area:focus{border-color:var(--green)}

  .status{display:flex;align-items:center;justify-content:space-between;padding:4px 16px;border-top:1px solid var(--line);flex-shrink:0;font-size:9px;color:#3a4a5c;letter-spacing:.1em;background:var(--bg)}
  .status .coords{color:var(--dim)}
  .status .mode{color:var(--green)}
  .status .mode.del{color:var(--red)}

  .help-tip{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--green);padding:8px 16px;font-size:11px;color:var(--green);z-index:50;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
  .help-tip.show{opacity:1}
  .help-tip.del{border-color:var(--red);color:var(--red)}

  @media(max-width:900px){
    .palette{width:160px}
    .right-panel{width:200px}
    .brand-sub{display:none}
  }
  @media(max-width:700px){
    .palette,.right-panel{display:none}
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <svg width="18" height="18" viewBox="0 0 56 56" fill="none" stroke="#e8e4d8" stroke-width="3">
      <circle cx="28" cy="28" r="11"/><line x1="28" y1="8" x2="28" y2="15"/>
      <line x1="28" y1="41" x2="28" y2="48"/><line x1="8" y1="28" x2="15" y2="28"/>
      <line x1="41" y1="28" x2="48" y2="28"/><circle cx="28" cy="28" r="2.5" fill="#e8e4d8" stroke="none"/>
    </svg>
    <div>
      <div class="brand-name">AXIOM INDUSTRIES</div>
      <div class="brand-sub">schematic board · fluid editing</div>
    </div>
  </div>
  <div class="hdr-tools">
    <button class="tb" id="toolSelect" title="select/move (V)">◇ select</button>
    <button class="tb" id="toolWire" title="draw wire (W)">─ wire</button>
    <button class="tb" id="toolDelete" title="delete mode (X)">✕ delete</button>
    <div class="sep"></div>
    <button class="tb" id="toolRotate" title="rotate selected (R)">↻</button>
    <button class="tb" id="toolMirror" title="mirror selected (M)">⇔</button>
    <div class="sep"></div>
    <button class="tb" id="zoomIn">+</button>
    <button class="tb" id="zoomOut">−</button>
    <button class="tb" id="zoomFit">fit</button>
    <div class="sep"></div>
    <button class="tb gold" id="exportPng">png</button>
    <button class="tb gold" id="exportJson">save</button>
    <button class="tb" id="importJson">load</button>
    <a class="back" href="axiom.html">axiom ↩</a>
  </div>
</header>

<div class="main">
  <div class="palette">
    <div class="pal-scroll">
      <div class="pal-section">
        <div class="pal-title">PASSIVE</div>
        <div class="pal-grid" id="palPassive"></div>
      </div>
      <div class="pal-section">
        <div class="pal-title">SEMI</div>
        <div class="pal-grid" id="palSemi"></div>
      </div>
      <div class="pal-section">
        <div class="pal-title">POWER</div>
        <div class="pal-grid" id="palPower"></div>
      </div>
      <div class="pal-section">
        <div class="pal-title">IC / LOGIC</div>
        <div class="pal-grid" id="palIC"></div>
      </div>
      <div class="pal-section">
        <div class="pal-title">CONNECT</div>
        <div class="pal-grid" id="palConnect"></div>
      </div>
      <div class="pal-section">
        <div class="pal-title">REFURB</div>
        <div class="pal-grid" id="palRefurb"></div>
      </div>
    </div>
  </div>

  <div class="canvas-wrap" id="canvasWrap">
    <canvas id="gridCanvas"></canvas>
    <canvas id="schematicCanvas"></canvas>
    <canvas id="overlayCanvas"></canvas>
  </div>

  <div class="right-panel">
    <div class="rp-scroll">
      <div class="rp-section">
        <div class="rp-title">PROPERTIES</div>
        <div id="propsContent"><span style="font-size:10px;color:#3a4a5c;font-style:italic">select anything</span></div>
      </div>
      <div class="rp-section">
        <div class="rp-title">BENCH NOTES</div>
        <textarea class="notes-area" id="benchNotes" placeholder="notes..."></textarea>
      </div>
    </div>
  </div>
</div>

<div class="status">
  <span class="mode" id="statusMode">select</span>
  <span class="coords" id="statusCoords">0, 0</span>
</div>

<div class="help-tip" id="helpTip"></div>

<input type="file" id="fileInput" accept=".json" style="display:none">

<script>
(function(){
  var GRID=20;

  // ─── Full Component Library ───
  var COMPS={
    // Passive
    resistor:{cat:'passive',label:'R',w:3,h:1,pins:[{x:0,y:0,id:1},{x:3,y:0,id:2}],draw:function(c,x,y){
      c.strokeStyle='#d8dde3';c.lineWidth=1.5;
      c.beginPath();c.moveTo(x-GRID*1.5,y);c.lineTo(x-GRID*0.8,y);c.stroke();
      c.strokeRect(x-GRID*0.8,y-GRID*0.3,GRID*1.6,GRID*0.6);
      c.beginPath();c.moveTo(x+GRID*0.8,y);c.lineTo(x+GRID*1.5,y);c.stroke();
    }},
    capacitor:{cat:'passive',label:'C',w:2,h:2,pins:[{x:0,y:1,id:1},{x:2,y:1,id:2}],draw:function(c,x,y){
      c.strokeStyle='#3f7fc1';c.lineWidth=1.5;
      c.beginPath();c.moveTo(x-GRID,y);c.lineTo(x-GRID*0.3,y);c.stroke();
      c.beginPath();c.moveTo(x-GRID*0.3,y-GRID*0.4);c.lineTo(x-GRID*0.3,y+GRID*0.4);c.stroke();
      c.beginPath();c.moveTo(x+GRID*0.3,y-GRID*0.4);c.lineTo(x+GRID*0.3,y+GRID*0.4);c.stroke();
      c.beginPath();c.moveTo(x+GRID*0.3,y);c.lineTo(x+GRID,y);c.stroke();
    }},
    inductor:{cat:'passive',label:'L',w:3,h:1,pins:[{x:0,y:0,id:1},{x:3,y:0,id:2}],draw:function(c,x,y){
      c.strokeStyle='#d9a83a';c.lineWidth=1.5;c.beginPath();
      for(var i=0;i<4;i++){var bx=x-GRID*1.2+i*GRID*0.7;c.moveTo(bx,y);c.arc(bx+GRID*0.35,y,GRID*0.35,Math.PI,0,false);}
      c.stroke();
    }},
    pot:{cat:'passive',label:'VR',w:3,h:2,pins:[{x:0,y:1,id:1},{x:3,y:1,id:2},{x:1.5,y:0,id:3}],draw:function(c,x,y){
      c.strokeStyle='#d8dde3';c.lineWidth=1.5;
      c.beginPath();c.moveTo(x-GRID,y);c.lineTo(x-GRID*0.3,y);c.stroke();
      c.strokeRect(x-GRID*0.3,y-GRID*0.3,GRID*0.6,GRID*0.6);
      c.beginPath();c.moveTo(x+GRID*0.3,y);c.lineTo(x+GRID,y);c.stroke();
      c.beginPath();c.moveTo(x,y-GRID*0.5);c.lineTo(x,y-GRID);c.stroke();
      c.beginPath();c.moveTo(x-GRID*0.15,y-GRID*0.85);c.lineTo(x+GRID*0.15,y-GRID*0.85);c.stroke();
    }},
    // Semi
    diode:{cat:'semi',label:'D',w:2,h:1,pins:[{x:0,y:0,id:1},{x:2,y:0,id:2}],draw:function(c,x,y){
      c.strokeStyle='#c8452c';c.lineWidth=1.5;
      c.beginPath();c.moveTo(x-GRID,y);c.lineTo(x-GRID*0.3,y);c.stroke();
      c.beginPath();c.moveTo(x-GRID*0.3,y-GRID*0.3);c.lineTo(x+GRID*0.3,y);c.lineTo(x-GRID*0.3,y+GRID*0.3);c.closePath();c.stroke();
      c.beginPath();c.moveTo(x+GRID*0.3,y-GRID*0.3);c.lineTo(x+GRID*0.3,y+GRID*0.3);c.stroke();
      c.beginPath();c.moveTo(x+GRID*0.3,y);c.lineTo(x+GRID,y);c.stroke();
    }},
    led:{cat:'semi',label:'LED',w:2,h:1,pins:[{x:0,y:0,id:1},{x:2,y:0,id:2}],draw:function(c,x,y){
      c.strokeStyle='#58a36a';c.lineWidth=1.5;
      c.beginPath();c.moveTo(x-GRID,y);c.lineTo(x-GRID*0.3,y);c.stroke();
      c.beginPath();c.moveTo(x-GRID*0.3,y-GRID*0.3);c.lineTo(x+GRID*0.3,y);c.lineTo(x-GRID*0.3,y+GRID*0.3);c.closePath();c.stroke();
      c.beginPath();c.moveTo(x+GRID*0.3,y-GRID*0.3);c.lineTo(x+GRID*0.3,y+GRID*0.3);c.stroke();
      c.beginPath();c.moveTo(x+GRID*0.3,y);c.lineTo(x+GRID,y);c.stroke();
      c.beginPath();c.moveTo(x+GRID*0.1,y-GRID*0.6);c.lineTo(x+GRID*0.4,y-GRID*0.9);c.stroke();
      c.beginPath();c.moveTo(x+GRID*0.3,y-GRID*0.5);c.lineTo(x+GRID*0.6,y-GRID*0.8);c.stroke();
    }},
    npn:{cat:'semi',label:'Q',w:2,h:3,pins:[{x:0,y:1.5,id:'B'},{x:2,y:0.5,id:'C'},{x:2,y:2.5,id:'E'}],draw:function(c,x,y){
      c.strokeStyle='#d8dde3';c.lineWidth=1.5;
      c.beginPath();c.moveTo(x-GRID*0.5,y-GRID*0.8);c.lineTo(x-GRID*0.5,y+GRID*0.8);c.stroke();
      c.beginPath();c.moveTo(x-GRID*0.5,y-GRID*0.3);c.lineTo(x+GRID*0.5,y-GRID*0.8);c.stroke();
      c.beginPath();c.moveTo(x-GRID*0.5,y+GRID*0.3);c.lineTo(x+GRID*0.5,y+GRID*0.8);c.stroke();
      c.beginPath();c.moveTo(x+GRID*0.2,y+GRID*0.6);c.lineTo(x+GRID*0.5,y+GRID*0.8);c.lineTo(x+GRID*0.15,y+GRID*0.85);c.stroke();
    }},
    mosfet:{cat:'semi',label:'M',w:2,h:3,pins:[{x:0,y:1.5,id:'G'},{x:2,y:0.5,id:'D'},{x:2,y:2.5,id:'S'}],draw:function(c,x,y){
      c.strokeStyle='#3f7fc1';c.lineWidth=1.5;
      c.beginPath();c.moveTo(x-GRID*0.4,y-GRID*0.8);c.lineTo(x-GRID*0.4,y+GRID*0.8);c.stroke();
      c.beginPath();c.moveTo(x-GRID*0.15,y-GRID*0.6);c.lineTo(x-GRID*0.15,y-GRID*0.2);c.stroke();
      c.beginPath();c.moveTo(x-GRID*0.15,y-GRID*0.1);c.lineTo(x-GRID*0.15,y+GRID*0.1);c.stroke();
      c.beginPath();c.moveTo(x-GRID*0.15,y+GRID*0.2);c.lineTo(x-GRID*0.15,y+GRID*0.6);c.stroke();
      c.beginPath();c.moveTo(x-GRID*0.15,y-GRID*0.4);c.lineTo(x+GRID*0.5,y-GRID*0.4);c.lineTo(x+GRID*0.5,y-GRID*0.8);c.stroke();
      c.beginPath();c.moveTo(x-GRID*0.15,y);c.lineTo(x+GRID*0.5,y);c.stroke();
      c.beginPath();c.moveTo(x-GRID*0.15,y+GRID*0.4);c.lineTo(x+GRID*0.5,y+GRID*0.4);c.lineTo(x+GRID*0.5,y+GRID*0.8);c.stroke();
    }},
    // Power
    vcc:{cat:'power',label:'V+',w:1,h:1,pins:[{x:0,y:1,id:1}],draw:function(c,x,y){
      c.strokeStyle='#c8452c';c.lineWidth=1.5;
      c.beginPath();c.moveTo(x,y+GRID*0.5);c.lineTo(x,y-GRID*0.2);c.stroke();
      c.beginPath();c.moveTo(x-GRID*0.3,y-GRID*0.2);c.lineTo(x,y-GRID*0.5);c.lineTo(x+GRID*0.3,y-GRID*0.2);c.stroke();
    }},
    gnd:{cat:'power',label:'GND',w:1,h:1,pins:[{x:0,y:0,id:1}],draw:function(c,x,y){
      c.strokeStyle='#d8dde3';c.lineWidth=1.5;
      c.beginPath();c.moveTo(x,y-GRID*0.5);c.lineTo(x,y);c.stroke();
      c.beginPath();c.moveTo(x-GRID*0.4,y);c.lineTo(x+GRID*0.4,y);c.stroke();
      c.beginPath();c.moveTo(x-GRID*0.25,y+GRID*0.2);c.lineTo(x+GRID*0.25,y+GRID*0.2);c.stroke();
      c.beginPath();c.moveTo(x-GRID*0.1,y+GRID*0.4);c.lineTo(x+GRID*0.1,y+GRID*0.4);c.stroke();
    }},
    battery:{cat:'power',label:'BAT',w:2,h:1,pins:[{x:0,y:0,id:1},{x:2,y:0,id:2}],draw:function(c,x,y){
      c.strokeStyle='#d9a83a';c.lineWidth=1.5;
      c.beginPath();c.moveTo(x-GRID,y);c.lineTo(x-GRID*0.2,y);c.stroke();
      c.beginPath();c.moveTo(x-GRID*0.2,y-GRID*0.5);c.lineTo(x-GRID*0.2,y+GRID*0.5);c.stroke();
      c.beginPath();c.moveTo(x+GRID*0.2,y-GRID*0.25);c.lineTo(x+GRID*0.2,y+GRID*0.25);c.stroke();
      c.beginPath();c.moveTo(x+GRID*0.2,y);c.lineTo(x+GRID,y);c.stroke();
    }},
    // IC
    ic555:{cat:'ic',label:'555',w:4,h:4,pins:[{x:0,y:1,id:1},{x:0,y:2,id:2},{x:0,y:3,id:3},{x:4,y:1,id:7},{x:4,y:2,id:6},{x:4,y:3,id:5},{x:1,y:0,id:8},{x:1,y:4,id:4}],
      draw:function(c,x,y){
        c.strokeStyle='#58a36a';c.lineWidth=1.5;
        c.strokeRect(x-GRID*1.5,y-GRID*1.5,GRID*3,GRID*3);
        c.fillStyle='#58a36a';c.font='9px monospace';c.textAlign='center';c.fillText('555',x,y+3);c.textAlign='left';
      }},
    icGeneric:{cat:'ic',label:'IC',w:4,h:5,pins:[{x:0,y:1,id:1},{x:0,y:2,id:2},{x:0,y:3,id:3},{x:0,y:4,id:4},{x:4,y:1,id:8},{x:4,y:2,id:7},{x:4,y:3,id:6},{x:4,y:4,id:5},{x:1,y:0,id:9},{x:3,y:0,id:10}],
      draw:function(c,x,y){
        c.strokeStyle='#93a1b0';c.lineWidth=1.5;
        c.strokeRect(x-GRID*1.5,y-GRID*2,GRID*3,GRID*4);
        c.fillStyle='#93a1b0';c.font='8px monospace';c.textAlign='center';c.fillText('IC',x,y+3);c.textAlign='left';
        c.beginPath();c.arc(x-GRID*0.5,y-GRID*2,GRID*0.2,0,Math.PI,true);c.stroke();
      }},
    opamp:{cat:'ic',label:'OP',w:3,h:3,pins:[{x:0,y:0.75,id:'+'},{x:0,y:2.25,id:'-'},{x:3,y:1.5,id:'out'}],
      draw:function(c,x,y){
        c.strokeStyle='#3f7fc1';c.lineWidth=1.5;
        c.beginPath();c.moveTo(x-GRID,y-GRID);c.lineTo(x-GRID,y+GRID);c.lineTo(x+GRID,y);c.closePath();c.stroke();
        c.fillStyle='#3f7fc1';c.font='10px monospace';c.fillText('+',x-GRID*0.7,y-GRID*0.4);c.fillText('−',x-GRID*0.7,y+GRID*0.6);
      }},
    // Connect
    jack:{cat:'connect',label:'JCK',w:2,h:1,pins:[{x:0,y:0,id:1},{x:2,y:0,id:2}],draw:function(c,x,y){
      c.strokeStyle='#d9a83a';c.lineWidth=1.5;
      c.beginPath();c.arc(x-GRID*0.3,y,GRID*0.3,0,Math.PI*2);c.stroke();
      c.beginPath();c.moveTo(x,y);c.lineTo(x+GRID*0.5,y);c.stroke();
      c.beginPath();c.moveTo(x+GRID*0.3,y-GRID*0.3);c.lineTo(x+GRID*0.3,y+GRID*0.3);c.stroke();
    }},
    switchSPST:{cat:'connect',label:'SW',w:3,h:1,pins:[{x:0,y:0,id:1},{x:3,y:0,id:2}],draw:function(c,x,y){
      c.strokeStyle='#d8dde3';c.lineWidth=1.5;
      c.beginPath();c.moveTo(x-GRID,y);c.lineTo(x-GRID*0.3,y);c.stroke();
      c.beginPath();c.arc(x-GRID*0.3,y,GRID*0.1,0,Math.PI*2);c.stroke();
      c.beginPath();c.arc(x+GRID*0.3,y,GRID*0.1,0,Math.PI*2);c.stroke();
      c.beginPath();c.moveTo(x-GRID*0.3,y);c.lineTo(x+GRID*0.25,y-GRID*0.4);c.stroke();
      c.beginPath();c.moveTo(x+GRID*0.3,y);c.lineTo(x+GRID,y);c.stroke();
    }},
    terminal:{cat:'connect',label:'TP',w:1,h:1,pins:[{x:0,y:0,id:1}],draw:function(c,x,y){
      c.strokeStyle='#d9a83a';c.lineWidth=1.5;
      c.beginPath();c.arc(x,y,GRID*0.25,0,Math.PI*2);c.stroke();
      c.beginPath();c.arc(x,y,GRID*0.08,0,Math.PI*2);c.fill();
    }},
    // Refurb
    salvaged:{cat:'refurb',label:'SALV',w:3,h:2,pins:[{x:0,y:1,id:1},{x:3,y:1,id:2}],draw:function(c,x,y){
      c.strokeStyle='#58a36a';c.lineWidth=1.5;c.setLineDash([4,3]);
      c.strokeRect(x-GRID*1.2,y-GRID*0.7,GRID*2.4,GRID*1.4);
      c.setLineDash([]);
      c.fillStyle='#58a36a';c.font='8px monospace';c.textAlign='center';c.fillText('SALVAGED',x,y+3);c.textAlign='left';
      c.beginPath();c.moveTo(x-GRID*1.2,y);c.lineTo(x-GRID*1.5,y);c.stroke();
      c.beginPath();c.moveTo(x+GRID*1.2,y);c.lineTo(x+GRID*1.5,y);c.stroke();
    }},
    testPoint:{cat:'refurb',label:'TST',w:1,h:1,pins:[{x:0,y:0,id:1}],draw:function(c,x,y){
      c.strokeStyle='#c8452c';c.lineWidth=1.5;
      c.beginPath();c.moveTo(x,y-GRID*0.4);c.lineTo(x-GRID*0.3,y+GRID*0.3);c.lineTo(x+GRID*0.3,y+GRID*0.3);c.closePath();c.stroke();
    }},
    probe:{cat:'refurb',label:'PROBE',w:1,h:2,pins:[{x:0,y:0,id:1},{x:0,y:2,id:2}],draw:function(c,x,y){
      c.strokeStyle='#d9a83a';c.lineWidth=1.5;
      c.beginPath();c.moveTo(x,y-GRID*0.5);c.lineTo(x,y+GRID*0.5);c.stroke();
      c.beginPath();c.moveTo(x-GRID*0.2,y+GRID*0.5);c.lineTo(x,y+GRID*0.8);c.lineTo(x+GRID*0.2,y+GRID*0.5);c.stroke();
      c.beginPath();c.moveTo(x-GRID*0.15,y-GRID*0.5);c.lineTo(x+GRID*0.15,y-GRID*0.5);c.stroke();
    }}
  };

  // ─── State ───
  var components=[], wires=[], nextRef={};
  var tool='select'; // select, wire, delete, place
  var placing=null;
  var selectedComp=null, selectedWire=null;
  var wireStart=null;
  var panX=0, panY=0, zoom=1;
  var dragging=false, dragComp=null, dragOffset=null;
  var draggingWirePoint=false, dragWireInfo=null;
  var panning=false, panStart=null;
  var undoStack=[];
  var mouseWorld=null;

  // ─── DOM ───
  var wrap=document.getElementById('canvasWrap');
  var gridC=document.getElementById('gridCanvas');
  var schC=document.getElementById('schematicCanvas');
  var ovrC=document.getElementById('overlayCanvas');
  var gridCtx=gridC.getContext('2d');
  var schCtx=schC.getContext('2d');
  var ovrCtx=ovrC.getContext('2d');

  function resize(){
    var w=wrap.clientWidth, h=wrap.clientHeight;
    [gridC,schC,ovrC].forEach(function(c){c.width=w;c.height=h;});
    drawAll();
  }
  window.addEventListener('resize',resize);

  // ─── Palette ───
  function buildPalette(){
    var cats={passive:'palPassive',semi:'palSemi',power:'palPower',ic:'palIC',connect:'palConnect',refurb:'palRefurb'};
    Object.keys(COMPS).forEach(function(key){
      var def=COMPS[key];
      var el=document.createElement('div');
      el.className='pal-item';
      el.setAttribute('data-comp',key);
      var cvs=document.createElement('canvas');cvs.width=32;cvs.height=22;
      var cx=cvs.getContext('2d');
      cx.save();cx.translate(16,11);cx.scale(0.35,0.35);
      def.draw(cx,0,0);
      cx.restore();
      el.appendChild(cvs);
      var lbl=document.createElement('span');lbl.textContent=def.label;
      el.appendChild(lbl);
      el.onclick=function(){startPlacing(key);};
      document.getElementById(cats[def.cat]).appendChild(el);
    });
  }

  function startPlacing(key){
    placing=key;
    tool='place';
    document.querySelectorAll('.pal-item').forEach(function(e){e.classList.remove('active')});
    var el=document.querySelector('[data-comp="'+key+'"]');
    if(el) el.classList.add('active');
    updateToolUI();
    showTip('click canvas to place · ESC to cancel');
  }

  // ─── Coordinates ───
  function screenToWorld(sx,sy){return{x:(sx-panX)/(GRID*zoom),y:(sy-panY)/(GRID*zoom)};}
  function worldToScreen(wx,wy){return{x:wx*GRID*zoom+panX,y:wy*GRID*zoom+panY};}
  function snap(v){return Math.round(v);}

  function getPinWorldPos(comp,pin){
    var def=COMPS[comp.type];if(!def) return null;
    var px=pin.x-(def.w||2)/2, py=pin.y-(def.h||2)/2;
    var rpx=px,rpy=py;
    if(comp.rot===1){rpx=-py;rpy=px;}
    if(comp.rot===2){rpx=-px;rpy=-py;}
    if(comp.rot===3){rpx=py;rpy=-px;}
    if(comp.mir) rpx=-rpx;
    return{x:comp.x+rpx,y:comp.y+rpy};
  }

  // ─── Hit testing ───
  function findPinAt(wx,wy){
    var best=null, bestDist=0.5;
    components.forEach(function(c){
      var def=COMPS[c.type];if(!def||!def.pins) return;
      def.pins.forEach(function(pin){
        var pp=getPinWorldPos(c,pin);
        var d=Math.sqrt((wx-pp.x)*(wx-pp.x)+(wy-pp.y)*(wy-pp.y));
        if(d<bestDist){bestDist=d;best={comp:c,pin:pin,x:pp.x,y:pp.y};}
      });
    });
    return best;
  }

  function findCompAt(wx,wy){
    for(var i=components.length-1;i>=0;i--){
      var c=components[i], def=COMPS[c.type];if(!def) continue;
      var hw=(def.w||2)/2+0.3, hh=(def.h||2)/2+0.3;
      if(wx>=c.x-hw && wx<=c.x+hw && wy>=c.y-hh && wy<=c.y+hh) return c;
    }
    return null;
  }

  function findWirePointAt(wx,wy){
    for(var i=wires.length-1;i>=0;i--){
      var wr=wires[i];
      for(var j=0;j<wr.points.length;j++){
        var pt=wr.points[j];
        if(Math.sqrt((wx-pt.x)*(wx-pt.x)+(wy-pt.y)*(wy-pt.y))<0.4)
          return{wire:wr,idx:j,point:pt};
      }
    }
    return null;
  }

  function findWireSegmentAt(wx,wy){
    for(var i=wires.length-1;i>=0;i--){
      var wr=wires[i];
      for(var j=0;j<wr.points.length-1;j++){
        var p0=wr.points[j],p1=wr.points[j+1];
        var dx=p1.x-p0.x,dy=p1.y-p0.y;
        var len2=dx*dx+dy*dy;
        if(len2===0) continue;
        var t=Math.max(0,Math.min(1,((wx-p0.x)*dx+(wy-p0.y)*dy)/len2));
        var px=p0.x+t*dx,py=p0.y+t*dy;
        if(Math.sqrt((wx-px)*(wx-px)+(wy-py)*(wy-py))<0.3)
          return{wire:wr,idx:j,x:px,y:py};
      }
    }
    return null;
  }

  // ─── Drawing ───
  function drawGrid(){
    var w=gridC.width,h=gridC.height;
    gridCtx.clearRect(0,0,w,h);
    var step=GRID*zoom;
    if(step<4) return;
    gridCtx.strokeStyle='rgba(34,48,65,'+(step>8?0.4:0.15)+')';
    gridCtx.lineWidth=0.5;
    var offX=panX%step, offY=panY%step;
    gridCtx.beginPath();
    for(var x=offX;x<w;x+=step){gridCtx.moveTo(x,0);gridCtx.lineTo(x,h);}
    for(var y=offY;y<h;y+=step){gridCtx.moveTo(0,y);gridCtx.lineTo(w,y);}
    gridCtx.stroke();
  }

  function drawSchematic(){
    schCtx.clearRect(0,0,schC.width,schC.height);

    // Wires
    wires.forEach(function(wr){
      var isSel=wr===selectedWire;
      schCtx.strokeStyle=isSel?'#d9a83a':'#58a36a';
      schCtx.lineWidth=isSel?2.5:2;
      schCtx.beginPath();
      var p0=worldToScreen(wr.points[0].x,wr.points[0].y);
      schCtx.moveTo(p0.x,p0.y);
      for(var j=1;j<wr.points.length;j++){
        var p=worldToScreen(wr.points[j].x,wr.points[j].y);
        schCtx.lineTo(p.x,p.y);
      }
      schCtx.stroke();

      // Wire points
      wr.points.forEach(function(pt,idx){
        var sp=worldToScreen(pt.x,pt.y);
        var isEnd=idx===0||idx===wr.points.length-1;
        schCtx.fillStyle=isEnd?'#58a36a':'#d9a83a';
        schCtx.beginPath();
        schCtx.arc(sp.x,sp.y,(isEnd?4:3)*zoom,0,Math.PI*2);
        schCtx.fill();
      });
    });

    // Components
    components.forEach(function(comp){
      var def=COMPS[comp.type];if(!def) return;
      var sp=worldToScreen(comp.x,comp.y);
      var isSel=comp===selectedComp;

      schCtx.save();
      schCtx.translate(sp.x,sp.y);
      schCtx.scale(zoom,zoom);
      if(comp.rot) schCtx.rotate(Math.PI/2*comp.rot);
      if(comp.mir) schCtx.scale(-1,1);

      if(isSel){
        schCtx.strokeStyle='rgba(217,168,58,0.4)';schCtx.lineWidth=2/zoom;
        var hw=(def.w||2)*GRID/2+GRID*0.4, hh=(def.h||2)*GRID/2+GRID*0.4;
        schCtx.strokeRect(-hw,-hh,hw*2,hh*2);
      }

      def.draw(schCtx,0,0);
      schCtx.restore();

      // Labels
      var lx=sp.x+(def.w||2)*GRID*zoom*0.5+6;
      var ly=sp.y-GRID*zoom*0.3;
      schCtx.fillStyle=isSel?'#d9a83a':'#93a1b0';
      schCtx.font=(10*zoom)+'px monospace';
      schCtx.fillText(comp.ref||'',lx,ly);
      if(comp.value){
        schCtx.fillStyle='#5c6875';
        schCtx.font=(9*zoom)+'px monospace';
        schCtx.fillText(comp.value,lx,ly+12*zoom);
      }
    });
  }

  function drawOverlay(){
    ovrCtx.clearRect(0,0,ovrC.width,ovrC.height);

    // Placement preview
    if(tool==='place' && placing && mouseWorld){
      var def=COMPS[placing];if(!def) return;
      var sx=snap(mouseWorld.x), sy=snap(mouseWorld.y);
      var sp=worldToScreen(sx,sy);
      ovrCtx.save();ovrCtx.globalAlpha=0.5;
      ovrCtx.translate(sp.x,sp.y);ovrCtx.scale(zoom,zoom);
      def.draw(ovrCtx,0,0);
      ovrCtx.restore();
    }

    // Wire preview
    if(tool==='wire' && wireStart && mouseWorld){
      var sp0=worldToScreen(wireStart.x,wireStart.y);
      var endX=snap(mouseWorld.x), endY=snap(mouseWorld.y);
      var nearPin=findPinAt(mouseWorld.x,mouseWorld.y);
      if(nearPin){endX=nearPin.x;endY=nearPin.y;}
      var sp1=worldToScreen(endX,endY);

      // Snap indicator
      if(nearPin){
        ovrCtx.strokeStyle='#d9a83a';ovrCtx.lineWidth=2;
        ovrCtx.beginPath();ovrCtx.arc(sp1.x,sp1.y,8*zoom,0,Math.PI*2);ovrCtx.stroke();
      }

      ovrCtx.strokeStyle=nearPin?'#d9a83a':'rgba(88,163,106,0.6)';
      ovrCtx.lineWidth=2;ovrCtx.setLineDash([4,4]);
      ovrCtx.beginPath();ovrCtx.moveTo(sp0.x,sp0.y);
      var mx=(sp0.x+sp1.x)/2;
      ovrCtx.lineTo(mx,sp0.y);ovrCtx.lineTo(mx,sp1.y);ovrCtx.lineTo(sp1.x,sp1.y);
      ovrCtx.stroke();ovrCtx.setLineDash([]);
    }

    // Delete mode hover highlight
    if(tool==='delete' && mouseWorld){
      var comp=findCompAt(mouseWorld.x,mouseWorld.y);
      var wp=findWirePointAt(mouseWorld.x,mouseWorld.y);
      var ws=!wp&&findWireSegmentAt(mouseWorld.x,mouseWorld.y);

      if(comp){
        var def=COMPS[comp.type];
        var sp=worldToScreen(comp.x,comp.y);
        ovrCtx.strokeStyle='rgba(200,69,44,0.5)';ovrCtx.lineWidth=2;
        var hw=(def.w||2)*GRID*zoom/2+GRID*0.4*zoom, hh=(def.h||2)*GRID*zoom/2+GRID*0.4*zoom;
        ovrCtx.strokeRect(sp.x-hw,sp.y-hh,hw*2,hh*2);
      } else if(wp){
        var sp=worldToScreen(wp.point.x,wp.point.y);
        ovrCtx.strokeStyle='#c8452c';ovrCtx.lineWidth=2;
        ovrCtx.beginPath();ovrCtx.arc(sp.x,sp.y,8*zoom,0,Math.PI*2);ovrCtx.stroke();
      } else if(ws){
        var sp0=worldToScreen(ws.wire.points[ws.idx].x,ws.wire.points[ws.idx].y);
        var sp1=worldToScreen(ws.wire.points[ws.idx+1].x,ws.wire.points[ws.idx+1].y);
        ovrCtx.strokeStyle='#c8452c';ovrCtx.lineWidth=3;
        ovrCtx.beginPath();ovrCtx.moveTo(sp0.x,sp0.y);ovrCtx.lineTo(sp1.x,sp1.y);ovrCtx.stroke();
      }
    }
  }

  function drawAll(){drawGrid();drawSchematic();drawOverlay();}

  // ─── Mouse ───
  function getMousePos(e){var r=ovrC.getBoundingClientRect();return{sx:e.clientX-r.left,sy:e.clientY-r.top};}

  function pushUndo(){undoStack.push(JSON.stringify({c:components,w:wires}));if(undoStack.length>50)undoStack.shift();}
  function undo(){if(!undoStack.length)return;var s=JSON.parse(undoStack.pop());components=s.c;wires=s.w;selectedComp=null;selectedWire=null;drawAll();updateProps();}

  ovrC.addEventListener('mousedown',function(e){
    var pos=getMousePos(e);
    var w=screenToWorld(pos.sx,pos.sy);
    mouseWorld=w;

    // Middle button = pan
    if(e.button===1){panning=true;panStart={x:pos.sx-panX,y:pos.sy-panY};e.preventDefault();return;}

    // ─── DELETE MODE: single click to delete ───
    if(tool==='delete'){
      var comp=findCompAt(w.x,w.y);
      if(comp){
        pushUndo();
        components=components.filter(function(c){return c!==comp});
        if(selectedComp===comp) selectedComp=null;
        drawAll();updateProps();
        return;
      }
      var wp=findWirePointAt(w.x,w.y);
      if(wp){
        pushUndo();
        if(wp.wire.points.length>2){
          wp.wire.points.splice(wp.idx,1);
        } else {
          wires=wires.filter(function(wr){return wr!==wp.wire});
        }
        if(selectedWire===wp.wire && wp.wire.points.length<=1) selectedWire=null;
        drawAll();
        return;
      }
      var ws=findWireSegmentAt(w.x,w.y);
      if(ws){
        pushUndo();
        wires=wires.filter(function(wr){return wr!==ws.wire});
        if(selectedWire===ws.wire) selectedWire=null;
        drawAll();
        return;
      }
      return;
    }

    // ─── PLACE MODE ───
    if(tool==='place' && placing){
      pushUndo();
      var def=COMPS[placing];
      var ref=def.label+(nextRef[def.label]||'');
      nextRef[def.label]=(nextRef[def.label]||1)+1;
      var comp={id:'c'+Date.now()+Math.random().toString(36).slice(2,5),type:placing,
        x:snap(w.x),y:snap(w.y),rot:0,mir:false,ref:ref,value:'',label:''};
      components.push(comp);
      selectedComp=comp;
      // Immediately start dragging the just-placed component
      dragging=true;dragComp=comp;
      dragOffset={x:0,y:0};
      drawAll();updateProps();
      return;
    }

    // ─── WIRE MODE ───
    if(tool==='wire'){
      // If we already have a wire start, this click ends it
      if(wireStart){
        var pin=findPinAt(w.x,w.y);
        var endX=pin?pin.x:snap(w.x);
        var endY=pin?pin.y:snap(w.y);
        if(Math.abs(endX-wireStart.x)>0.1||Math.abs(endY-wireStart.y)>0.1){
          pushUndo();
          var pts=[{x:wireStart.x,y:wireStart.y}];
          var mx=(wireStart.x+endX)/2;
          pts.push({x:mx,y:wireStart.y});
          pts.push({x:mx,y:endY});
          pts.push({x:endX,y:endY});
          wires.push({id:'w'+Date.now(),points:pts});
          // Continue chaining from end
          wireStart={x:endX,y:endY};
        }
        drawAll();
        return;
      }
      // Start new wire
      var pin=findPinAt(w.x,w.y);
      wireStart=pin?{x:pin.x,y:pin.y}:{x:snap(w.x),y:snap(w.y)};
      return;
    }

    // ─── SELECT MODE (default) ───
    // Try wire point first (for dragging)
    var wp=findWirePointAt(w.x,w.y);
    if(wp){
      selectedWire=wp.wire;selectedComp=null;
      draggingWirePoint=true;dragWireInfo=wp;
      pushUndo();
      drawAll();updateProps();
      return;
    }

    // Then component
    var comp=findCompAt(w.x,w.y);
    if(comp){
      selectedComp=comp;selectedWire=null;
      dragging=true;dragComp=comp;
      dragOffset={x:w.x-comp.x,y:w.y-comp.y};
      pushUndo();
      drawAll();updateProps();
      return;
    }

    // Then wire segment (add waypoint)
    var ws=findWireSegmentAt(w.x,w.y);
    if(ws){
      pushUndo();
      ws.wire.points.splice(ws.idx+1,0,{x:snap(ws.x),y:snap(ws.y)});
      selectedWire=ws.wire;selectedComp=null;
      drawAll();updateProps();
      return;
    }

    // Empty space = deselect + pan
    selectedComp=null;selectedWire=null;
    panning=true;panStart={x:pos.sx-panX,y:pos.sy-panY};
    drawAll();updateProps();
  });

  ovrC.addEventListener('mousemove',function(e){
    var pos=getMousePos(e);
    var w=screenToWorld(pos.sx,pos.sy);
    mouseWorld=w;

    document.getElementById('statusCoords').textContent=snap(w.x)+', '+snap(w.y);

    if(panning&&panStart){panX=pos.sx-panStart.x;panY=pos.sy-panStart.y;drawAll();return;}
    if(dragging&&dragComp){
      dragComp.x=snap(w.x-dragOffset.x);
      dragComp.y=snap(w.y-dragOffset.y);
      drawAll();return;
    }
    if(draggingWirePoint&&dragWireInfo){
      dragWireInfo.point.x=snap(w.x);
      dragWireInfo.point.y=snap(w.y);
      drawAll();return;
    }

    drawOverlay();
  });

  ovrC.addEventListener('mouseup',function(e){
    if(panning){panning=false;panStart=null;return;}
    if(dragging){dragging=false;dragComp=null;return;}
    if(draggingWirePoint){draggingWirePoint=false;dragWireInfo=null;return;}
  });

  ovrC.addEventListener('wheel',function(e){
    e.preventDefault();
    var pos=getMousePos(e);
    var oldZoom=zoom;
    zoom*=e.deltaY<0?1.15:0.87;
    zoom=Math.max(0.2,Math.min(5,zoom));
    panX=pos.sx-(pos.sx-panX)*(zoom/oldZoom);
    panY=pos.sy-(pos.sy-panY)*(zoom/oldZoom);
    drawAll();
  });

  ovrC.addEventListener('dblclick',function(e){
    var pos=getMousePos(e);
    var w=screenToWorld(pos.sx,pos.sy);
    var comp=findCompAt(w.x,w.y);
    if(comp){
      selectedComp=comp;
      var v=prompt('value:',comp.value||'');
      if(v!==null){pushUndo();comp.value=v;drawAll();updateProps();}
    }
  });

  // ─── Tools ───
  function setTool(t){
    tool=t;
    if(t!=='place'){placing=null;document.querySelectorAll('.pal-item').forEach(function(e){e.classList.remove('active')});}
    if(t!=='wire') wireStart=null;
    updateToolUI();
    drawOverlay();
  }

  function updateToolUI(){
    document.getElementById('toolSelect').classList.toggle('active',tool==='select');
    document.getElementById('toolWire').classList.toggle('active',tool==='wire');
    document.getElementById('toolDelete').classList.toggle('active',tool==='delete');
    document.getElementById('toolDelete').classList.toggle('active-del',tool==='delete');

    wrap.classList.toggle('mode-delete',tool==='delete');
    wrap.classList.toggle('mode-wire',tool==='wire');

    var modeEl=document.getElementById('statusMode');
    if(tool==='delete'){
      modeEl.textContent='DELETE · click to remove';
      modeEl.className='mode del';
    } else if(tool==='wire'){
      modeEl.textContent=wireStart?'wire · click to end · ESC to cancel':'wire · click pin to start';
      modeEl.className='mode';
    } else if(tool==='place'){
      modeEl.textContent='place: '+(placing||'?');
      modeEl.className='mode';
    } else {
      modeEl.textContent='select · drag to move';
      modeEl.className='mode';
    }
  }

  document.getElementById('toolSelect').onclick=function(){setTool('select')};
  document.getElementById('toolWire').onclick=function(){setTool('wire');showTip('click pin to start wire')};
  document.getElementById('toolDelete').onclick=function(){setTool('delete');showTip('click anything to delete it','del')};
  document.getElementById('toolRotate').onclick=function(){if(selectedComp){pushUndo();selectedComp.rot=(selectedComp.rot+1)%4;drawAll();}};
  document.getElementById('toolMirror').onclick=function(){if(selectedComp){pushUndo();selectedComp.mir=!selectedComp.mir;drawAll();}};
  document.getElementById('zoomIn').onclick=function(){zoom=Math.min(5,zoom*1.3);drawAll()};
  document.getElementById('zoomOut').onclick=function(){zoom=Math.max(0.2,zoom/1.3);drawAll()};
  document.getElementById('zoomFit').onclick=function(){
    if(!components.length){panX=ovrC.width/2;panY=ovrC.height/2;zoom=1;drawAll();return;}
    var minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
    components.forEach(function(c){var d=COMPS[c.type];var hw=(d.w||2)/2+1,hh=(d.h||2)/2+1;
      minX=Math.min(minX,c.x-hw);minY=Math.min(minY,c.y-hh);maxX=Math.max(maxX,c.x+hw);maxY=Math.max(maxY,c.y+hh);});
    wires.forEach(function(wr){wr.points.forEach(function(p){
      minX=Math.min(minX,p.x);minY=Math.min(minY,p.y);maxX=Math.max(maxX,p.x);maxY=Math.max(maxY,p.y);});});
    var bw=maxX-minX,bh=maxY-minY;
    zoom=Math.min(ovrC.width/(bw*GRID+80),ovrC.height/(bh*GRID+80));
    zoom=Math.max(0.2,Math.min(5,zoom));
    panX=ovrC.width/2-(minX+bw/2)*GRID*zoom;
    panY=ovrC.height/2-(minY+bh/2)*GRID*zoom;
    drawAll();
  };

  // ─── Properties ───
  function updateProps(){
    var el=document.getElementById('propsContent');
    if(selectedComp){
      var c=selectedComp;
      el.innerHTML=
        '<div class="prop-row"><span class="prop-label">type</span><span style="font-size:11px;color:var(--green)">'+c.type+'</span></div>'+
        '<div class="prop-row"><span class="prop-label">ref</span><input class="prop-input" id="pRef" value="'+(c.ref||'')+'"></div>'+
        '<div class="prop-row"><span class="prop-label">value</span><input class="prop-input" id="pVal" value="'+(c.value||'')+'"></div>'+
        '<div class="prop-row"><span class="prop-label">pos</span><span style="font-size:10px;color:#5c6875">'+c.x+', '+c.y+' · rot '+c.rot*90+'°</span></div>'+
        '<div style="margin-top:8px"><button class="tb" style="font-size:9px;padding:4px 8px" id="pDel">✕ delete</button> '+
        '<button class="tb" style="font-size:9px;padding:4px 8px" id="pRot">↻ rotate</button> '+
        '<button class="tb" style="font-size:9px;padding:4px 8px" id="pMir">⇔ mirror</button></div>';
      el.querySelector('#pRef').onchange=function(){pushUndo();c.ref=this.value;drawAll()};
      el.querySelector('#pVal').onchange=function(){pushUndo();c.value=this.value;drawAll()};
      el.querySelector('#pDel').onclick=function(){pushUndo();components=components.filter(function(x){return x!==c});selectedComp=null;drawAll();updateProps()};
      el.querySelector('#pRot').onclick=function(){pushUndo();c.rot=(c.rot+1)%4;drawAll()};
      el.querySelector('#pMir').onclick=function(){pushUndo();c.mir=!c.mir;drawAll()};
    } else if(selectedWire){
      el.innerHTML='<div style="font-size:10px;color:#5c6875">wire · '+selectedWire.points.length+' points<br><br>'+
        '<button class="tb" style="font-size:9px;padding:4px 8px" id="wDel">✕ delete wire</button></div>';
      el.querySelector('#wDel').onclick=function(){pushUndo();wires=wires.filter(function(w){return w!==selectedWire});selectedWire=null;drawAll();updateProps()};
    } else {
      el.innerHTML='<span style="font-size:10px;color:#3a4a5c;font-style:italic">select anything</span>';
    }
  }

  // ─── Bench notes ───
  var benchEl=document.getElementById('benchNotes');
  benchEl.value=localStorage.getItem('axiom_bench_notes')||'';
  benchEl.addEventListener('input',function(){localStorage.setItem('axiom_bench_notes',benchEl.value)});

  // ─── Export/Import ───
  document.getElementById('exportPng').onclick=function(){
    var tmp=document.createElement('canvas');
    var bb=getBounds();var pad=40;
    tmp.width=(bb.maxX-bb.minX)*GRID+pad*2;tmp.height=(bb.maxY-bb.minY)*GRID+pad*2;
    var tc=tmp.getContext('2d');tc.fillStyle='#0a0d12';tc.fillRect(0,0,tmp.width,tmp.height);
    var oldPan={x:panX,y:panY},oldZoom=zoom;
    zoom=1;panX=-bb.minX*GRID+pad;panY=-bb.minY*GRID+pad;
    drawGrid();drawSchematic();
    tc.drawImage(schC,0,0,tmp.width,tmp.height,0,0,tmp.width,tmp.height);
    panX=oldPan.x;panY=oldPan.y;zoom=oldZoom;drawAll();
    var a=document.createElement('a');a.href=tmp.toDataURL();a.download='schematic-'+Date.now()+'.png';a.click();
  };

  function getBounds(){
    if(!components.length&&!wires.length) return{minX:-5,minY:-5,maxX:5,maxY:5};
    var minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
    components.forEach(function(c){var d=COMPS[c.type];var hw=(d.w||2)/2+1,hh=(d.h||2)/2+1;
      minX=Math.min(minX,c.x-hw);minY=Math.min(minY,c.y-hh);maxX=Math.max(maxX,c.x+hw);maxY=Math.max(maxY,c.y+hh);});
    wires.forEach(function(wr){wr.points.forEach(function(p){
      minX=Math.min(minX,p.x);minY=Math.min(minY,p.y);maxX=Math.max(maxX,p.x);maxY=Math.max(maxY,p.y);});});
    return{minX:minX,minY:minY,maxX:maxX,maxY:maxY};
  }

  document.getElementById('exportJson').onclick=function(){
    var data={components:components,wires:wires,notes:benchEl.value,refs:nextRef,date:new Date().toISOString()};
    var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='schematic-'+Date.now()+'.json';a.click();
    localStorage.setItem('axiom_schematic_last',JSON.stringify(data));
  };

  document.getElementById('importJson').onclick=function(){document.getElementById('fileInput').click()};
  document.getElementById('fileInput').onchange=function(e){
    var f=e.target.files[0];if(!f)return;
    var r=new FileReader();
    r.onload=function(){
      try{
        var d=JSON.parse(r.result);
        if(d.components)components=d.components;
        if(d.wires)wires=d.wires;
        if(d.refs)nextRef=d.refs;
        if(d.notes){benchEl.value=d.notes;localStorage.setItem('axiom_bench_notes',d.notes);}
        selectedComp=null;selectedWire=null;
        drawAll();updateProps();
        document.getElementById('zoomFit').click();
      }catch(ex){alert('bad file');}
    };
    r.readAsText(f);e.target.value='';
  };

  // ─── Help tip ───
  function showTip(msg,type){
    var tip=document.getElementById('helpTip');
    tip.textContent=msg;
    tip.className='help-tip show'+(type==='del'?' del':'');
    clearTimeout(tip._t);
    tip._t=setTimeout(function(){tip.classList.remove('show')},2500);
  }

  // ─── Keyboard ───
  document.addEventListener('keydown',function(e){
    if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
    if(e.key==='v'||e.key==='V') setTool('select');
    if(e.key==='w'||e.key==='W') setTool('wire');
    if(e.key==='x'||e.key==='X') setTool('delete');
    if(e.key==='r'||e.key==='R'){if(selectedComp){pushUndo();selectedComp.rot=(selectedComp.rot+1)%4;drawAll();}}
    if(e.key==='m'||e.key==='M'){if(selectedComp){pushUndo();selectedComp.mir=!selectedComp.mir;drawAll();}}
    if(e.key==='Escape'){
      if(tool==='wire') wireStart=null;
      setTool('select');
      drawOverlay();
    }
    if((e.metaKey||e.ctrlKey)&&e.key==='z'){e.preventDefault();undo();}
    if((e.metaKey||e.ctrlKey)&&e.key==='s'){e.preventDefault();document.getElementById('exportJson').click();}
    if(e.key==='Delete'||e.key==='Backspace'){
      if(selectedComp){pushUndo();components=components.filter(function(c){return c!==selectedComp});selectedComp=null;drawAll();updateProps();}
      else if(selectedWire){pushUndo();wires=wires.filter(function(w){return w!==selectedWire});selectedWire=null;drawAll();updateProps();}
    }
  });

  // ─── Init ───
  buildPalette();
  try{var last=JSON.parse(localStorage.getItem('axiom_schematic_last')||'null');if(last){components=last.components||[];wires=last.wires||[];nextRef=last.refs||{};}}catch(e){}
  resize();
  panX=ovrC.width/2;panY=ovrC.height/2;
  drawAll();updateProps();
  showTip('click palette to place · drag to move · X to delete');
})();
</script>
</body>
</html>

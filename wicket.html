<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THE WICKET — employee bypass</title>
<style>
  body{margin:0;background:#0a0d12;overflow:hidden;font-family:ui-monospace,Consolas,monospace;color:#5c6875}
  canvas{display:block;position:fixed;inset:0}
  .panel{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;z-index:2}
  .brand{font-size:13px;letter-spacing:.35em;color:#c8452c}
  .sub{margin-top:8px;font-size:10px;letter-spacing:.2em}
  input{margin-top:18px;background:rgba(3,4,7,.6);border:1px solid #223041;color:#e8e4d8;
    font-family:inherit;font-size:12px;padding:10px 14px;width:min(300px,80vw);text-align:center;letter-spacing:.08em}
  input::placeholder{color:#5c6875}
  .btn{margin-top:12px;background:none;border:1px solid #d9a83a;color:#d9a83a;font-family:inherit;
    font-size:11px;letter-spacing:.15em;padding:9px 20px;cursor:pointer}
  .btn:hover{background:#d9a83a;color:#0a0d12}
  .status{margin-top:12px;font-size:11px;min-height:14px;color:#93a1b0}
  .status a{color:#3f7fc1;text-decoration:none}
  .readout{position:fixed;bottom:16px;left:16px;font-size:10px;letter-spacing:.1em;z-index:2}
  .readout b{color:#d9a83a}
</style>
</head>
<body>
<canvas id="species"></canvas>
<div class="panel">
  <div class="brand">THE WICKET</div>
  <div class="sub">employee bypass · the small door in the big gate</div>
  <input id="word" placeholder="the word the ferryman gave you" maxlength="24">
  <br><button class="btn" id="knock">knock</button>
  <div class="status" id="stat">the rose is listening ..</div>
</div>
<div class="readout">GEN: <b id="gen">0</b> &nbsp;|&nbsp; PETALS: <b id="count">0</b> &nbsp;|&nbsp; PULSE: <b>e^(-r)</b></div>

<script>
/* the living insignia — the waiting screen */
const cv=document.getElementById('species'); const g=cv.getContext('2d');
let W,H; function fit(){ W=cv.width=innerWidth; H=cv.height=innerHeight; }
addEventListener('resize',fit); fit();
const PHI=1.6180339887;
const GOLDEN_ANGLE=137.508*(Math.PI/180);
const MAX_PETALS=600; const GROWTH_RATE=0.8;
let currentPetals=0, generation=0, pulseWave=0;
window.__bloom=false;
addEventListener('click',()=>{ pulseWave=0; });
function tick(){
  g.fillStyle='rgba(10,13,18,0.15)'; g.fillRect(0,0,W,H);
  const cx=W/2, cy=H/2, scale=Math.min(W,H)/60;
  if(currentPetals<MAX_PETALS){
    currentPetals+=GROWTH_RATE;
    if(currentPetals>=MAX_PETALS){ generation++; currentPetals=0;
      document.getElementById('gen').textContent=generation; }
  }
  pulseWave+=2.5;
  if(pulseWave>scale*Math.sqrt(MAX_PETALS)+50) pulseWave=-20;
  document.getElementById('count').textContent=Math.floor(currentPetals);
  g.strokeStyle='rgba(200,69,44,0.1)'; g.lineWidth=2;
  g.beginPath();
  for(let i=0;i<6;i++){ const a=i*Math.PI/3;
    const px=cx+Math.cos(a)*scale*25, py=cy+Math.sin(a)*scale*25;
    if(i===0) g.moveTo(px,py); else g.lineTo(px,py); }
  g.closePath(); g.stroke();
  for(let n=0;n<currentPetals;n++){
    const angle=n*GOLDEN_ANGLE, r=scale*Math.sqrt(n);
    const x=cx+r*Math.cos(angle), y=cy+r*Math.sin(angle);
    let heat=Math.exp(-Math.abs(r-pulseWave)*0.15);
    if(window.__bloom) heat=Math.max(heat,0.6);
    const red=Math.floor(40+215*heat), grn=Math.floor(30+130*heat), blu=Math.floor(30+10*heat);
    g.fillStyle='rgba('+red+','+grn+','+blu+','+(0.3+0.7*heat)+')';
    g.save(); g.translate(x,y); g.rotate(angle);
    g.beginPath(); g.ellipse(0,0,2+heat*4,6+heat*8,0,0,Math.PI*2); g.fill();
    g.restore();
    if(heat>0.85){ g.fillStyle='rgba(255,240,200,'+heat+')';
      g.beginPath(); g.arc(x,y,1.5,0,Math.PI*2); g.fill(); }
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>

<script>
(function(){
  if(!(localStorage.getItem('hive_patron')||localStorage.getItem('hive_user'))) return;
  document.body.classList.add('quiet');
  var st=document.createElement('style');
  st.textContent='body.quiet *{visibility:hidden}body.quiet canvas{visibility:visible}body.quiet #holdHint,body.quiet #holdRing{visibility:visible}';
  document.head.appendChild(st);
  var hint=document.createElement('div'); hint.id='holdHint';
  hint.style.cssText='position:fixed;left:50%;bottom:26px;transform:translateX(-50%);font:10px ui-monospace,Consolas,monospace;letter-spacing:.2em;color:#5c6875';
  hint.textContent='hold the rose \u00b7 touch-login';
  document.body.appendChild(hint);
  var ring=document.createElement('canvas'); ring.id='holdRing'; ring.width=96; ring.height=96;
  ring.style.cssText='position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none;display:none';
  document.body.appendChild(ring);
  var rg=ring.getContext('2d'), t0=0, raf=null, holding=false;
  function drawRing(p){
    rg.clearRect(0,0,96,96);
    rg.strokeStyle='rgba(92,104,117,.4)'; rg.lineWidth=3;
    rg.beginPath(); rg.arc(48,48,34,0,7); rg.stroke();
    rg.strokeStyle='#d9a83a'; rg.lineCap='round';
    rg.beginPath(); rg.arc(48,48,34,-Math.PI/2,-Math.PI/2+p*Math.PI*2); rg.stroke();
  }
  function loop(now){
    if(!holding) return;
    var p=Math.min(1,(now-t0)/2000);
    drawRing(p);
    if(p>=1){ holding=false;
      localStorage.setItem('hive_access',String(Date.now()+30*864e5));
      sessionStorage.setItem('hive_session','1');
      location.href='core.html'; return; }
    raf=requestAnimationFrame(loop);
  }
  function down(){ holding=true; t0=performance.now(); ring.style.display='block'; raf=requestAnimationFrame(loop); }
  function up(){ holding=false; cancelAnimationFrame(raf); ring.style.display='none'; }
  addEventListener('touchstart',down,{passive:true});
  addEventListener('touchend',up); addEventListener('touchcancel',up);
  addEventListener('mousedown',down); addEventListener('mouseup',up);
})();
</script>

<script>
(function(){
  var AN='fox wolf bear hare lynx raven crow owl wren sparrow hawk eagle heron crane toad frog newt adder viper boar stag elk moose otter seal orca whale shark ray moth bee wasp ant beetle cricket mantis spider badger marten ferret weasel coyote mouse';
  var A=AN.split(' ');
  function parseWord(w){
    w=(w||'').trim().toLowerCase();
    if(!w) return null;
    if(w==='ragewood') return {role:'user'};
    for(var i=0;i<A.length;i++) for(var j=0;j<A.length;j++){
      if(i===j) continue;
      var pre=A[i]+A[j];
      if(w.lastIndexOf(pre,0)===0){
        var num=w.slice(pre.length);
        if(/^\d{1,2}$/.test(num)&&num!=='00') return {role:'member',name:w};
      }
    }
    return null;
  }
  function roster(){ try{ return JSON.parse(localStorage.getItem('hive_roster'))||{}; }catch(e){ return {}; } }
  function stamp(name,pillar){ var r=roster(); var e=r[name]||{first:Date.now(),pillar:pillar||'',tier:1};
      e.last=Date.now(); if(pillar) e.pillar=pillar; r[name]=e; localStorage.setItem('hive_roster',JSON.stringify(r)); if(window.hiveCloudSync) window.hiveCloudSync(r); }
  function enter(role,name,pillar){
    localStorage.setItem('hive_access',String(Date.now()+30*864e5));
    sessionStorage.setItem('hive_session','1');
    if(role==='user'){ localStorage.setItem('hive_user','1'); localStorage.setItem('hive_name','Quilliinn Primrose'); }
    else { localStorage.setItem('hive_member','1'); localStorage.setItem('hive_name',name);
      localStorage.setItem('hive_pillar',pillar); if(!localStorage.getItem('hive_tier')) localStorage.setItem('hive_tier','1');
      stamp(name,pillar); }
    location.href='core.html';
  }
  var inp=document.querySelector('input'), btn=null, bs=document.querySelectorAll('button');
  for(var i=0;i<bs.length;i++) if(/knock/i.test(bs[i].textContent||'')) btn=bs[i];
  if(!inp||!btn) return;
        function doKnock(){
        var r=parseWord(inp.value);
    if(!r) return;
    if(r.role==='user'){ enter('user'); return; }
    var p=localStorage.getItem('hive_pillar');
    if(p){ enter('member',r.name,p); return; }
    var ov=document.createElement('div');
    ov.style.cssText='position:fixed;inset:0;background:rgba(5,7,11,.94);z-index:50;display:flex;align-items:center;justify-content:center;font-family:ui-monospace,Consolas,monospace';
    ov.innerHTML='<div style="text-align:center;color:#93a1b0;font-size:11px;letter-spacing:.2em">which pillar do you stand under?<br><br>'
      +['axiom','eigen','baseline','keystone'].map(function(x){ return '<button data-p="'+x+'" style="background:none;border:1px solid #223041;color:#e8e4d8;font-family:inherit;font-size:12px;letter-spacing:.15em;padding:10px 16px;margin:4px;cursor:pointer">'+x+'</button>'; }).join('')
      +'</div>';
    document.body.appendChild(ov);
         ov.addEventListener('click', function(e){ var p2=e.target&&e.target.getAttribute&&e.target.getAttribute('data-p'); if(p2) enter('member',r.name,p2); });
  }
  btn.addEventListener('click', doKnock);
  inp.addEventListener('keydown', function(e){ if(e.key==='Enter') doKnock(); });
})();
</script>
  
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a0d12">
<title>the grid | Inn.Visible</title>
<style>
  :root{--bg:#0a0d12;--line:#223041;--ink:#e8e4d8;--dim:#93a1b0;--blue:#3f7fc1;--gold:#d9a83a;--green:#58a36a;--mono:ui-monospace,Consolas,monospace}
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--mono);display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
  header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);flex-shrink:0}
  header .t{font-size:11px;letter-spacing:.3em;color:var(--blue)}
  header .sub{font-size:9px;color:#5c6875;letter-spacing:.15em;font-style:italic}
  header a{color:var(--dim);font-size:10px;letter-spacing:.15em;text-decoration:none}
  .bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);background:rgba(3,4,7,.6);flex-shrink:0}
  button{background:none;border:1px solid var(--line);color:var(--dim);font:10px var(--mono);letter-spacing:.12em;padding:6px 10px;cursor:pointer}
  button:hover{border-color:var(--gold);color:var(--gold)}
  button.on{border-color:var(--gold);color:var(--gold)}
  .bar input{background:#0e141b;border:1px solid var(--line);color:var(--ink);font:12px var(--mono);padding:7px 10px;outline:none}
  .bar input:focus{border-color:var(--blue)}
  #fx{flex:1;min-width:120px}
  #rng{width:56px;flex:none} #grd{width:46px;flex:none}
  #wrap{position:relative;flex:1 1 0;min-height:0}
  #cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  #cv.grabbing{cursor:grabbing}
  #status{flex-shrink:0;padding:6px 12px;border-top:1px solid var(--line);font-size:9px;letter-spacing:.12em;color:#5c6875;display:flex;gap:10px;flex-wrap:wrap}
  #status .r{color:#e5735a} #status .g{color:var(--green)}
  .sp{flex:1}
</style>
</head>
<body>
<header><span class="t">THE GRID</span><span class="sub">the third dimension, rollable</span><a href="axiom.html">axiom ↩</a></header>
<div class="bar">
  <button id="mCurve">curve</button><button id="mSurface" class="on">surface</button><button id="mSolid">solid</button>
  <input id="fx" type="text" spellcheck="false" placeholder="z = f(x, y) · curve reads y = f(x)">
  <input id="rng" type="text" title="domain \u00b1 (x and y range)" placeholder="\u00b16.5">
  <input id="grd" type="text" title="grid resolution (8\u201364)" placeholder="26">
  <button id="plot">plot it</button>
  <span id="presets" style="display:contents"></span>
  <span class="sp"></span>
  <button id="zin">+</button><button id="zout">−</button><button id="vhome">⌂ view</button><button id="rst">reset</button><button id="sticks">sticks</button>
</div>
<div id="wrap"><canvas id="cv"></canvas></div>
<div id="status"><span id="st1"></span><span class="sp"></span><span id="st2">drag to roll · drag the gold dot · wheel or + − to zoom · sticks live in surface</span></div>
<script>
(function(){
var KEY='hive_grid3d';
var cv=document.getElementById('cv'), x=cv.getContext('2d');
var wrap=document.getElementById('wrap'), fx=document.getElementById('fx');
var rngEl=document.getElementById('rng'), grdEl=document.getElementById('grd');
var st1=document.getElementById('st1'), presets=document.getElementById('presets');
var mode='surface', exprSrc='sin(r*1.6)*exp(-r/4)*3', fn=null;
var roll=0.314, tilt=0.157, zoom=1, sticks=false, solidIdx=0;
var R=6.5, N=26, G={x:1.5,y:1.0}, GEOM=null, W=1, H=1, cx=1, cy=1, base=1;
var DEF={surface:'sin(r*1.6)*exp(-r/4)*3', curve:'sin(x)', solid:''};
var PRE={surface:[['wave','sin(x)*cos(y)'],['saddle','(x^2-y^2)/4'],['ripple','sin(r*1.6)*exp(-r/4)*3'],['gauss','3*exp(-(r^2)/8)'],['plane','(x+y)/4']],
         solid:[['sphere',''],['torus',''],['box',''],['cone','']]};
try{ var S=JSON.parse(localStorage.getItem(KEY)||'null');
  if(S){ mode=S.mode||mode; exprSrc=typeof S.expr==='string'?S.expr:exprSrc; roll=+S.roll||roll; tilt=+S.tilt||tilt;
    zoom=+S.zoom||zoom; sticks=!!S.sticks; solidIdx=S.solidIdx|0; if(S.g) G=S.g;
    if(+S.rng) R=Math.max(1,Math.min(50,+S.rng)); if(+S.grd) N=Math.round(Math.max(8,Math.min(64,+S.grd))); } }catch(e){}
function save(){ try{ localStorage.setItem(KEY,JSON.stringify({mode:mode,expr:exprSrc,roll:roll,tilt:tilt,zoom:zoom,sticks:sticks,solidIdx:solidIdx,g:G,rng:R,grd:N})); }catch(e){} }
/* ---- the grammar · function names BEFORE constants, always ---- */
function bin(op,l,r){ return function(px,py){ var a=l(px,py), b=r(px,py);
  return op==='+'?a+b: op==='-'?a-b: op==='*'?a*b: op==='/'?a/b: Math.pow(a,b); }; }
function compile(src){
  var s=String(src).replace(/\s+/g,''), i=0;
  var F={sin:Math.sin,cos:Math.cos,tan:Math.tan,exp:Math.exp,ln:Math.log,
    log:function(v){ return Math.log(v)/Math.LN10; }, sqrt:Math.sqrt, abs:Math.abs};
  function err(m){ throw new Error(m); }
  function starts(c){ return c==='('||/[a-z\u03c0]/.test(c); }
  function primary(){
    var c=s[i];
    if(c==='('){ i++; var v=expr(); if(s[i]!==')') err('paren'); i++; return v; }
    if(c==='-'){ i++; var n=primary(); return function(px,py){ return -n(px,py); }; }
    if(c==='+'){ i++; return primary(); }
    var fm=/^(sin|cos|tan|exp|ln|log|sqrt|abs)/.exec(s.slice(i));
    if(fm){ i+=fm[0].length; var f=F[fm[0]], a=primary(); return function(px,py){ return f(a(px,py)); }; }
    var m=/^(pi|\u03c0|e|x|y|r)/.exec(s.slice(i));
    if(m){ i+=m[0].length;
      if(m[0]==='x') return function(px){ return px; };
      if(m[0]==='y') return function(px,py){ return py; };
      if(m[0]==='r') return function(px,py){ return Math.sqrt(px*px+py*py); };
      if(m[0]==='e') return function(){ return Math.E; };
      return function(){ return Math.PI; }; }
    var nm=/^\d+\.?\d*|^\.\d+/.exec(s.slice(i)); if(!nm) err('term'); i+=nm[0].length;
    var k=parseFloat(nm[0]); return function(){ return k; };
  }
  function power(){ var b=primary(); if(s[i]==='^'){ i++; var e=power(); return bin('^',b,e); } return b; }
  function term(){ var v=power();
    for(;;){ var c=s[i];
      if(c==='*'||c==='/'){ i++; v=bin(c,v,power()); }
      else if(starts(c)){ v=bin('*',v,power()); }
      else break; }
    return v; }
  function expr(){ var v=term();
    while(s[i]==='+'||s[i]==='-'){ var c=s[i]; i++; v=bin(c,v,term()); }
    return v; }
  var f=expr(); if(i<s.length) err('trail');
  return f;
}
/* ---- geometry builds · obey R and N ---- */
function buildSurface(){
  var pts=[], lines=[], zmin=1e9, zmax=-1e9, grid=[];
  for(var i=0;i<N;i++){ grid[i]=[];
    for(var j=0;j<N;j++){
      var px=-R+2*R*j/(N-1), py=-R+2*R*i/(N-1), z=fn(px,py);
      if(!isFinite(z)){ grid[i][j]=-1; continue; }
      z=Math.max(-40,Math.min(40,z));
      grid[i][j]=pts.length; pts.push([px,py,z]);
      if(z<zmin) zmin=z; if(z>zmax) zmax=z; } }
  for(i=0;i<N;i++) for(j=0;j<N;j++){
    var a=grid[i][j];
    if(a<0) continue;
    if(j+1<N&&grid[i][j+1]>=0) lines.push([a,grid[i][j+1]]);
    if(i+1<N&&grid[i+1][j]>=0) lines.push([a,grid[i+1][j]]); }
  GEOM={pts:pts,lines:lines,zmin:zmin,zmax:zmax};
}
function buildCurve(){
  var pts=[], lines=[], M=Math.max(80,N*6), zmin=1e9, zmax=-1e9, prev=-1;
  for(var i=0;i<M;i++){
    var px=-R+2*R*i/(M-1), py=fn(px,0);
    if(!isFinite(py)){ prev=-1; continue; }
    py=Math.max(-40,Math.min(40,py));
    var idx=pts.length; pts.push([px,py,0]);
    if(prev>=0) lines.push([prev,idx]); prev=idx;
    if(py<zmin) zmin=py; if(py>zmax) zmax=py; }
  GEOM={pts:pts,lines:lines,zmin:zmin,zmax:zmax};
}
function buildSolid(){
  var pts=[], lines=[], U=20, V=12, i, j;
  function mesh(fu){ var g=[];
    for(i=0;i<U;i++){ g[i]=[];
      for(j=0;j<V;j++){ g[i][j]=pts.length; pts.push(fu(i/(U-1)*Math.PI*2, -Math.PI/2+j/(V-1)*Math.PI)); } }
    for(i=0;i<U;i++) for(j=0;j<V;j++){
      if(j+1<V) lines.push([g[i][j],g[i][j+1]]);
      if(i+1<U) lines.push([g[i][j],g[i+1][j]]); } }
  if(solidIdx===1) mesh(function(u,v){ return [(3.2+1.2*Math.cos(v))*Math.cos(u),(3.2+1.2*Math.cos(v))*Math.sin(u),1.2*Math.sin(v)]; });
  else if(solidIdx===2){ var c=2.6, corners=[];
    for(i=0;i<8;i++) corners.push([(i&1?c:-c),(i&2?c:-c),(i&4?c:-c)]);
    var E=[[0,1],[0,2],[0,4],[1,3],[1,5],[2,3],[2,6],[3,7],[4,5],[4,6],[5,7],[6,7]];
    E.forEach(function(e){ var a=pts.length; pts.push(corners[e[0]]); pts.push(corners[e[1]]); lines.push([a,a+1]); }); }
  else if(solidIdx===3){ var apex=pts.length; pts.push([0,0,4]);
    var B=16, ring=[];
    for(i=0;i<B;i++){ var u=i/B*Math.PI*2; ring.push(pts.length); pts.push([3*Math.cos(u),3*Math.sin(u),-2]); }
    for(i=0;i<B;i++){ lines.push([ring[i],ring[(i+1)%B]]); lines.push([ring[i],apex]); } }
  else mesh(function(u,v){ return [3.5*Math.cos(v)*Math.cos(u),3.5*Math.cos(v)*Math.sin(u),3.5*Math.sin(v)]; });
  var zmin=1e9, zmax=-1e9;
  pts.forEach(function(p){ if(p[2]<zmin) zmin=p[2]; if(p[2]>zmax) zmax=p[2]; });
  GEOM={pts:pts,lines:lines,zmin:zmin,zmax:zmax};
}
function readDims(){
  var r=parseFloat(rngEl.value), g=parseFloat(grdEl.value);
  if(isFinite(r)&&r>0) R=Math.max(1,Math.min(50,r));
  if(isFinite(g)&&g>0) N=Math.round(Math.max(8,Math.min(64,g)));
  rngEl.value=R; grdEl.value=N;
  base=Math.min(W,H)/(2*R+3);
}
function plot(){
  var msg=''; GEOM=null;
  readDims();
  if(mode!=='solid'){
    try{ fn=compile(exprSrc); }catch(e){ fn=null; msg='the grammar refuses \u00b7 check parens and operators'; }
    if(fn){ try{ if(mode==='surface') buildSurface(); else buildCurve(); }
      catch(e){ fn=null; GEOM=null; msg='the surface collapsed \u00b7 try a gentler formula'; } }
  } else { fn=null; buildSolid(); }
  renderPresets(); draw(msg); save();
}
/* ---- projection + draw ---- */
function proj(p){
  var cr=Math.cos(roll), sr=Math.sin(roll);
  var x1=p[0]*cr-p[1]*sr, y1=p[0]*sr+p[1]*cr;
  var ct=Math.cos(tilt), st=Math.sin(tilt);
  var y2=y1*ct-p[2]*st;
  return [cx+x1*base*zoom, cy-y2*base*zoom];
}
function draw(msg){
  x.clearRect(0,0,W,H);
  x.strokeStyle='rgba(34,48,65,.9)'; x.lineWidth=1;
  var stp=R>10?4:2, i;
  for(i=-Math.floor(R/stp)*stp;i<=R;i+=stp){
    var a=proj([i,-R,0]), b=proj([i,R,0]); x.beginPath(); x.moveTo(a[0],a[1]); x.lineTo(b[0],b[1]); x.stroke();
    a=proj([-R,i,0]); b=proj([R,i,0]); x.beginPath(); x.moveTo(a[0],a[1]); x.lineTo(b[0],b[1]); x.stroke(); }
  x.strokeStyle='rgba(92,104,117,.8)';
  var ax=proj([0,0,0]), az=proj([0,0,R*0.7]);
  x.beginPath(); x.moveTo(ax[0],ax[1]); x.lineTo(az[0],az[1]); x.stroke();
  if(GEOM){
    if(sticks&&mode==='surface'){
      x.strokeStyle='rgba(120,220,200,.6)';
      for(i=0;i<GEOM.pts.length;i+=2){ var p=GEOM.pts[i];
        var g0=proj([p[0],p[1],0]), g1=proj(p);
        x.beginPath(); x.moveTo(g0[0],g0[1]); x.lineTo(g1[0],g1[1]); x.stroke(); }
    } else {
      x.strokeStyle= mode==='curve'?'rgba(232,228,216,.85)':'rgba(120,220,200,.65)';
      x.lineWidth= mode==='curve'?2:1;
      for(i=0;i<GEOM.lines.length;i++){ var L=GEOM.lines[i];
        var p1=proj(GEOM.pts[L[0]]), p2=proj(GEOM.pts[L[1]]);
        x.beginPath(); x.moveTo(p1[0],p1[1]); x.lineTo(p2[0],p2[1]); x.stroke(); }
      x.lineWidth=1; } }
  if(mode!=='solid'&&fn){
    var gz= mode==='curve'? fn(G.x,0) : fn(G.x,G.y);
    if(isFinite(gz)){ var gp=proj(mode==='curve'?[G.x,gz,0]:[G.x,G.y,gz]);
      x.fillStyle='#d9a83a'; x.beginPath(); x.arc(gp[0],gp[1],5,0,7); x.fill();
      st1.innerHTML=(mode==='curve'
        ? 'curve \u00b7 y = '+exprSrc+' \u00b7 <span class="g">('+G.x.toFixed(2)+', '+gz.toFixed(2)+')</span>'
        : 'surface \u00b7 z = '+exprSrc+' \u00b7 \u00b1'+R+' \u00b7 '+N+'\u00d7'+N+' \u00b7 roll '+Math.round(roll*57.3)+'\u00b0 \u00b7 tilt '+Math.round(tilt*57.3)+'\u00b0 \u00b7 z '+GEOM.zmin.toFixed(1)+' .. '+GEOM.zmax.toFixed(1)+' \u00b7 <span class="g">('+G.x.toFixed(2)+', '+G.y.toFixed(2)+', '+gz.toFixed(2)+')</span>');
    }
  } else if(mode==='solid'&&GEOM){
    st1.textContent='solid \u00b7 '+PRE.solid[solidIdx][0]+' \u00b7 roll '+Math.round(roll*57.3)+'\u00b0 \u00b7 tilt '+Math.round(tilt*57.3)+'\u00b0';
  } else if(!msg){ st1.textContent=mode+' \u00b7 awaiting a formula'; }
  if(msg) st1.innerHTML='<span class="r">'+msg+'</span>';
}
function renderPresets(){
  presets.innerHTML='';
  var list= mode==='solid'? PRE.solid : (mode==='surface'? PRE.surface : []);
  list.forEach(function(p,idx){
    var b=document.createElement('button'); b.textContent=p[0];
    if(mode==='solid'? idx===solidIdx : p[1]===exprSrc) b.className='on';
    b.onclick=function(){
      if(mode==='solid'){ solidIdx=idx; }
      else { exprSrc=p[1]; fx.value=exprSrc; }
      plot(); };
    presets.appendChild(b); });
}
function fit(){
  var d=devicePixelRatio||1;
  W=wrap.clientWidth||1; H=wrap.clientHeight||1;
  cv.width=Math.round(W*d); cv.height=Math.round(H*d);
  x.setTransform(d,0,0,d,0,0);
  cx=W/2; cy=H/2; base=Math.min(W,H)/(2*R+3);
  draw();
}
if(window.ResizeObserver){ new ResizeObserver(fit).observe(wrap); } else addEventListener('resize',fit);
function setMode(m){ mode=m;
  document.getElementById('mCurve').className=m==='curve'?'on':'';
  document.getElementById('mSurface').className=m==='surface'?'on':'';
  document.getElementById('mSolid').className=m==='solid'?'on':'';
  fx.style.display=m==='solid'?'none':'';
  document.getElementById('plot').style.display=m==='solid'?'none':'';
  if(m!=='solid'){ if(fx.value) exprSrc=fx.value; else fx.value=exprSrc||DEF[m]; }
  plot(); }
document.getElementById('mCurve').onclick=function(){ setMode('curve'); };
document.getElementById('mSurface').onclick=function(){ setMode('surface'); };
document.getElementById('mSolid').onclick=function(){ setMode('solid'); };
document.getElementById('plot').onclick=function(){ exprSrc=fx.value; plot(); };
fx.addEventListener('keydown',function(e){ if(e.key==='Enter'){ exprSrc=fx.value; plot(); } });
rngEl.addEventListener('change',function(){ plot(); });
grdEl.addEventListener('change',function(){ plot(); });
document.getElementById('zin').onclick=function(){ zoom=Math.min(4,zoom*1.15); draw(); save(); };
document.getElementById('zout').onclick=function(){ zoom=Math.max(0.3,zoom/1.15); draw(); save(); };
document.getElementById('vhome').onclick=function(){ roll=0.314; tilt=0.157; zoom=1; draw(); save(); };
document.getElementById('rst').onclick=function(){ if(mode!=='solid'){ exprSrc=DEF[mode]; fx.value=exprSrc; }
  R=6.5; N=26; rngEl.value=R; grdEl.value=N; G={x:1.5,y:1}; roll=0.314; tilt=0.157; zoom=1; plot(); };
document.getElementById('sticks').onclick=function(){ sticks=!sticks; this.className=sticks?'on':''; draw(); save(); };
cv.addEventListener('wheel',function(e){ e.preventDefault(); zoom=Math.max(0.3,Math.min(4,zoom*(e.deltaY<0?1.12:1/1.12))); draw(); save(); },{passive:false});
var drag=null;
cv.addEventListener('pointerdown',function(e){
  cv.setPointerCapture(e.pointerId);
  var r=cv.getBoundingClientRect(), px=e.clientX-r.left, py=e.clientY-r.top;
  var gp=null;
  if(mode!=='solid'&&fn){ var gz= mode==='curve'? fn(G.x,0): fn(G.x,G.y);
    if(isFinite(gz)) gp=proj(mode==='curve'?[G.x,gz,0]:[G.x,G.y,gz]); }
  if(gp&&Math.hypot(gp[0]-px,gp[1]-py)<20) drag={k:'dot'};
  else { drag={k:'rot',sx:px,sy:py,r0:roll,t0:tilt}; cv.classList.add('grabbing'); }
  e.preventDefault(); });
cv.addEventListener('pointermove',function(e){
  if(!drag) return;
  var r=cv.getBoundingClientRect(), px=e.clientX-r.left, py=e.clientY-r.top;
  if(drag.k==='rot'){ roll=drag.r0+(px-drag.sx)*0.008; tilt=Math.max(-1.4,Math.min(1.4,drag.t0+(py-drag.sy)*0.008)); draw(); }
  else if(fn){ var s=base*zoom;
    var dx=(px-(drag.lx||px))/s, dy=(py-(drag.ly||py))/s; drag.lx=px; drag.ly=py;
    var cr=Math.cos(roll), sr=Math.sin(roll);
    G.x+= dx*cr - dy*sr; G.y+= dx*sr + dy*cr;
    G.x=Math.max(-R,Math.min(R,G.x)); G.y=Math.max(-R,Math.min(R,G.y)); draw(); } });
addEventListener('pointerup',function(){ if(drag){ drag=null; cv.classList.remove('grabbing'); save(); } });
rngEl.value=R; grdEl.value=N;
fx.value= mode==='solid'? '' : exprSrc;
document.getElementById('sticks').className=sticks?'on':'';
setMode(mode);
fit();
})();
</script>
</body>
</html>

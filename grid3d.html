<style>

<div class="help">curve = flat like desmos · polar = r = f(θ) · surface = z = f(x, y) or img ⌘ heightfield · solid = preset shapes · x, y, r, sin cos tan exp ln log sqrt abs ^ ( ) π e · radians</div>

<script>
(function(){
var KEY='hive_grid3d', MASTKEY='hive_grid_mastery';
var cv=document.getElementById('cv'), x=cv.getContext('2d');
var wrap=document.getElementById('wrap'), fx=document.getElementById('fx');
var rngEl=document.getElementById('rng'), grdEl=document.getElementById('grd');
var st1=document.getElementById('st1'), st2=document.getElementById('st2'), presets=document.getElementById('presets');
var stickOv=document.getElementById('stickOv');
var mode='surface', exprSrc='sin(r*1.6)*exp(-r/4)*3', fn=null, bootNote='';
var roll=0.314, tilt=0.157, zoom=1, sticks=false, solidIdx=0, pol=false, mastOn=false, geomKind='formula';
var R=6.5, N=26, G={x:1.5,y:1.0}, view={x:0,y:0}, GEOM=null, W=1, H=1, cx=1, cy=1, base=1;
var DEF={surface:'sin(r*1.6)*exp(-r/4)*3', curve:'sin(x)', solid:''};
var PRE={surface:[['wave','sin(x)*cos(y)'],['saddle','(x^2-y^2)/4'],['ripple','sin(r*1.6)*exp(-r/4)*3'],['gauss','3*exp(-(r^2)/8)'],['plane','(x+y)/4']],
         curve:[['sin','sin(x)'],['parabola','x^2/4'],['abs','abs(x)-3']],
         polar:[['circle','1'],['rose','sin(4*x)'],['spiral','x/2'],['cardioid','1+cos(x)']],
         solid:[['sphere',''],['torus',''],['box',''],['cone','']]};
var EQ={sphere:'x=3.5·cos v·cos u · y=3.5·cos v·sin u · z=3.5·sin v · u∈[0,2π] · v∈[−π/2,π/2]',
  torus:'x=(3.2+1.2·cos v)·cos u · y=(3.2+1.2·cos v)·sin u · z=1.2·sin v · u,v∈[0,2π]',
  box:'vertices (±2.6, ±2.6, ±2.6) · 12 edges · 8 corners · the honest cube',
  cone:'base circle r=3 @ z=−2 · apex (0,0,4) · 16 spokes · the party hat'};
var FUND=['wave','saddle','ripple','gauss','plane','sin','parabola','abs','circle','rose','spiral','cardioid','sphere','torus','box','cone'];
var mast={}; try{ mast=JSON.parse(localStorage.getItem(MASTKEY)||'{}')||{}; }catch(e){ mast={}; }
function mark(n){ if(!mast[n]){ mast[n]=1; try{ localStorage.setItem(MASTKEY,JSON.stringify(mast)); }catch(e){} } }
function mastLine(){ var v=FUND.filter(function(f){ return mast[f]; });
  return 'mastery \u00b7 '+v.length+' of '+FUND.length+' fundamentals visited'+(v.length? ' \u00b7 '+v.join(' \u00b7 ') : ' \u00b7 plot the set to earn the wheel'); }
var BUCK=[];
(function(){ for(var i=0;i<8;i++){ var t=i/7;
  BUCK.push('rgba('+Math.round(120+(217-120)*t)+','+Math.round(220+(168-220)*t)+','+Math.round(200+(58-200)*t)+',.75)'); } })();
try{ var S=JSON.parse(localStorage.getItem(KEY)||'null');
  if(S){ mode=S.mode||mode; exprSrc=typeof S.expr==='string'?S.expr:exprSrc; roll=+S.roll||roll; tilt=+S.tilt||tilt;
    zoom=+S.zoom||zoom; sticks=!!S.sticks; solidIdx=S.solidIdx|0; pol=!!S.pol; if(S.g) G=S.g; if(S.v) view=S.v;
    if(+S.rng) R=Math.max(1,Math.min(50,+S.rng)); if(+S.grd) N=Math.round(Math.max(8,Math.min(64,+S.grd))); } }catch(e){}
function save(){ try{ localStorage.setItem(KEY,JSON.stringify({mode:mode,expr:exprSrc,roll:roll,tilt:tilt,zoom:zoom,sticks:sticks,solidIdx:solidIdx,pol:pol,g:G,v:view,rng:R,grd:N})); }catch(e){} }
function bin(op,l,r){ return function(px,py){ var a=l(px,py), b=r(px,py);
  return op==='+'?a+b: op==='-'?a-b: op==='*'?a*b: op==='/'?a/b: Math.pow(a,b); }; }
function compile(raw){
  var s=String(raw).replace(/\u2212/g,'-').replace(/[\u00d7\u00b7]/g,'*').replace(/\u00f7/g,'/').replace(/\u03c0/g,'pi').replace(/\s+/g,''), i=0;
  var F={sin:Math.sin,cos:Math.cos,tan:Math.tan,exp:Math.exp,ln:Math.log,
    log:function(v){ return Math.log(v)/Math.LN10; }, sqrt:Math.sqrt, abs:Math.abs};
  function err(m){ var e=new Error(m); e.pos=i; throw e; }
  function starts(c){ return !!c&&(c==='('||/[a-z]/.test(c)); }
  function primary(){
    var c=s[i];
    if(c==='('){ i++; var v=expr(); if(s[i]!==')') err('paren'); i++; return v; }
    if(c==='-'){ i++; var n=primary(); return function(px,py){ return -n(px,py); }; }
    if(c==='+'){ i++; return primary(); }
    var fm=/^(sin|cos|tan|exp|ln|log|sqrt|abs)/.exec(s.slice(i));
    if(fm){ i+=fm[0].length; var f=F[fm[0]], a=primary(); return function(px,py){ return f(a(px,py)); }; }
    var m=/^(pi|e|x|y|r)/.exec(s.slice(i));
    if(m){ i+=m[0].length;
      if(m[0]==='x') return function(px){ return px; };
      if(m[0]==='y') return function(px,py){ return py; };
      if(m[0]==='r') return function(px,py){ return Math.sqrt(px*px+py*py); };
      if(m[0]==='e') return function(){ return Math.E; };
      return function(){ return Math.PI; }; }
    var nm=/^\d+\.?\d*|^\.\d+/.exec(s.slice(i)); if(!nm) err('term'); i+=nm[0].length;
    var k=parseFloat(nm[0]); return function(){ return k; };
  }
  function power(){ var b=primary(); if(s[i]==='^'){ i++; var e=power(); return bin('^',b,e); } return b; }
  function term(){ var v=power();
    for(;;){ var c=s[i];
      if(c==='*'||c==='/'){ i++; v=bin(c,v,power()); }
      else if(starts(c)){ v=bin('*',v,power()); }
      else break; }
    return v; }
  function expr(){ var v=term();
    while(s[i]==='+'||s[i]==='-'){ var c=s[i]; i++; v=bin(c,v,term()); }
    return v; }
  var f=expr(); if(i<s.length) err('trail');
  return f;
}
function buildSurface(){
  var pts=[], lines=[], zmin=1e9, zmax=-1e9, grid=[];
  for(var i=0;i<N;i++){ grid[i]=[];
    for(var j=0;j<N;j++){
      var px=-R+2*R*j/(N-1), py=-R+2*R*i/(N-1), z=fn(px,py);
      if(!isFinite(z)){ grid[i][j]=-1; continue; }
      z=Math.max(-40,Math.min(40,z));
      grid[i][j]=pts.length; pts.push([px,py,z]);
      if(z<zmin) zmin=z; if(z>zmax) zmax=z; } }
  for(i=0;i<N;i++) for(j=0;j<N;j++){
    var a=grid[i][j];
    if(a<0) continue;
    if(j+1<N&&grid[i][j+1]>=0) lines.push([a,grid[i][j+1]]);
    if(i+1<N&&grid[i+1][j]>=0) lines.push([a,grid[i+1][j]]); }
  GEOM={pts:pts,lines:lines,zmin:zmin,zmax:zmax};
}
function buildCurve(){
  var pts=[], lines=[], M=Math.max(160,N*10), prev=-1;
  var xmin=1e9,xmax=-1e9,ymin=1e9,ymax=-1e9;
  for(var i=0;i<M;i++){
    var px, py;
    if(pol){ var th=i/(M-1)*Math.PI*2, rr=fn(th,0);
      if(!isFinite(rr)){ prev=-1; continue; }
      px=rr*Math.cos(th); py=rr*Math.sin(th); }
    else { px=-R+2*R*i/(M-1); py=fn(px,0);
      if(!isFinite(py)){ prev=-1; continue; } }
    px=Math.max(-1e4,Math.min(1e4,px)); py=Math.max(-1e4,Math.min(1e4,py));
    var idx=pts.length; pts.push([px,py,0]);
    if(prev>=0) lines.push([prev,idx]); prev=idx;
    if(px<xmin)xmin=px; if(px>xmax)xmax=px; if(py<ymin)ymin=py; if(py>ymax)ymax=py; }
  if(xmin>xmax){ xmin=-1; xmax=1; } if(ymin>ymax){ ymin=-1; ymax=1; }
  GEOM={pts:pts,lines:lines,zmin:ymin,zmax:ymax,xmin:xmin,xmax:xmax};
}
function buildSolid(){
  var pts=[], lines=[], U=20, V=12, i, j;
  function mesh(fu){ var g=[];
    for(i=0;i<U;i++){ g[i]=[];
      for(j=0;j<V;j++){ g[i][j]=pts.length; pts.push(fu(i/(U-1)*Math.PI*2, -Math.PI/2+j/(V-1)*Math.PI)); } }
    for(i=0;i<U;i++) for(j=0;j<V;j++){
      if(j+1<V) lines.push([g[i][j],g[i][j+1]]);
      if(i+1<U) lines.push([g[i][j],g[i+1][j]]); } }
  if(solidIdx===1) mesh(function(u,v){ return [(3.2+1.2*Math.cos(v))*Math.cos(u),(3.2+1.2*Math.cos(v))*Math.sin(u),1.2*Math.sin(v)]; });
  else if(solidIdx===2){ var c=2.6, corners=[];
    for(i=0;i<8;i++) corners.push([(i&1?c:-c),(i&2?c:-c),(i&4?c:-c)]);
    var E=[[0,1],[0,2],[0,4],[1,3],[1,5],[2,3],[2,6],[3,7],[4,5],[4,6],[5,7],[6,7]];
    E.forEach(function(e){ var a=pts.length; pts.push(corners[e[0]]); pts.push(corners[e[1]]); lines.push([a,a+1]); }); }
  else if(solidIdx===3){ var apex=pts.length; pts.push([0,0,4]);
    var B=16, ring=[];
    for(i=0;i<B;i++){ var u=i/B*Math.PI*2; ring.push(pts.length); pts.push([3*Math.cos(u),3*Math.sin(u),-2]); }
    for(i=0;i<B;i++){ lines.push([ring[i],ring[(i+1)%B]]); lines.push([ring[i],apex]); } }
  else mesh(function(u,v){ return [3.5*Math.cos(v)*Math.cos(u),3.5*Math.cos(v)*Math.sin(u),3.5*Math.sin(v)]; });
  var zmin=1e9, zmax=-1e9;
  pts.forEach(function(p){ if(p[2]<zmin) zmin=p[2]; if(p[2]>zmax) zmax=p[2]; });
  GEOM={pts:pts,lines:lines,zmin:zmin,zmax:zmax};
}
function readDims(){
  var r=parseFloat(rngEl.value), g=parseFloat(grdEl.value);
  if(isFinite(r)&&r>0) R=Math.max(1,Math.min(50,r));
  if(isFinite(g)&&g>0) N=Math.round(Math.max(8,Math.min(64,g)));
  rngEl.value=R; grdEl.value=N;
  base=Math.min(W,H)/(2*R+3);
}
function plot(){
  var msg=''; GEOM=null; geomKind='formula';
  readDims();
  if(mode!=='solid'){
    try{ fn=compile(exprSrc); }
    catch(e){ fn=null; var p=(e&&e.pos!=null)?e.pos:0;
      msg='the grammar refuses at char '+p+' \u00b7 \u201c'+String(exprSrc).slice(p,p+8)+'\u201d'; }
    if(fn){ try{ if(mode==='surface') buildSurface(); else buildCurve(); }
      catch(e2){ fn=null; GEOM=null; msg='the surface collapsed \u00b7 try a gentler formula'; } }
  } else { fn=null; buildSolid(); }
  renderPresets(); draw(msg); save();
}
/* ---- image → heightfield · the Image→2D→3D arrow ---- */
var imgInput=document.createElement('input'); imgInput.type='file'; imgInput.accept='image/*'; imgInput.style.display='none';
document.body.appendChild(imgInput);
imgInput.onchange=function(){ var f=imgInput.files&&imgInput.files[0]; if(!f) return;
  var rd=new FileReader();
  rd.onload=function(e){ var im=new Image();
    im.onload=function(){ readDims();
      var c=document.createElement('canvas'); c.width=N; c.height=N;
      var g=c.getContext('2d'); g.drawImage(im,0,0,N,N);
      var d=g.getImageData(0,0,N,N).data, pts=[], lines=[], grid=[], i, j;
      for(i=0;i<N;i++){ grid[i]=[];
        for(j=0;j<N;j++){ var k=(i*N+j)*4;
          var lum=(d[k]*0.299+d[k+1]*0.587+d[k+2]*0.114)/255;
          grid[i][j]=pts.length;
          pts.push([-R+2*R*j/(N-1), -R+2*R*i/(N-1), (1-lum)*4-2]); } }
      for(i=0;i<N;i++) for(j=0;j<N;j++){ var a=grid[i][j];
        if(j+1<N) lines.push([a,grid[i][j+1]]);
        if(i+1<N) lines.push([a,grid[i+1][j]]); }
      GEOM={pts:pts,lines:lines,zmin:-2,zmax:2}; geomKind='image'; fn=null;
      draw(''); save(); };
    im.src=e.target.result; };
  rd.readAsDataURL(f); imgInput.value=''; };
function proj(p){
  var cr=Math.cos(roll), sr=Math.sin(roll);
  var x1=p[0]*cr-p[1]*sr, y1=p[0]*sr+p[1]*cr;
  var ct=Math.cos(tilt), st=Math.sin(tilt);
  var y2=y1*ct-p[2]*st;
  return [cx+x1*base*zoom, cy-y2*base*zoom];
}
function nice(v){ var p=Math.pow(10,Math.floor(Math.log(v)/Math.LN10)); var m=v/p;
  return (m>5?10:m>2?5:m>1?2:1)*p; }
function curveDot(){ if(!fn) return null;
  if(pol){ var th=G.x, rr=fn(th,0); if(!isFinite(rr)) return null;
    return {x:rr*Math.cos(th), y:rr*Math.sin(th), r:rr, th:th}; }
  var gy=fn(G.x,0); if(!isFinite(gy)) return null;
  return {x:G.x, y:gy}; }
function draw(msg){
  x.clearRect(0,0,W,H);
  var i, a, b;
  if(mode==='curve'&&GEOM){
    var spanX=Math.max(0.5,GEOM.xmax-GEOM.xmin), spanY=Math.max(0.5,GEOM.zmax-GEOM.zmin);
    var xmid=(GEOM.xmin+GEOM.xmax)/2, ymid=(GEOM.zmin+GEOM.zmax)/2;
    var sx=(W*0.9)/spanX*zoom, sy=(H*0.8)/spanY*zoom;
    window.__cfit={sx:sx,sy:sy,xmid:xmid,ymid:ymid};
    x.strokeStyle='rgba(34,48,65,.9)'; x.lineWidth=1;
    var stp=nice(spanX/6), yst=nice(spanY/5);
    var y0=cy-(0-ymid-view.y)*sy;
    if(y0>0&&y0<H){ x.beginPath(); x.moveTo(0,y0); x.lineTo(W,y0); x.stroke(); }
    var x0=cx+(0-xmid-view.x)*sx;
    if(x0>0&&x0<W){ x.beginPath(); x.moveTo(x0,0); x.lineTo(x0,H); x.stroke(); }
    x.fillStyle='#5c6875'; x.font='9px ui-monospace,Consolas,monospace';
    for(i=Math.ceil((xmid-spanX/2)/stp)*stp;i<=xmid+spanX/2;i+=stp){
      var tx=cx+(i-xmid-view.x)*sx;
      if(tx<14||tx>W-8) continue;
      x.fillText(String(+i.toFixed(2)), tx+2, Math.max(10,Math.min(H-4,y0+12))); }
    for(i=Math.ceil((ymid-spanY/2)/yst)*yst;i<=ymid+spanY/2;i+=yst){
      var ty=cy-(i-ymid-view.y)*sy;
      if(ty<10||ty>H-6) continue;
      x.fillText(String(+i.toFixed(2)), Math.max(2,Math.min(W-30,x0+4)), ty-2); }
    x.strokeStyle='rgba(232,228,216,.9)'; x.lineWidth=2; x.beginPath();
    var started=false;
    for(i=0;i<GEOM.pts.length;i++){ var p=GEOM.pts[i];
      var px2=cx+(p[0]-xmid-view.x)*sx, py2=cy-(p[1]-ymid-view.y)*sy;
      if(!started){ x.moveTo(px2,py2); started=true; } else x.lineTo(px2,py2); }
    x.stroke(); x.lineWidth=1;
    var dot=curveDot();
    if(dot){ var gx2=cx+(dot.x-xmid-view.x)*sx, gy2=cy-(dot.y-ymid-view.y)*sy;
      x.fillStyle='#d9a83a'; x.beginPath(); x.arc(gx2,gy2,5,0,7); x.fill();
      x.font='9px ui-monospace,Consolas,monospace';
      x.fillText(pol? '('+dot.r.toFixed(2)+', '+dot.th.toFixed(2)+'\u03b8)' : '('+dot.x.toFixed(2)+', '+dot.y.toFixed(2)+')', gx2+9, gy2-9);
      st1.innerHTML=(pol? 'curve \u00b7 polar \u00b7 r = '+exprSrc+' \u00b7 \u03b8 0..2\u03c0' : 'curve \u00b7 y = '+exprSrc+' \u00b7 x '+GEOM.xmin.toFixed(1)+'..'+GEOM.xmax.toFixed(1))
        +' \u00b7 <span class="g">'+(pol? 'r '+dot.r.toFixed(2)+' @ \u03b8 '+dot.th.toFixed(2) : '('+dot.x.toFixed(2)+', '+dot.y.toFixed(2)+')')+'</span>'; }
    st2.textContent='drag to pan \u00b7 drag the gold dot \u00b7 wheel or + \u2212 to zoom';
  } else {
    x.strokeStyle='rgba(34,48,65,.9)'; x.lineWidth=1;
    var stp2=R>10?4:2;
    for(i=-Math.floor(R/stp2)*stp2;i<=R;i+=stp2){
      a=proj([i,-R,0]); b=proj([i,R,0]); x.beginPath(); x.moveTo(a[0],a[1]); x.lineTo(b[0],b[1]); x.stroke();
      a=proj([-R,i,0]); b=proj([R,i,0]); x.beginPath(); x.moveTo(a[0],a[1]); x.lineTo(b[0],b[1]); x.stroke(); }
    x.strokeStyle='rgba(92,104,117,.8)';
    var ax=proj([0,0,0]), az=proj([0,0,R*0.7]);
    x.beginPath(); x.moveTo(ax[0],ax[1]); x.lineTo(az[0],az[1]); x.stroke();
    if(GEOM){
      if(sticks&&mode==='surface'){
        x.strokeStyle='rgba(120,220,200,.6)';
        for(i=0;i<GEOM.pts.length;i+=2){ var q=GEOM.pts[i];
          var g0=proj([q[0],q[1],0]), g1=proj(q);
          x.beginPath(); x.moveTo(g0[0],g0[1]); x.lineTo(g1[0],g1[1]); x.stroke(); }
      } else if(mode==='surface'){
        var zr=Math.max(1e-6,GEOM.zmax-GEOM.zmin);
        for(i=0;i<GEOM.lines.length;i++){ var L=GEOM.lines[i];
          var p1=GEOM.pts[L[0]], p2=GEOM.pts[L[1]];
          var t=((p1[2]+p2[2])/2-GEOM.zmin)/zr;
          x.strokeStyle=BUCK[Math.max(0,Math.min(7,Math.round(t*7)))];
          a=proj(p1); b=proj(p2);
          x.beginPath(); x.moveTo(a[0],a[1]); x.lineTo(b[0],b[1]); x.stroke(); }
      } else {
        x.strokeStyle='rgba(120,220,200,.7)';
        for(i=0;i<GEOM.lines.length;i++){ var L2=GEOM.lines[i];
          a=proj(GEOM.pts[L2[0]]); b=proj(GEOM.pts[L2[1]]);
          x.beginPath(); x.moveTo(a[0],a[1]); x.lineTo(b[0],b[1]); x.stroke(); } } }
    if(mastOn){ st1.textContent=mastLine(); }
    else if(geomKind==='image'&&GEOM){
      st1.textContent='surface \u00b7 image heightfield \u00b7 \u00b1'+R+' \u00b7 '+N+'\u00d7'+N+' \u00b7 roll '+Math.round(roll*57.3)+'\u00b0 \u00b7 tilt '+Math.round(tilt*57.3)+'\u00b0 \u00b7 z '+GEOM.zmin.toFixed(1)+' .. '+GEOM.zmax.toFixed(1);
      st2.textContent='drag to roll \u00b7 wheel or + \u2212 to zoom \u00b7 plot it returns to the formula';
    }
    else if(mode==='surface'&&fn&&GEOM){
      var gz=fn(G.x,G.y);
      if(isFinite(gz)){ var gp=proj([G.x,G.y,gz]);
        x.fillStyle='#d9a83a'; x.beginPath(); x.arc(gp[0],gp[1],5,0,7); x.fill();
        x.font='9px ui-monospace,Consolas,monospace';
        x.fillText('('+G.x.toFixed(2)+', '+G.y.toFixed(2)+', '+gz.toFixed(2)+')', gp[0]+9, gp[1]-9);
        st1.innerHTML='surface \u00b7 z = '+exprSrc+' \u00b7 \u00b1'+R+' \u00b7 '+N+'\u00d7'+N+' \u00b7 roll '+Math.round(roll*57.3)+'\u00b0 \u00b7 tilt '+Math.round(tilt*57.3)+'\u00b0 \u00b7 z '+GEOM.zmin.toFixed(1)+' .. '+GEOM.zmax.toFixed(1)+' \u00b7 <span class="g">('+G.x.toFixed(2)+', '+G.y.toFixed(2)+', '+gz.toFixed(2)+')</span>'; }
      st2.textContent='drag to roll \u00b7 drag the gold dot \u00b7 wheel or + \u2212 to zoom';
    } else if(mode==='solid'&&GEOM){
      st1.textContent='solid \u00b7 '+PRE.solid[solidIdx][0]+' \u00b7 roll '+Math.round(roll*57.3)+'\u00b0 \u00b7 tilt '+Math.round(tilt*57.3)+'\u00b0 \u00b7 '+EQ[PRE.solid[solidIdx][0]];
      st2.textContent='drag to roll \u00b7 wheel or + \u2212 to zoom \u00b7 presets speak their math';
    }
  }
  if(mastOn&&mode==='curve') st1.textContent=mastLine();
  if(!GEOM&&!msg&&!mastOn) st1.textContent=mode+' \u00b7 awaiting a formula';
  if(msg) st1.innerHTML='<span class="r">'+msg+'</span>';
}
function renderPresets(){
  presets.innerHTML='';
  var list= mode==='solid'? PRE.solid : (mode==='surface'? PRE.surface : (pol? PRE.polar : PRE.curve));
  list.forEach(function(p,idx){
    var b=document.createElement('button'); b.textContent=p[0];
    var on= mode==='solid'? idx===solidIdx : p[1]===exprSrc;
    if(on) b.className='on';
    b.onclick=function(){
      if(mode==='solid'){ solidIdx=idx; mark(p[0]); }
      else { exprSrc=p[1]; fx.value=exprSrc; mark(p[0]); }
      plot(); };
    presets.appendChild(b); });
}
function fit(){
  var d=devicePixelRatio||1;
  W=wrap.clientWidth||1; H=wrap.clientHeight||1;
  cv.width=Math.round(W*d); cv.height=Math.round(H*d);
  x.setTransform(d,0,0,d,0,0);
  cx=W/2; cy=H/2; base=Math.min(W,H)/(2*R+3);
  draw();
}
if(window.ResizeObserver){ new ResizeObserver(fit).observe(wrap); } else addEventListener('resize',fit);
function setMode(m){ mode=m;
  document.getElementById('mCurve').className=m==='curve'?'on':'';
  document.getElementById('mSurface').className=m==='surface'?'on':'';
  document.getElementById('mSolid').className=m==='solid'?'on':'';
  fx.style.display=m==='solid'?'none':'';
  document.getElementById('plot').style.display=m==='solid'?'none':'';
  document.getElementById('polar').style.display=m==='curve'?'':'none';
  document.getElementById('imgBtn').style.display=m==='surface'?'':'none';
  if(m!=='solid'){ if(fx.value) exprSrc=fx.value; else fx.value=exprSrc||DEF[m]; }
  plot(); }
function paintSticks(){ stickOv.className=sticks?'on':''; stickOv.textContent=sticks?'sticks ⌃':'sticks ⌄'; }
document.getElementById('mCurve').onclick=function(){ setMode('curve'); };
document.getElementById('mSurface').onclick=function(){ setMode('surface'); };
document.getElementById('mSolid').onclick=function(){ setMode('solid'); };
document.getElementById('plot').onclick=function(){ exprSrc=fx.value; plot(); };
document.getElementById('polar').onclick=function(){ pol=!pol; this.className=pol?'on':'';
  if(pol&&exprSrc===DEF.curve){ exprSrc='1'; fx.value=exprSrc; }
  if(!pol&&exprSrc==='1'){ exprSrc=DEF.curve; fx.value=exprSrc; }
  plot(); };
document.getElementById('imgBtn').onclick=function(){ imgInput.click(); };
document.getElementById('mastBtn').onclick=function(){ mastOn=!mastOn; this.className=mastOn?'on':''; draw(); };
fx.addEventListener('keydown',function(e){ if(e.key==='Enter'){ exprSrc=fx.value; plot(); } });
rngEl.addEventListener('change',function(){ plot(); });
grdEl.addEventListener('change',function(){ plot(); });
document.getElementById('zin').onclick=function(){ zoom=Math.min(4,zoom*1.15); draw(); save(); };
document.getElementById('zout').onclick=function(){ zoom=Math.max(0.3,zoom/1.15); draw(); save(); };
document.getElementById('vhome').onclick=function(){ roll=0.314; tilt=0.157; zoom=1; view={x:0,y:0}; draw(); save(); };
document.getElementById('rst').onclick=function(){ if(mode!=='solid'){ exprSrc=DEF[mode]; fx.value=exprSrc; }
  R=6.5; N=26; rngEl.value=R; grdEl.value=N; G={x:1.5,y:1}; view={x:0,y:0}; roll=0.314; tilt=0.157; zoom=1; geomKind='formula'; plot(); };
stickOv.onclick=function(){ sticks=!sticks; paintSticks(); draw(); save(); };
cv.addEventListener('wheel',function(e){ e.preventDefault(); zoom=Math.max(0.3,Math.min(4,zoom*(e.deltaY<0?1.12:1/1.12))); draw(); save(); },{passive:false});
var drag=null;
cv.addEventListener('pointerdown',function(e){
  cv.setPointerCapture(e.pointerId);
  var r=cv.getBoundingClientRect(), px=e.clientX-r.left, py=e.clientY-r.top;
  var gp=null;
  if(mode==='curve'&&window.__cfit){ var dot=curveDot();
    if(dot) gp=[cx+(dot.x-window.__cfit.xmid-view.x)*window.__cfit.sx, cy-(dot.y-window.__cfit.ymid-view.y)*window.__cfit.sy]; }
  else if(fn&&GEOM&&mode==='surface'){ var gz=fn(G.x,G.y);
    if(isFinite(gz)) gp=proj([G.x,G.y,gz]); }
  if(gp&&Math.hypot(gp[0]-px,gp[1]-py)<20) drag={k:'dot'};
  else { drag={k:'rot',sx:px,sy:py,r0:roll,t0:tilt,vx0:view.x,vy0:view.y}; cv.classList.add('grabbing'); }
  e.preventDefault(); });
cv.addEventListener('pointermove',function(e){
  if(!drag) return;
  var r=cv.getBoundingClientRect(), px=e.clientX-r.left, py=e.clientY-r.top;
  if(drag.k==='rot'&&mode==='curve'&&window.__cfit){
    view.x=drag.vx0-(px-drag.sx)/window.__cfit.sx; view.y=drag.vy0+(py-drag.sy)/window.__cfit.sy; draw(); return; }
  if(drag.k==='rot'){ roll=drag.r0+(px-drag.sx)*0.008; tilt=Math.max(-1.4,Math.min(1.4,drag.t0+(py-drag.sy)*0.008)); draw(); return; }
  if(drag.k==='dot'&&fn){
    if(mode==='curve'&&window.__cfit){
      if(pol){ G.x+= (px-(drag.lx||px))/window.__cfit.sx; G.x=Math.max(0,Math.min(Math.PI*2,G.x)); drag.lx=px; }
      else { G.x+= (px-(drag.lx||px))/window.__cfit.sx; drag.lx=px; G.x=Math.max(-R,Math.min(R,G.x)); } }
    else { var s=base*zoom;
      var dx=(px-(drag.lx||px))/s, dy=(py-(drag.ly||py))/s; drag.lx=px; drag.ly=py;
      var cr=Math.cos(roll), sr=Math.sin(roll);
      G.x+= dx*cr - dy*sr; G.y+= dx*sr + dy*cr;
      G.x=Math.max(-R,Math.min(R,G.x)); G.y=Math.max(-R,Math.min(R,G.y)); }
    draw(); } });
addEventListener('pointerup',function(){ if(drag){ drag=null; cv.classList.remove('grabbing'); save(); } });
/* ---- boot · never open dead, never die silent ---- */
try{
  if(mode!=='solid'){
    try{ compile(exprSrc); }catch(e){ exprSrc=DEF[mode];
      bootNote='the stored formula refused \u00b7 loaded the house default'; } }
  rngEl.value=R; grdEl.value=N;
  fx.value= mode==='solid'? '' : exprSrc;
  paintSticks();
  document.getElementById('polar').className=pol?'on':'';
  setMode(mode);
  fit();
  (function selfTest(){
    var bat=['sin(r*1.6)*exp(-r/4)*3','sin(x)','(x^2-y^2)/4','3*exp(-(r^2)/8)','(x+y)/4','e','pi','2x','sin(4*x)','1+cos(x)'];
    for(var i=0;i<bat.length;i++){
      try{ compile(bat[i]); }catch(e){
        var m='parser self-test failed \u00b7 "'+bat[i]+'" at char '+(e&&e.pos!=null?e.pos:'?')+' \u00b7 the deployed file may be mangled or cached \u00b7 hard-reload or re-paste fresh';
        st1.innerHTML='<span class="r">'+m+'</span>';
        try{ console.error('grid3d self-test:',bat[i],e); }catch(e2){}
        return; } }
    if(bootNote) st1.innerHTML='<span class="r">'+bootNote+'</span>';
  })();
}catch(fatal){
  st1.innerHTML='<span class="r">the grid limped \u00b7 '+String(fatal&&fatal.message||fatal)+' \u00b7 the deployed file may be mangled \u00b7 re-paste fresh</span>';
}
})();
</script>

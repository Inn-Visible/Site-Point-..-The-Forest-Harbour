<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#0a0d12">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>the grid | Inn.Visible</title>
<style>
  :root{--bg:#0a0d12;--panel:#0e141b;--line:#223041;--ink:#e8e4d8;--dim:#93a1b0;--gold:#d9a83a;--mono:ui-monospace,Consolas,monospace;--serif:Georgia,serif}
  *{box-sizing:border-box;margin:0} body{background:var(--bg);color:var(--ink);font-family:var(--mono)}
  header{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line)}
  .brand{font-size:14px;letter-spacing:.3em} .back{color:var(--dim);font-size:11px;text-decoration:none}
  main{max-width:900px;margin:0 auto;padding:20px 14px}
  .hook{font-family:var(--serif);font-style:italic;font-size:16px;text-align:center}
  .man{margin-top:8px;color:var(--dim);font-size:11px;text-align:center;letter-spacing:.06em}
  .row{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:12px 0 8px;align-items:center}
  button{background:none;border:1px solid var(--line);color:var(--dim);font:10px var(--mono);letter-spacing:.1em;padding:6px 10px;cursor:pointer}
  button.on{border-color:var(--gold);color:var(--gold)}
  input{background:rgba(3,4,7,.6);border:1px solid var(--line);color:var(--ink);font:11px var(--mono);padding:8px 10px;width:min(460px,86vw)}
  input:disabled{opacity:.4}
  #g3{width:100%;height:440px;border:1px solid var(--line);background:var(--bg);touch-action:none;cursor:grab;display:block}
  .info{margin-top:8px;text-align:center;font-size:10px;color:var(--dim);letter-spacing:.12em}
  .msg{font-size:10px;color:#58a36a;letter-spacing:.1em}
</style>
</head>
<body>
<script>
(function(){ var KEY='hive_access', SES='hive_session', SPAN=1800000;
  var a=localStorage.getItem(KEY);
  var ok=sessionStorage.getItem(SES)==='1'&&a&&+a>Date.now();
  if(!ok){ location.replace('index.html'); } else { localStorage.setItem(KEY,String(Date.now()+SPAN)); } })();
</script>
<header><div class="brand">THE GRID</div><a class="back" href="axiom.html">axiom ↩</a></header>
<main>
  <p class="hook">the third dimension, rollable.</p>
  <p class="man">curve = flat like desmos · surface = z = f(x, y) · solid = preset shapes · x, y, r, sin cos tan exp ln log sqrt abs ^ ( ) π e · radians</p>
  <div class="row" id="modes"></div>
  <div class="row"><input id="fExpr" placeholder="z = f(x, y) · e.g. sin(r*1.6)*exp(-r/4)*3" autocomplete="off"></div>
  <div class="row"><button id="fPlot" class="on">plot it</button><span class="msg" id="fMsg"></span></div>
  <div class="row" id="presets"></div>
  <div class="row" id="solids" style="display:none"></div>
  <div class="row"><button id="zin">+</button><button id="zout">−</button><button id="home">⌂ view</button></div>
  <canvas id="g3"></canvas>
  <div class="info" id="gInfo"></div>
</main>
<script>
(function(){
  var NAMES=['asin','acos','atan','sqrt','sin','cos','tan','exp','ln','log','abs'];
    var PREC={'+':1,'-':1,'*':2,'/':2,'^':3,'u-':2};
  var RASSOC={'^':1,'u-':1};
  function tokenize(s){
    var t=[],i=0;
    while(i<s.length){ var c=s.charAt(i);
      if(/\s/.test(c)){ i++; continue; }
      if(/[0-9.]/.test(c)){ var j=i; while(j<s.length&&/[0-9.]/.test(s.charAt(j)))j++;
        var n=parseFloat(s.slice(i,j)); if(!isFinite(n)) return null; t.push(['n',n]); i=j; continue; }
      if(/[a-zπ]/i.test(c)){
        if(c==='π'){ t.push(['n',Math.PI]); i++; continue; }
        var k=i; while(k<s.length&&/[a-z]/i.test(s.charAt(k)))k++;
        var w=s.slice(i,k).toLowerCase();
        if(w==='x'){ t.push(['v',0]); i=k; continue; }
        if(w==='y'){ t.push(['v',1]); i=k; continue; }
        if(w==='r'){ t.push(['v',2]); i=k; continue; }
        if(w==='e'){ t.push(['n',Math.E]); i=k; continue; }
        if(w==='pi'){ t.push(['n',Math.PI]); i=k; continue; }
        if(NAMES.indexOf(w)>-1){ t.push(['f',w]); i=k; continue; }
        return null; }
      if('+-*/^()'.indexOf(c)>-1){ t.push(['o',c]); i++; continue; }
      return null; }
    return t;
  }
  function compile(src){
      var t=tokenize(src); if(!t||!t.length) return null;
    var t2=[];
    for(var q2=0;q2<t.length;q2++){
      if(q2>0){ var pv=t[q2-1], cu=t[q2];
        var pvV= pv[0]==='n'||pv[0]==='v'||(pv[0]==='o'&&pv[1]===')');
        var cuO= cu[0]==='n'||cu[0]==='v'||cu[0]==='f'||(cu[0]==='o'&&cu[1]==='(');
        if(pvV&&cuO) t2.push(['o','*']); }
      t2.push(t[q2]); }
    t=t2;
    var out=[], st=[], want=true;
    for(var k=0;k<t.length;k++){ var tk=t[k];
      if(tk[0]==='n'||tk[0]==='v'){ out.push(tk); want=false; continue; }
      if(tk[0]==='f'){ st.push(tk); want=true; continue; }
      var op=tk[1];
      if(op==='('){ st.push(op); want=true; continue; }
      if(op===')'){ var found=false;
        while(st.length){ var p=st.pop(); if(p==='('){ found=true; break; } out.push(p); }
        if(!found) return null;
        if(st.length&&Array.isArray(st[st.length-1])&&st[st.length-1][0]==='f') out.push(st.pop());
        want=false; continue; }
      if(want){ if(op==='-'){ st.push('u-'); want=true; continue; } if(op==='+'){ continue; } return null; }
      while(st.length){ var top=st[st.length-1];
        if(top==='('||Array.isArray(top)) break;
        var tp=PREC[top]||0, cp=PREC[op]||0;
        if(RASSOC[op]? tp>cp : tp>=cp){ out.push(st.pop()); } else break; }
      st.push(op); want=true; }
    if(want) return null;
    while(st.length){ var q=st.pop(); if(q==='(') return null; out.push(q); }
    return out;
  }
  function applyF(w,a){
    switch(w){ case 'sin': return Math.sin(a); case 'cos': return Math.cos(a); case 'tan': return Math.tan(a);
      case 'asin': return Math.asin(a); case 'acos': return Math.acos(a); case 'atan': return Math.atan(a);
      case 'exp': return Math.exp(a); case 'ln': return Math.log(a); case 'log': return Math.log(a)/Math.LN10;
      case 'sqrt': return Math.sqrt(a); case 'abs': return Math.abs(a); }
    return NaN;
  }
  function makeF(rpn){
    return function(x,y){
      var r=Math.sqrt(x*x+y*y), ev=[];
      for(var i=0;i<rpn.length;i++){ var o=rpn[i];
        if(typeof o==='string') o=['o',o];
        if(o[0]==='n'){ ev.push(o[1]); continue; }
        if(o[0]==='v'){ ev.push(o[1]===0?x:o[1]===1?y:r); continue; }
        if(o[0]==='f'){ if(!ev.length) return NaN; ev.push(applyF(o[1],ev.pop())); continue; }
        if(o[1]==='u-'){ if(!ev.length) return NaN; ev.push(-ev.pop()); continue; }
        if(ev.length<2) return NaN;
        var b=ev.pop(), a=ev.pop(), v;
        switch(o[1]){ case '+': v=a+b; break; case '-': v=a-b; break; case '*': v=a*b; break;
          case '/': v=(b===0?NaN:a/b); break; case '^': v=Math.pow(a,b); break; default: return NaN; }
        ev.push(v); }
      return ev.length===1?ev[0]:NaN;
    };
  }
  var PRESETS={wave:'sin(x)*cos(y)', saddle:'(x^2-y^2)/6', ripple:'sin(r*1.6)*exp(-r/4)*3',
    gauss:'3*exp(-(x^2+y^2)/8)', plane:'(x+y)/4'};
  var mode='surface', curF=null, curName='ripple', solidName='sphere';
   var yaw=0.7, pitch=1.0, zoom=1, R=6, N=24;
  var mk={x:1.5,y:1.5,sx:null,sy:null}, dragMk=false, pmx=0, pmy=0, lastS=20;
  var cv=document.getElementById('g3'), x=cv.getContext('2d');
  function ring(cx0,cy0,cz0,rad,ax,steps){
    var pts=[];
    for(var i=0;i<=steps;i++){ var u=i/steps*2*Math.PI;
      if(ax==='z') pts.push([cx0+rad*Math.cos(u), cy0+rad*Math.sin(u), cz0]);
      else if(ax==='x') pts.push([cx0, cy0+rad*Math.cos(u), cz0+rad*Math.sin(u)]);
      else pts.push([cx0+rad*Math.cos(u), cy0, cz0+rad*Math.sin(u)]); }
    return pts;
  }
  function solidLines(name){
    var L=[], S=4, i, j;
    if(name==='sphere'){
      for(i=1;i<8;i++){ var phi=i*Math.PI/8; L.push(ring(0,0,S*Math.cos(phi),S*Math.sin(phi),'z',36)); }
      for(i=0;i<12;i++){ var u=i*Math.PI/6, pts=[];
        for(j=0;j<=24;j++){ var ph=j*Math.PI/24;
          pts.push([S*Math.sin(ph)*Math.cos(u), S*Math.sin(ph)*Math.sin(u), S*Math.cos(ph)]); }
        L.push(pts); }
    } else if(name==='torus'){
      var R0=3.4, r0=1.4;
      for(i=0;i<12;i++){ var v=i*Math.PI/6, pts2=[];
        for(j=0;j<=36;j++){ var u2=j*2*Math.PI/36;
          pts2.push([(R0+r0*Math.cos(v))*Math.cos(u2), (R0+r0*Math.cos(v))*Math.sin(u2), r0*Math.sin(v)]); }
        L.push(pts2); }
      for(i=0;i<18;i++){ var u3=i*2*Math.PI/18, pts3=[];
        for(j=0;j<=24;j++){ var v2=j*2*Math.PI/24;
          pts3.push([(R0+r0*Math.cos(v2))*Math.cos(u3), (R0+r0*Math.cos(v2))*Math.sin(u3), r0*Math.sin(v2)]); }
        L.push(pts3); }
    } else if(name==='cone'){
      L.push(ring(0,0,-S/2,S,'z',36));
      for(i=0;i<12;i++){ var u4=i*Math.PI/6;
        L.push([[S*Math.cos(u4),S*Math.sin(u4),-S/2],[0,0,S/2]]); }
      for(i=1;i<4;i++){ var t=i/4; L.push(ring(0,0,-S/2+t*S,S*(1-t),'z',36)); }
    } else if(name==='pyramid'){
      var h=S/2, C=[[h,h,-h],[-h,h,-h],[-h,-h,-h],[h,-h,-h]];
      L.push(C.concat([C[0]]));
      for(i=0;i<4;i++) L.push([C[i],[0,0,h]]);
      for(i=1;i<4;i++){ var t2=i/4, s2=1-t2, z2=-h+t2*S;
        L.push([[h*s2,h*s2,z2],[-h*s2,h*s2,z2],[-h*s2,-h*s2,z2],[h*s2,-h*s2,z2],[h*s2,h*s2,z2]]); }
    } else {
      var q=S/2, E=[[-q,-q,-q],[q,-q,-q],[q,q,-q],[-q,q,-q],[-q,-q,q],[q,-q,q],[q,q,q],[-q,q,q]];
      [[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]].forEach(function(e){ L.push([E[e[0]],E[e[1]]]); });
      L.push([[-q,-q,0],[q,-q,0],[q,q,0],[-q,q,0],[-q,-q,0]]);
      L.push([[0,-q,-q],[0,q,-q],[0,q,q],[0,-q,q],[0,-q,-q]]);
      L.push([[-q,0,-q],[q,0,-q],[q,0,q],[-q,0,q],[-q,0,-q]]);
    }
    return L;
  }
  function buildLines(){
    var L=[], i, j;
            if(mode==='solid') return solidLines(solidName).map(function(line){ return {pts: line.map(function(p){
      var k=1;
      if(curF){ var d=curF(p[0],p[1]); if(isFinite(d)) k=1+d/6; }
      return [p[0]*k, p[1]*k, p[2]*k]; })}; });
    if(mode==='curve'){
      L.push({faint:true, pts:[[-R,0,0],[R,0,0]]});
      L.push({faint:true, pts:[[0,0,-3],[0,0,4]]});
      var pts=[];
      for(i=0;i<=160;i++){ var px=-R+2*R*i/160, pz=curF?curF(px,0):NaN;
        pts.push([px,0,isFinite(pz)?pz:NaN]); }
      L.push({pts:pts});
      return L;
    }
    for(var pass=0;pass<2;pass++){
      for(i=0;i<=N;i++){
        var t0=-R+2*R*i/N, line=[];
        for(j=0;j<=N;j++){
          var px2= pass===0? -R+2*R*j/N : t0;
          var py2= pass===0? t0 : -R+2*R*j/N;
          var pz2=curF?curF(px2,py2):NaN;
          line.push([px2,py2,isFinite(pz2)?pz2:NaN]); }
        L.push({pts:line}); }
    }
    return L;
  }
  function fit(){ var r=cv.getBoundingClientRect(); cv.width=r.width; cv.height=r.height; draw(); }
  addEventListener('resize',fit);
  function proj(px,py,pz,cx,cy,s){
    var x1=px*Math.cos(yaw)-py*Math.sin(yaw), y1=px*Math.sin(yaw)+py*Math.cos(yaw), z1=pz;
    var up=z1*Math.cos(pitch)-y1*Math.sin(pitch);
    return [cx+x1*s, cy-up*s];
  }
  function col(t){ return 'rgba('+Math.round(63+t*154)+','+Math.round(127+t*41)+','+Math.round(193-t*135)+',0.85)'; }
   function draw(){
    x.fillStyle='#0a0d12'; x.fillRect(0,0,cv.width,cv.height);
    try{
      var lines=buildLines();
    var mn=1e9, mx=-1e9;
    lines.forEach(function(ln){ ln.pts.forEach(function(p){ if(isFinite(p[2])){ if(p[2]<mn)mn=p[2]; if(p[2]>mx)mx=p[2]; } }); });
    if(mn>mx){ mn=0; mx=0; }
    var rg=(mx-mn)||1;
    var zext=Math.max(Math.abs(mn),Math.abs(mx));
    var V=zext*Math.abs(Math.cos(pitch))+R*Math.abs(Math.sin(pitch))+0.5;
    var s=Math.min(cv.width/(2*R*1.5), cv.height/(2*V))*zoom, cx=cv.width/2, cy=cv.height/2;
    lastS=s;
    var g=[];
    for(var gi=-R;gi<=R;gi+=2){ g.push({faint:true,pts:[[gi,-R,0],[gi,R,0]]}); g.push({faint:true,pts:[[-R,gi,0],[R,gi,0]]}); }
    lines=g.concat(lines);
    x.lineWidth=1;
    lines.forEach(function(ln){
      var mid=0, cnt=0;
      ln.pts.forEach(function(p){ if(isFinite(p[2])){ mid+=p[2]; cnt++; } });
      mid=cnt?mid/cnt:mn;
      x.strokeStyle= ln.faint? 'rgba(92,104,117,0.45)' : col(Math.max(0,Math.min(1,(mid-mn)/rg)));
      x.beginPath(); var started=false;
      ln.pts.forEach(function(p){
        if(!isFinite(p[2])){ started=false; return; }
        var q=proj(p[0],p[1],p[2],cx,cy,s);
        if(!started){ x.moveTo(q[0],q[1]); started=true; } else x.lineTo(q[0],q[1]); });
      x.stroke(); });
         if(mode!=='solid'&&curF){
      var myv= mode==='curve'?0:mk.y, mz=curF(mk.x,myv);
      if(isFinite(mz)){
        var q=proj(mk.x,myv,mz,cx,cy,s);
        mk.sx=q[0]; mk.sy=q[1];
        x.strokeStyle='rgba(217,168,58,.5)'; x.beginPath();
        x.moveTo(q[0]-9,q[1]); x.lineTo(q[0]+9,q[1]); x.moveTo(q[0],q[1]-9); x.lineTo(q[0],q[1]+9); x.stroke();
        x.fillStyle='#d9a83a'; x.beginPath(); x.arc(q[0],q[1],4,0,7); x.fill();
        x.font='10px ui-monospace,Consolas,monospace';
        x.fillText(mode==='curve'? '('+mk.x.toFixed(2)+', '+mz.toFixed(2)+')' : '('+mk.x.toFixed(2)+', '+mk.y.toFixed(2)+', '+mz.toFixed(2)+')', q[0]+10, q[1]-10);
      } else mk.sx=null;
    } else mk.sx=null;
    document.getElementById('gInfo').textContent=mode+' \u00b7 '+(mode==='solid'?solidName:'z = '+curName)+' \u00b7 roll '+Math.round(yaw*57)+'\u00b0 \u00b7 tilt '+Math.round(pitch*57)+'\u00b0 \u00b7 z '+mn.toFixed(2)+' .. '+mx.toFixed(2)+' \u00b7 drag the gold dot'; 
    }catch(e){ document.getElementById('gInfo').textContent='painter error \u00b7 '+e.message; }
  }
  function plot(src,name){
    var msg=document.getElementById('fMsg');
    var rpn=compile(src);
    if(!rpn){ msg.style.color='#c8452c'; msg.textContent='the grid refuses \u00b7 check the syntax'; return; }
    var f=makeF(rpn);
    curF=f; curName=name||src;
        var usesY=rpn.some(function(t){ return t[0]==='v'&&t[1]===1; });
    if(mode==='solid'){ msg.style.color='#58a36a'; msg.textContent='carving \u00b7 cage \u00d7 (1 + f/6)'; }
    else if(mode==='curve'&&usesY){ msg.style.color='#d9a83a'; msg.textContent='plotting \u00b7 y = f(x) \u00b7 y pins to 0 in curve \u00b7 your y-terms went quiet'; }
    else { msg.style.color='#58a36a'; msg.textContent='plotting \u00b7 z = '+(name||src); }
    if(cv.width<10||cv.height<10) fit();
    draw();
  }
  var inp=document.getElementById('fExpr');
  var modesRow=document.getElementById('modes'), preRow=document.getElementById('presets'), solRow=document.getElementById('solids');
  function setMode(m){
    mode=m;
    modesRow.querySelectorAll('button').forEach(function(b){ b.classList.toggle('on',b.dataset.m===m); });
    solRow.style.display= m==='solid'?'flex':'none';
    preRow.style.display= m==='surface'?'flex':'none';
       inp.placeholder= m==='curve'? 'y = f(x) \u00b7 e.g. sin(x^2/2)' : m==='surface'? 'z = f(x, y) \u00b7 e.g. sin(r*1.6)*exp(-r/4)*3' : 'carve the cage \u00b7 f(x, y) bumps the radius \u00b7 0 = pure solid';
    draw();
  }
  ['curve','surface','solid'].forEach(function(m){
    var b=document.createElement('button'); b.textContent=m; b.dataset.m=m;
    b.onclick=function(){ setMode(m); };
    modesRow.appendChild(b);
  });
  Object.keys(PRESETS).forEach(function(kk){
    var b=document.createElement('button'); b.textContent=kk; b.dataset.k=kk;
    b.onclick=function(){ inp.value=PRESETS[kk];
      preRow.querySelectorAll('button').forEach(function(o){ o.classList.toggle('on',o.dataset.k===kk); });
      plot(PRESETS[kk],kk); };
    preRow.appendChild(b); if(kk===curName) b.classList.add('on');
  });
  ['sphere','torus','cone','pyramid','cube'].forEach(function(kk){
    var b=document.createElement('button'); b.textContent=kk; b.dataset.k=kk;
    b.onclick=function(){ solidName=kk;
      solRow.querySelectorAll('button').forEach(function(o){ o.classList.toggle('on',o.dataset.k===kk); });
      document.getElementById('fMsg').textContent='';
      draw(); };
    solRow.appendChild(b); if(kk===solidName) b.classList.add('on');
  });
  document.getElementById('fPlot').onclick=function(){
    preRow.querySelectorAll('button').forEach(function(o){ o.classList.remove('on'); });
    plot(inp.value.trim(),null); };
  var deb=null;
  inp.oninput=function(){ clearTimeout(deb); deb=setTimeout(function(){
    preRow.querySelectorAll('button').forEach(function(o){ o.classList.remove('on'); });
    plot(inp.value.trim(),null); },450); };
  inp.value=PRESETS.ripple;
  setMode('surface');
  plot(PRESETS.ripple,'ripple');
   var drag=false,lx=0,ly=0;
  cv.addEventListener('pointerdown',function(e){
    var r=cv.getBoundingClientRect();
    if(mk.sx!=null){ var d0x=e.clientX-r.left-mk.sx, d0y=e.clientY-r.top-mk.sy;
      if(d0x*d0x+d0y*d0y<196){ dragMk=true; pmx=e.clientX; pmy=e.clientY; e.preventDefault(); return; } }
    drag=true; lx=e.clientX; ly=e.clientY; cv.style.cursor='grabbing'; e.preventDefault(); });
  addEventListener('pointermove',function(e){
    if(dragMk){
      var aX=Math.cos(yaw)*lastS, aY=Math.sin(yaw)*Math.sin(pitch)*lastS;
      var bX=-Math.sin(yaw)*lastS, bY=Math.cos(yaw)*Math.sin(pitch)*lastS;
      var dsx=e.clientX-pmx, dsy=e.clientY-pmy; pmx=e.clientX; pmy=e.clientY;
      var det=aX*bY-aY*bX;
      if(Math.abs(det)>1e-6){
        if(mode==='curve'){ mk.x+=(dsx*aX+dsy*aY)/(aX*aX+aY*aY); }
        else { mk.x+=(dsx*bY-dsy*bX)/det; mk.y+=(aX*dsy-aY*dsx)/det; }
        mk.x=Math.max(-R,Math.min(R,mk.x)); mk.y=Math.max(-R,Math.min(R,mk.y));
        draw();
      }
      return; }
    if(!drag) return;
    yaw+=(e.clientX-lx)*0.01; pitch=Math.max(0.15,Math.min(1.5,pitch+(e.clientY-ly)*0.01));
    lx=e.clientX; ly=e.clientY; draw(); });
   addEventListener('pointerup',function(){ drag=false; dragMk=false; cv.style.cursor='grab'; });
  cv.addEventListener('wheel',function(e){ e.preventDefault(); zoom=Math.max(0.4,Math.min(3,zoom*(e.deltaY<0?1.1:0.9))); draw(); },{passive:false});
  document.getElementById('zin').onclick=function(){ zoom=Math.min(3,zoom*1.15); draw(); };
  document.getElementById('zout').onclick=function(){ zoom=Math.max(0.4,zoom*0.87); draw(); };
  document.getElementById('home').onclick=function(){ yaw=0.7; pitch=1.0; zoom=1; draw(); };
  function tryFit(n){ var r=cv.getBoundingClientRect();
    if(r.width>10&&r.height>10){ fit(); }
    else if(n>0) setTimeout(function(){ tryFit(n-1); },120); }
  tryFit(25);
  addEventListener('load',function(){ tryFit(5); });
  if('ResizeObserver' in window){ new ResizeObserver(function(){ fit(); }).observe(cv); }
})();
</script>
</body>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>the slate — draw · share · erase</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#0a0d12;touch-action:none}
  body{font-family:ui-monospace,Consolas,monospace;color:#93a1b0}
  body.light{background:#f2efe6;color:#3a4150}
  #top,#bot{position:fixed;left:0;right:0;display:flex;align-items:center;gap:8px;row-gap:6px;padding:8px 10px;background:rgba(10,13,18,.94);z-index:5;flex-wrap:wrap}
  body.light #top,body.light #bot{background:rgba(242,239,230,.94)}
  #top{top:0}#bot{bottom:0}
  #top .ttl{letter-spacing:.3em;color:#e8e4d8;font-size:12px}
  body.light #top .ttl{color:#1c2430}
  #flash{font-size:10px;letter-spacing:.25em;color:#5c6875;margin-left:8px;margin-right:auto}
  button,.pg{background:none;border:1px solid #223041;color:#93a1b0;font:11px ui-monospace,Consolas,monospace;letter-spacing:.12em;padding:6px 10px;cursor:pointer}
  body.light button,body.light .pg{border-color:#c9c2b2;color:#3a4150}
  button.on{border-color:#d9a83a;color:#d9a83a}
  a.nb{color:#93a1b0;font:11px ui-monospace,Consolas,monospace;text-decoration:none;border:1px solid #223041;padding:6px 10px}
  body.light a.nb{border-color:#c9c2b2;color:#3a4150}
  #kit{border:1px solid #3f7fc1;color:#8ab4ff;text-decoration:none;font:11px ui-monospace,Consolas,monospace;letter-spacing:.15em;padding:6px 10px;position:fixed;left:50%;top:52px;transform:translateX(-50%);z-index:5;background:rgba(10,13,18,.85)}
  #cv{position:fixed;inset:0;display:block}
  .sw{width:22px;height:22px;border-radius:50%;border:1px solid #223041;cursor:pointer;flex:none}
  .sw.on{outline:2px solid #d9a83a}
  input[type=range]{width:64px}
  #pill{position:fixed;right:12px;bottom:12px;z-index:6;display:none}
  #modal{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:9;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;padding:16px}
  #modal .mt{color:#d9a83a;font:11px ui-monospace,Consolas,monospace;letter-spacing:.2em}
  #prevTitle{color:#e8e4d8;font:12px ui-monospace,Consolas,monospace}
  #prevImg{max-width:min(520px,84vw);border:1px solid #3f7fc1;background:#0a0d12}
  #prevLines{max-width:min(520px,84vw);max-height:90px;overflow:auto;color:#93a1b0;font:10px ui-monospace,Consolas,monospace;white-space:pre-wrap}
  #pill,#modal button{background:none;border:1px solid #223041;color:#93a1b0;font:11px ui-monospace,Consolas,monospace;letter-spacing:.12em;padding:6px 10px;cursor:pointer}
  #modal button.on{border-color:#d9a83a;color:#d9a83a}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="top">
  <span class="ttl">THE SLATE</span>
  <span id="flash">draw · share · erase · tiaga-mode</span>
  <span class="pg" id="pgN">1</span>
  <button id="pgAdd">+ page</button>
  <button id="tiaga">tiaga-shake</button>
  <button id="board">board</button>
  <button id="png">png</button>
  <button id="copy">copy</button>
  <button id="paste">paste</button>
  <button id="share">share</button>
  <button id="hide">hide tools</button>
  <a class="nb" href="axiom.html">axiom ↩</a>
 <a id="kit" href="slatekit.html">slate-kit-1 · open the geometry</a>
</div>

<div id="bot">
  <span id="sw" style="display:contents"></span>
  <input type="range" id="size" min="2" max="26" value="5">
  <input type="range" id="tsize" min="12" max="64" value="28">
  <button id="eraseBtn">erase</button>
  <button id="tText">text</button>
  <button id="tLift">lift</button>
  <button id="tMove">move</button>
  <button id="zIn">+</button><button id="zOut">−</button><button id="zHome">⌂</button>
  <button id="undo">undo</button>
  <button id="fwd">fwd</button>
</div>
<button id="pill">tools ⌄</button>
<div id="modal">
  <div class="mt">preview · what the archive will see</div>
  <div id="prevTitle"></div>
  <img id="prevImg" alt="preview">
  <div id="prevLines"></div>
  <div><button id="send" class="on">send ✓</button> <button id="keep">keep drawing</button></div>
</div>
<script>
(function(){
var cv=document.getElementById('cv'), x=cv.getContext('2d'), D=devicePixelRatio||1;
var PAL={dark:['#e8e4d8','#d9a83a','#7fb2e5','#e5735a','#78dcc8','#b07fd9','#d97fa8','#0a0d12'],
         light:['#1c2430','#8a6a1f','#2c5c8f','#a33c2a','#2a8a76','#6b4a8f','#a34a7a','#f2efe6']};
var S={pages:[[]],cur:0}, view={x:0,y:0,z:1};
try{ var raw=localStorage.getItem('hive_slate_v2'); if(raw){ var j=JSON.parse(raw); if(j&&j.pages&&j.pages.length){ S.pages=j.pages; S.cur=j.cur||0; } } }catch(e){}
if(!S.pages[0].length){ var bm=localStorage.getItem('hive_slate');
  if(bm){ var im=new Image(); im.onload=function(){ S.pages[0]=[{t:'i',p:[0,0],w:innerWidth,h:innerHeight,src:bm,im:im}]; render(); }; im.src=bm; } }
S.redo=S.pages.map(function(){ return []; });
var light=localStorage.getItem('hive_slate_mode')==='1';
if(light) document.body.classList.add('light');
var ci=0, size=5, tsize=28, erase=false, tool='draw';
var drag=null, live=null, sel=null, moving=null, lastClear=null;
function pal(){ return PAL[light?'light':'dark']; }
function tag(){ return 'draw \u00b7 share \u00b7 erase \u00b7 tiaga-mode'; }
function flash(m){ var f=document.getElementById('flash'); f.textContent=m; clearTimeout(f._h); f._h=setTimeout(function(){ f.textContent=tag(); },1800); }
function btn(id,fn){ document.getElementById(id).addEventListener('click',fn); }
function W(p){ return [(p[0]-view.x)/view.z,(p[1]-view.y)/view.z]; }
function resize(){ cv.width=innerWidth*D; cv.height=innerHeight*D; cv.style.width=innerWidth+'px'; cv.style.height=innerHeight+'px'; render(); }
addEventListener('resize',resize);
function drawObj(c,o){
  c.save();
  if(o.t==='i'){ if(o.im&&o.im.complete) c.drawImage(o.im,o.p[0],o.p[1],o.w,o.h); c.restore(); return; }
  if(o.t==='t'){ c.globalAlpha=o.o; c.fillStyle=o.c; c.font=o.w+'px ui-monospace,Consolas,monospace'; c.fillText(o.s,o.p[0],o.p[1]); c.restore(); return; }
  c.globalAlpha=o.o; c.lineCap='round'; c.lineJoin='round'; c.lineWidth=o.w;
  if(o.t==='e'){ c.globalCompositeOperation='destination-out'; c.strokeStyle='rgba(0,0,0,1)'; }
  else { c.strokeStyle=o.c; shadowBlur=1.5}
  var P=o.pts; c.beginPath(); c.moveTo(P[0][0],P[0][1]);
  for(var i=1;i<P.length;i++) c.lineTo(P[i][0],P[i][1]);
  if(P.length===1) c.lineTo(P[0][0]+.1,P[0][1]);
  c.stroke(); c.restore();
}
function paint(c,pg,w,h){ c.fillStyle=light?'#f2efe6':'#0a0d12'; c.fillRect(0,0,w,h); for(var i=0;i<pg.length;i++) drawObj(c,pg[i]); }
function render(){
  x.setTransform(D,0,0,D,0,0); x.clearRect(0,0,innerWidth,innerHeight);
  x.fillStyle=light?'#f2efe6':'#0a0d12'; x.fillRect(0,0,innerWidth,innerHeight);
  x.translate(view.x,view.y); x.scale(view.z,view.z);
  var pg=S.pages[S.cur];
  for(var i=0;i<pg.length;i++) drawObj(x,pg[i]);
  if(live) drawObj(x,live);
  if(sel){ x.strokeStyle=pal()[1]; x.lineWidth=1.5/view.z; x.setLineDash([6/view.z,5/view.z]);
    x.strokeRect(Math.min(sel.x0,sel.x1),Math.min(sel.y0,sel.y1),Math.abs(sel.x1-sel.x0),Math.abs(sel.y1-sel.y0)); x.setLineDash([]); }
}
function bbox(o){ if(o.t==='t') return [o.p[0],o.p[1]-o.w,o.p[0]+o.s.length*o.w*0.62,o.p[1]];
  if(o.t==='i') return [o.p[0],o.p[1],o.p[0]+o.w,o.p[1]+o.h];
  var a=o.pts,X0=1e9,Y0=1e9,X1=-1e9,Y1=-1e9;
  for(var i=0;i<a.length;i++){ X0=Math.min(X0,a[i][0]); Y0=Math.min(Y0,a[i][1]); X1=Math.max(X1,a[i][0]); Y1=Math.max(Y1,a[i][1]); }
  return [X0,Y0,X1,Y1]; }
function inSel(o){ var b=bbox(o); return b[0]<Math.max(sel.x0,sel.x1)&&b[2]>Math.min(sel.x0,sel.x1)&&b[1]<Math.max(sel.y0,sel.y1)&&b[3]>Math.min(sel.y0,sel.y1); }
function shift(o,dx,dy){ if(o.t==='i'||o.t==='t'){ o.p[0]+=dx; o.p[1]+=dy; } else o.pts.forEach(function(p){ p[0]+=dx; p[1]+=dy; }); }
function inkShot(){ var CW=1000, CH=1400;
  var c=document.createElement('canvas'); c.width=CW; c.height=CH; var g=c.getContext('2d');
  g.fillStyle='#f2efe6'; g.fillRect(0,0,CW,CH);
  g.fillStyle='#1c2430'; g.font='28px ui-monospace,Consolas,monospace';
  g.fillText('slate \u00b7 page '+(S.cur+1)+' \u00b7 '+new Date().toISOString().slice(0,10), 40, 56);
  var fit=Math.min((CW-80)/innerWidth,(CH-140)/innerHeight);
  g.save(); g.translate(40,100); g.scale(fit,fit);
  g.fillStyle=light?'#f2efe6':'#0a0d12'; g.fillRect(0,0,innerWidth,innerHeight);
  var pg=S.pages[S.cur]; for(var i=0;i<pg.length;i++) drawObj(g,pg[i]);
  g.restore();
  g.strokeStyle='#1c2430'; g.lineWidth=2; g.strokeRect(40,100,innerWidth*fit,innerHeight*fit);
  return c.toDataURL('image/png'); }
var mirrorT=null;
function mirrorSlate(){ if(mirrorT) return; mirrorT=setTimeout(function(){ mirrorT=null;
  var lines=S.pages[S.cur].filter(function(o){ return o.t==='t'; }).map(function(o){ return o.s; });
  var img=inkShot(); if(!lines.length&&!img) return;
  try{ localStorage.setItem('arc.slate', JSON.stringify({title:'slate \u00b7 '+new Date().toISOString().slice(0,10), body:lines.join('\n'), img:img})); }catch(e){} },300); }
function save(){ try{
  localStorage.setItem('hive_slate_v2', JSON.stringify({pages:S.pages.map(function(p){ return p.filter(function(o){ return o.t!=='i'||o.src; }); }),cur:S.cur}));
  var c=document.createElement('canvas'); c.width=innerWidth; c.height=innerHeight; paint(c.getContext('2d'),S.pages[S.cur],innerWidth,innerHeight);
  localStorage.setItem('hive_slate', c.toDataURL());
  localStorage.setItem('hive_slate_mode', light?'1':'0');
  localStorage.setItem('hive_slate_zones', JSON.stringify(S.pages[S.cur].filter(function(o){ return o.t==='t'; }).map(function(o){ return {text:o.s}; })));
  mirrorSlate(); }catch(e){} }
cv.addEventListener('contextmenu',function(e){ e.preventDefault(); });
cv.addEventListener('pointerdown',function(e){
  cv.setPointerCapture(e.pointerId); var w=W([e.clientX,e.clientY]);
  if(tool==='move'){ drag={k:'pan',sx:e.clientX,sy:e.clientY,vx:view.x,vy:view.y}; return; }
  if(moving){ var mb=moving.b;
    if(w[0]>mb[0]-14&&w[0]<mb[2]+14&&w[1]>mb[1]-14&&w[1]<mb[3]+14){ drag={k:'grp',dx:w[0],dy:w[1]}; return; }
    moving=null; save(); render(); }
  if(tool==='lift'){ var hi=hit(w);
    if(hi>=0){ moving={idx:[hi],b:bbox(S.pages[S.cur][hi])}; drag={k:'grp',dx:w[0],dy:w[1]}; flash('lifted \u00b7 drag to set down'); return; }
    sel={x0:w[0],y0:w[1],x1:w[0],y1:w[1]}; drag={k:'sel'}; return; }
  if(tool==='text'){ var s=prompt('chalk text:'); if(s){ S.pages[S.cur].push({t:'t',s:s,c:pal()[ci],w:tsize,o:.95,p:w}); S.redo[S.cur]=[]; save(); render(); } return; }
  if(erase||tool==='erase'){ live={t:'e',w:size*3,o:1,pts:[w]}; drag={k:'draw'}; return; }
  live={t:'s',c:pal()[ci],w:size,o:.9,pts:[w]}; drag={k:'draw'};
});
cv.addEventListener('pointermove',function(e){
  if(!drag) return; var w=W([e.clientX,e.clientY]);
  if(drag.k==='pan'){ view.x=drag.vx+(e.clientX-drag.sx); view.y=drag.vy+(e.clientY-drag.sy); render(); return; }
  if(drag.k==='sel'){ sel.x1=w[0]; sel.y1=w[1]; render(); return; }
  if(drag.k==='grp'){ var dx=w[0]-drag.dx, dy=w[1]-drag.dy; moving.idx.forEach(function(i){ shift(S.pages[S.cur][i],dx,dy); });
    moving.b[0]+=dx; moving.b[1]+=dy; moving.b[2]+=dx; moving.b[3]+=dy; drag.dx=w[0]; drag.dy=w[1]; render(); return; }
  if(live){ live.pts.push(w); render(); }
});
addEventListener('pointerup',function(){
  if(!drag) return;
  if(drag.k==='draw'&&live){ S.pages[S.cur].push(live); S.redo[S.cur]=[]; live=null; save(); }
  if(drag.k==='grp'){ save(); }
  if(drag.k==='sel'){ var pg=S.pages[S.cur], idx=[];
    if(sel&&Math.abs(sel.x1-sel.x0)>8&&Math.abs(sel.y1-sel.y0)>8){
      for(var i=0;i<pg.length;i++) if(inSel(pg[i])) idx.push(i);
      if(idx.length){ var b=[1e9,1e9,-1e9,-1e9]; idx.forEach(function(i){ var q=bbox(pg[i]); b[0]=Math.min(b[0],q[0]); b[1]=Math.min(b[1],q[1]); b[2]=Math.max(b[2],q[2]); b[3]=Math.max(b[3],q[3]); });
        moving={idx:idx,b:b}; flash('lifted \u00b7 drag to set down'); } }
    else if(sel){ var h2=hit([sel.x0,sel.y0]);
      if(h2>=0){ moving={idx:[h2],b:bbox(pg[h2])}; flash('lifted \u00b7 drag to set down'); } else flash('tap a stroke \u00b7 or box several'); }
    sel=null; }
  drag=null; render();
});
function hit(w){ var pg=S.pages[S.cur];
  for(var i=pg.length-1;i>=0;i--){ var o=pg[i];
    if(o.t==='t'){ if(Math.abs(w[0]-o.p[0])<o.s.length*o.w*0.62&&Math.abs(w[1]-o.p[1])<o.w) return i; continue; }
    if(o.t==='i'){ var b=bbox(o); if(w[0]>b[0]&&w[0]<b[2]&&w[1]>b[1]&&w[1]<b[3]) return i; continue; }
    var tol=Math.max(14,o.w*1.6);
    for(var j=0;j<o.pts.length;j++){ var p=o.pts[j]; if(Math.hypot(p[0]-w[0],p[1]-w[1])<tol) return i; } }
  return -1; }
btn('pgAdd',function(){ S.pages.push([]); S.redo.push([]); S.cur=S.pages.length-1; pgLabel(); save(); render(); });
btn('pgN',function(){ S.cur=(S.cur+1)%S.pages.length; pgLabel(); render(); });
function pgLabel(){ document.getElementById('pgN').textContent=String(S.cur+1); }
btn('undo',function(){ var pg=S.pages[S.cur]; if(pg.length){ S.redo[S.cur].push(pg.pop()); save(); render(); } else if(lastClear){ S.pages[S.cur]=lastClear; lastClear=null; save(); render(); } });
btn('fwd',function(){ var r=S.redo[S.cur]; if(r&&r.length){ S.pages[S.cur].push(r.pop()); save(); render(); } });
btn('tiaga',function(){ S.redo[S.cur]=[]; lastClear=S.pages[S.cur].slice(); var n=0;
  var iv=setInterval(function(){ n++; cv.style.transform='translate('+(n%2?1:-7)+'px,0) rotate('+(n%2?1.2:-1.2)+'deg)';
    if(n>5){ clearInterval(iv); cv.style.transform=''; S.pages[S.cur]=[]; save(); render(); flash('shaken clear \u00b7 etch-a-sketch love \u00b7 undo brings it back'); } },45); });
btn('board',function(){ light=!light; document.body.classList.toggle('light',light); paintSw(); save(); render();
  flash(light?'bright room \u00b7 the wall goes light \u2014 easy on the eyes':'back to the dark wall'); });
btn('png',function(){ var c=document.createElement('canvas'); c.width=innerWidth; c.height=innerHeight; paint(c.getContext('2d'),S.pages[S.cur],innerWidth,innerHeight);
  c.toBlob(function(b){ var a=document.createElement('a'); a.download='slate-page-'+(S.cur+1)+'.png'; a.href=URL.createObjectURL(b); a.click(); flash('png saved'); }); });
function pack(){ return 'SLATE1:'+btoa(unescape(encodeURIComponent(JSON.stringify(S.pages[S.cur].filter(function(o){ return o.t!=='i'||o.src; }))))); }
btn('copy',function(){ var b=pack(); try{ localStorage.setItem('hive_slate_clip',b); navigator.clipboard.writeText(b); }catch(e){} flash('page copied'); });
btn('paste',function(){ var b=localStorage.getItem('hive_slate_clip')||''; ingest(b); });
function ingest(b){ if(!b||b.indexOf('SLATE1:')!==0){ flash('nothing slate-shaped on the clip'); return; }
  try{ var arr=JSON.parse(decodeURIComponent(escape(atob(b.slice(7)))));
    arr.forEach(function(o){ if(o.t==='i'&&o.src&&!o.im){ o.im=new Image(); o.im.src=o.src; } });
    S.pages.push(arr); S.redo.push([]); S.cur=S.pages.length-1; pgLabel(); save(); render(); flash('pasted as page '+(S.cur+1)); }catch(e){ flash('that block would not unpack'); } }
btn('share',function(){
  var lines=S.pages[S.cur].filter(function(o){ return o.t==='t'; }).map(function(o){ return o.s; });
  var img=inkShot(); if(!lines.length&&!img){ flash('nothing to send'); return; }
  var title='slate \u00b7 '+new Date().toISOString().slice(0,10);
  document.getElementById('prevTitle').textContent=title;
  document.getElementById('prevImg').src=img;
  document.getElementById('prevLines').textContent=lines.join('\n')||'(no text on the wall)';
  document.getElementById('modal').style.display='flex';
  window.__pendingArchive={title:title,body:lines.join('\n'),img:img}; });
btn('keep',function(){ document.getElementById('modal').style.display='none'; });
btn('send',function(){ var p=window.__pendingArchive; if(!p){ document.getElementById('modal').style.display='none'; return; }
  try{ localStorage.setItem('arc.slate', JSON.stringify({title:p.title,body:p.body,img:p.img}));
    var L=JSON.parse(localStorage.getItem('arc.inbox')||'[]'); L.push({id:'leaf-'+Date.now(),title:p.title,body:p.body,img:p.img}); while(L.length>20) L.shift();
    localStorage.setItem('arc.inbox',JSON.stringify(L)); }catch(e){}
  document.getElementById('modal').style.display='none'; flash('leaf sent to the archive \u2713 no pulling needed'); });
btn('hide',function(){ document.getElementById('bot').style.display='none'; document.getElementById('pill').style.display='block'; });
btn('pill',function(){ document.getElementById('bot').style.display='flex'; document.getElementById('pill').style.display='none'; });
btn('zIn',function(){ view.z=Math.min(4,view.z*1.25); render(); });
btn('zOut',function(){ view.z=Math.max(.4,view.z/1.25); render(); });
btn('zHome',function(){ view.z=1; view.x=0; view.y=0; render(); });
btn('eraseBtn',function(){ erase=!erase; tool=erase?'erase':'draw'; paintSw(); });
btn('tText',function(){ tool=tool==='text'?'draw':'text'; erase=false; paintSw(); });
btn('tLift',function(){ tool=tool==='lift'?'draw':'lift'; moving=null; erase=false; paintSw(); });
btn('tMove',function(){ tool=tool==='move'?'draw':'move'; erase=false; paintSw(); });
var swBox=document.getElementById('sw');
for(var i=0;i<8;i++){ (function(i){ var s=document.createElement('span'); s.className='sw'; s.addEventListener('click',function(){ ci=i; erase=false; tool='draw'; paintSw(); }); swBox.appendChild(s); })(i); }
function paintSw(){ var p=pal(); swBox.querySelectorAll('.sw').forEach(function(b,i){ b.style.background=p[i]; b.classList.toggle('on',i===ci&&!erase); });
  document.getElementById('eraseBtn').classList.toggle('on',erase);
  ['tText','tLift','tMove'].forEach(function(id){ document.getElementById(id).classList.toggle('on', tool===id.slice(1).toLowerCase()); }); }
document.getElementById('size').addEventListener('input',function(){ size=+this.value; });
document.getElementById('tsize').addEventListener('input',function(){ tsize=+this.value; });
resize(); pgLabel(); paintSw();
 window.hiveSlate={S:S,render:render,save:save,pgLabel:pgLabel,flash:flash};
})();
</script>

<script>
/* ---- outbox eyes \u00b7 burn page \u00b7 send book ---- */
(function(){
  function inbox(){ try{ return JSON.parse(localStorage.getItem('arc.inbox')||'[]'); }catch(e){ return []; } }
  function pushInbox(leaf){ try{ var L=inbox(); L.push(leaf); while(L.length>20) L.shift(); localStorage.setItem('arc.inbox',JSON.stringify(L)); }catch(e){} }
  function lightNow(){ return localStorage.getItem('hive_slate_mode')==='1'; }
  function flash(m){ var f=document.getElementById('flash'); if(!f) return; f.textContent=m; clearTimeout(f._h); f._h=setTimeout(function(){ f.textContent='draw \u00b7 share \u00b7 erase \u00b7 tiaga-mode'; },1800); }
  /* eyes on the outbox */
  var shareBtn=document.getElementById('share');
  function eyes(){ var n=inbox().length; if(shareBtn) shareBtn.textContent = n? 'share ('+n+' waiting)' : 'share';
    if(ub) ub.style.display = localStorage.getItem('hive_slate_burned')? 'inline-block':'none'; }
  /* burn page · two taps · undo of the burn is the unburn button */
  var del=document.createElement('button'); del.textContent='del page';
  var ub=document.createElement('button'); ub.textContent='unburn \u21a9'; ub.style.display='none';
  var bot=document.getElementById('bot'); if(bot){ bot.insertBefore(del,bot.lastElementChild); bot.insertBefore(ub,del); }
  var armed=0;
  del.addEventListener('click',function(){
    if(Date.now()-armed<2500){
      try{ var S=JSON.parse(localStorage.getItem('hive_slate_v2')); if(!S||S.pages.length<2){ flash('the last page stays'); armed=0; return; }
        localStorage.setItem('hive_slate_burned', JSON.stringify(S.pages.splice(S.cur,1)[0]));
        S.cur=Math.min(S.cur,S.pages.length-1);
        localStorage.setItem('hive_slate_v2',JSON.stringify(S)); location.reload(); }catch(e){ flash('nothing to burn'); }
      armed=0; return; }
    armed=Date.now(); flash('tap again to burn this page'); });
  ub.addEventListener('click',function(){
    try{ var b=JSON.parse(localStorage.getItem('hive_slate_burned')); var S=JSON.parse(localStorage.getItem('hive_slate_v2'));
      S.pages.push(b); S.cur=S.pages.length-1; localStorage.removeItem('hive_slate_burned');
      localStorage.setItem('hive_slate_v2',JSON.stringify(S)); location.reload(); }catch(e){} });
  /* send book · every page, one leaf, contact sheet */
  function drawO(c,o){ c.save();
    if(o.t==='t'){ c.globalAlpha=o.o||.95; c.fillStyle=o.c; c.font=(o.w||28)+'px ui-monospace,Consolas,monospace'; c.fillText(o.s,o.p[0],o.p[1]); c.restore(); return; }
    if(o.t==='i'){ if(o.im&&o.im.complete) c.drawImage(o.im,o.p[0],o.p[1],o.w,o.h); c.restore(); return; }
    c.globalAlpha=o.o||.9; c.lineCap='round'; c.lineJoin='round'; c.lineWidth=o.w||5;
    if(o.t==='e'){ c.globalCompositeOperation='destination-out'; c.strokeStyle='rgba(0,0,0,1)'; }
    else { c.strokeStyle=o.c; c.shadowColor=o.c; c.shadowBlur=6; }
    var P=o.pts||[]; if(P.length){ c.beginPath(); c.moveTo(P[0][0],P[0][1]); for(var i=1;i<P.length;i++) c.lineTo(P[i][0],P[i][1]); if(P.length===1) c.lineTo(P[0][0]+.1,P[0][1]); c.stroke(); }
    c.restore(); }
 function bookImg(pages){ var CW=1000, PH=500, caps=pages.slice(0,8);
  var CH=80+caps.length*(PH+30);
  var c=document.createElement('canvas'); c.width=CW; c.height=CH; var g=c.getContext('2d');
  g.fillStyle='#f2efe6'; g.fillRect(0,0,CW,CH);
  g.fillStyle='#1c2430'; g.font='28px ui-monospace,Consolas,monospace';
  g.fillText('slate book \u00b7 '+pages.length+' pages \u00b7 '+new Date().toISOString().slice(0,10), 40, 52);
  var y=80;
  caps.forEach(function(pg,i){
    g.fillStyle='#1c2430'; g.font='20px ui-monospace,Consolas,monospace'; g.fillText('page '+(i+1), 40, y+18);
    var fit=Math.min((CW-80)/innerWidth,(PH-26)/innerHeight);
    g.save(); g.translate(40,y+26); g.scale(fit,fit);
    g.fillStyle=lightNow()?'#f2efe6':'#0a0d12'; g.fillRect(0,0,innerWidth,innerHeight);
    pg.forEach(function(o){ if(o.t==='i'&&o.src&&!o.im){ o.im=new Image(); o.im.src=o.src; } drawO(g,o); });
    g.restore();
    g.strokeStyle='#1c2430'; g.lineWidth=2; g.strokeRect(40,y+26,innerWidth*fit,innerHeight*fit);
    y+=PH+30; });
  return c.toDataURL('image/png'); }
  var sendB=document.getElementById('send');
  if(sendB&&sendB.parentNode){ var sb=document.createElement('button'); sb.textContent='send book \u2713';
    sendB.parentNode.insertBefore(sb,sendB.nextSibling);
    sb.addEventListener('click',function(){
      try{ var S=JSON.parse(localStorage.getItem('hive_slate_v2')); var lines=[];
        S.pages.forEach(function(pg,i){ var t=pg.filter(function(o){ return o.t==='t'; }).map(function(o){ return o.s; });
          if(t.length) lines.push('\u2014 page '+(i+1)+' \u2014'); lines=lines.concat(t); });
        var leaf={ id:'leaf-'+Date.now(), t:Date.now(), kind:'slate-book',
          title:'slate book \u00b7 '+new Date().toISOString().slice(0,10)+' \u00b7 '+S.pages.length+' pages',
          body:lines.join('\n')||'(a wordless book)', img:bookImg(S.pages) };
        pushInbox(leaf);
        try{ localStorage.setItem('arc.slate',JSON.stringify({title:leaf.title,body:leaf.body,img:leaf.img})); }catch(e){}
        document.getElementById('modal').style.display='none';
        flash('book sent \u2713 '+S.pages.length+' pages, one leaf'); eyes(); }catch(e){ flash('the book would not bind'); } }); }
  setInterval(eyes,2000); eyes();
})();
</script>

<script>
/* ---- the page drawer \u00b7 pick, name, burn ---- */
(function(){
  var H=window.hiveSlate; if(!H) return;
  function labels(){ try{ return JSON.parse(localStorage.getItem('hive_slate_labels')||'[]'); }catch(e){ return []; } }
  function setLabels(L){ try{ localStorage.setItem('hive_slate_labels',JSON.stringify(L)); }catch(e){} }
  function desc(pg,i){ var L=labels(); if(L[i]) return L[i];
    for(var k=0;k<pg.length;k++){ if(pg[k].t==='t') return '\u201c'+pg[k].s.slice(0,18)+'\u201d'; }
    return pg.length? 'ink' : 'empty'; }
  var btn=document.createElement('button'); btn.textContent='pages';
  var add=document.getElementById('pgAdd');
  if(add&&add.parentNode) add.parentNode.insertBefore(btn,add); else document.getElementById('top').appendChild(btn);
  var dr=document.createElement('div');
  dr.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:9;display:none;align-items:center;justify-content:center;padding:16px';
  dr.innerHTML='<div id="pgList" style="background:#0e141b;border:1px solid #3f7fc1;max-width:460px;width:100%;max-height:70vh;overflow:auto;padding:12px;font:11px ui-monospace,Consolas,monospace;color:#93a1b0"></div>';
  document.body.appendChild(dr);
  var list=dr.querySelector('#pgList');
  var armed=-1, armT=0;
  function closeDr(){ dr.style.display='none'; }
  dr.addEventListener('click',function(e){ if(e.target===dr) closeDr(); });
  function burn(i){
    if(H.S.pages.length<2){ H.flash('the last page stays'); return; }
    try{ localStorage.setItem('hive_slate_burned', JSON.stringify(H.S.pages[i])); }catch(e){}
    H.S.pages.splice(i,1);
    var L=labels(); L.splice(i,1); setLabels(L);
    if(H.S.cur>=H.S.pages.length) H.S.cur=H.S.pages.length-1;
    H.save(); H.pgLabel(); H.render();
    H.flash('page '+(i+1)+' burned \u00b7 unburn \u21a9 waits below');
    renderList();
  }
  function renderList(){
    var html='<div style="color:#d9a83a;letter-spacing:.2em;margin-bottom:10px">the book \u00b7 '+H.S.pages.length+' pages</div>';
    H.S.pages.forEach(function(pg,i){
      html+='<div style="display:flex;gap:6px;align-items:center;padding:6px 4px;border-bottom:1px solid #223041">'
        +'<span data-jump="'+i+'" style="cursor:pointer;flex:1;color:'+(i===H.S.cur?'#d9a83a':'#93a1b0')+'">page '+(i+1)+(i===H.S.cur?' \u00b7 here':'')+' \u00b7 '+desc(pg,i)+'</span>'
        +'<button data-ren="'+i+'" title="name this page" style="background:none;border:1px solid #223041;color:#93a1b0;font:10px ui-monospace,Consolas,monospace;padding:2px 6px;cursor:pointer">\u270e</button>'
        +'<button data-burn="'+i+'" title="burn this page" style="background:none;border:1px solid #223041;color:#93a1b0;font:10px ui-monospace,Consolas,monospace;padding:2px 6px;cursor:pointer">\u2715</button></div>'; });
    html+='<div style="margin-top:10px;display:flex;gap:8px"><input id="pgGo" placeholder="jump to page #" style="flex:1;background:#0a0d12;border:1px solid #223041;color:#e8e4d8;font:11px ui-monospace,Consolas,monospace;padding:6px 8px"><button id="pgGoB" style="background:none;border:1px solid #223041;color:#93a1b0;font:10px ui-monospace,Consolas,monospace;padding:6px 10px;cursor:pointer">go</button></div>';
    list.innerHTML=html;
    list.querySelectorAll('[data-jump]').forEach(function(el){ el.addEventListener('click',function(){ var i=+el.getAttribute('data-jump');
      H.S.cur=i; H.pgLabel(); H.render(); closeDr(); H.flash('page '+(i+1)); }); });
    list.querySelectorAll('[data-ren]').forEach(function(el){ el.addEventListener('click',function(){ var i=+el.getAttribute('data-ren');
      var L=labels(); var s=prompt('name page '+(i+1)+':',L[i]||''); if(s===null) return; L[i]=s.slice(0,24); setLabels(L); renderList(); }); });
    list.querySelectorAll('[data-burn]').forEach(function(el){ el.addEventListener('click',function(){ var i=+el.getAttribute('data-burn');
      if(armed===i&&Date.now()-armT<2500){ armed=-1; burn(i); return; }
      armed=i; armT=Date.now(); el.textContent='sure?'; el.style.color='#e5735a'; el.style.borderColor='#e5735a';
      setTimeout(function(){ if(armed===i){ armed=-1; renderList(); } },2500); }); });
    list.querySelector('#pgGoB').addEventListener('click',function(){ var n=parseInt(list.querySelector('#pgGo').value,10);
      if(n>=1&&n<=H.S.pages.length){ H.S.cur=n-1; H.pgLabel(); H.render(); closeDr(); H.flash('page '+n); } else H.flash('no page '+(list.querySelector('#pgGo').value||'')); });
  }
  btn.addEventListener('click',function(){ renderList(); dr.style.display='flex'; });
})();
</script>

<script>
/* ---- the carryback bell \u00b7 slate hears the kit ---- */
(function(){
  var mine=localStorage.getItem('hive_slate_v2');
  addEventListener('storage',function(e){
    if(e.key!=='hive_slate_v2'||e.newValue===mine) return;
    mine=e.newValue;
    var f=document.getElementById('flash'); if(!f) return;
    f.textContent='the kit carried ink back \u00b7 tap here to hold it';
    f.style.cursor='pointer';
    f.onclick=function(){ location.reload(); };
  });
})();
</script>

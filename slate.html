<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>the slate — draw · share · erase</title>
<style>
  :root{--bg:#0a0d12;--line:#223041;--ink:#e8e4d8;--dim:#93a1b0;--gold:#d9a83a}
  *{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:ui-monospace,Consolas,monospace;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;transition:background-color .5s ease}
  body.light{background:#f2efe6;color:#1c2430}
  header{position:fixed;top:0;left:0;right:0;z-index:2;display:flex;justify-content:space-between;
    padding:10px 16px;font-size:11px;letter-spacing:.25em;color:var(--dim);pointer-events:none;transition:color .5s}
  header #flash{margin-right:96px}
  body.light header{color:#6b7684}
  canvas#slate{position:fixed;inset:0;cursor:crosshair;transform-origin:0 0;touch-action:none}
  canvas#over{position:fixed;inset:0;pointer-events:none;transform-origin:0 0;z-index:1;touch-action:none}
  #tools{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);z-index:2;
    display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;
    background:rgba(10,13,18,.85);border:1px solid var(--line);padding:8px;max-width:94vw;max-height:46vh;overflow-y:auto}
  body.light #tools{background:rgba(242,239,230,.9);border-color:#c9c2b2}
  button{background:none;border:1px solid var(--line);color:var(--dim);font-family:inherit;
    font-size:10px;letter-spacing:.08em;padding:6px 9px;cursor:pointer}
  button:hover{border-color:var(--gold);color:var(--gold)}
  button.on{border-color:var(--gold);color:var(--gold)}
  .sw{width:22px;height:22px;border-radius:50%;padding:0}
  #door{position:fixed;top:8px;right:12px;z-index:3;color:var(--dim);text-decoration:none;
    font-size:11px;letter-spacing:.2em;border:1px solid var(--line);padding:6px 10px;background:rgba(10,13,18,.7)}
  #door:hover{color:var(--gold);border-color:var(--gold)}
  body.light #door{background:rgba(242,239,230,.8);color:#6b7684}
  #toolsTab{position:fixed;bottom:12px;right:12px;z-index:3;display:none}
  @media(max-width:700px){
    button{padding:10px 12px;font-size:11px}
    input[type=range]{width:52px}
    #tools{gap:5px;padding:6px;bottom:8px}
    header{padding:8px 12px}
  }
</style>
</head>
<body>
<header><span>THE SLATE</span><span id="flash">draw · share · erase · tiaga-mode</span></header>
<a id="door" href="axiom.html">axiom ↩</a>
<canvas id="slate"></canvas>
<canvas id="over"></canvas>
<div id="tools">
  <span id="swatches" style="display:flex;gap:6px"></span>
  <input type="range" id="size" min="2" max="26" value="5" style="width:60px" title="brush">
  <input type="range" id="tsize" min="8" max="160" value="28" style="width:60px" title="lettering">
  <button id="eraseBtn" onclick="erase=!erase;paint()">erase</button>
  <button id="textBtn" onclick="setMode('text')">text</button>
  <button id="liftBtn" onclick="setMode('lift')" title="tap = grab one · drag = box lift">lift</button>
  <button id="moveBtn" onclick="setMode('move')">move</button>
  <button onclick="setZoom(z*1.4)">+</button>
  <button onclick="setZoom(z/1.4)">−</button>
  <button onclick="z=1;ox=0;oy=0;applyView()">⌂</button>
  <button onclick="undo()">undo</button>
  <button onclick="redo()">fwd</button>
  <button onclick="tiaga()">tiaga-shake</button>
  <button onclick="board()">board</button>
  <button onclick="png()">png</button>
  <button onclick="copy()">copy</button>
  <button onclick="share()">share</button>
  <button onclick="hideTools()">hide</button>
</div>
<button id="toolsTab" onclick="showTools()">tools</button>
<script>
const cv=document.getElementById('slate'),x=cv.getContext('2d');
const over=document.getElementById('over'),o=over.getContext('2d');
const PAL={dark:['#e8e4d8','#d9a83a','#7fb2e5','#e5735a','#78dcc8','#b07fd9','#d97fa8','#0a0d12'],
           light:['#1c2430','#8a6a1f','#2c5c8f','#a33c2a','#2a8a76','#6b4a8f','#a34a7a','#000000']};
let ci=0,size=5,tsize=28,erase=false,light=false,W,H,DPR=1;
let z=1,ox=0,oy=0,mode='draw',panning=false,panSX=0,panSY=0,panOX=0,panOY=0;
let sel=null,selOn=false,moving=null,liftDownWorld=null;
function applyView(){ var t='translate('+ox+'px,'+oy+'px) scale('+z+')'; cv.style.transform=t; over.style.transform=t; }
function setZoom(nz){ nz=Math.max(0.5,Math.min(8,nz)); var cx=W/2,cy=H/2;
  ox=cx-(cx-ox)*(nz/z); oy=cy-(cy-oy)*(nz/z); z=nz; if(z===1){ox=0;oy=0;} applyView(); }
function toWorld(e){ var r=cv.getBoundingClientRect(); return [(e.clientX-r.left)/z,(e.clientY-r.top)/z]; }
function setMode(m){ mode=(mode===m)?'draw':m; erase=false;
  document.getElementById('textBtn').classList.toggle('on',mode==='text');
  document.getElementById('liftBtn').classList.toggle('on',mode==='lift');
  document.getElementById('moveBtn').classList.toggle('on',mode==='move');
  paint(); }
function hideTools(){ document.getElementById('tools').style.display='none'; document.getElementById('toolsTab').style.display='block'; }
function showTools(){ document.getElementById('tools').style.display='flex'; document.getElementById('toolsTab').style.display='none'; }
function fit(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  const old=document.createElement('canvas'); old.width=cv.width; old.height=cv.height;
  if(cv.width) old.getContext('2d').drawImage(cv,0,0);
  W=innerWidth; H=innerHeight;
  cv.width=W*DPR; cv.height=H*DPR; cv.style.width=W+'px'; cv.style.height=H+'px';
  over.width=W*DPR; over.height=H*DPR; over.style.width=W+'px'; over.style.height=H+'px';
  x.setTransform(DPR,0,0,DPR,0,0); x.lineCap='round'; x.lineJoin='round';
  o.setTransform(DPR,0,0,DPR,0,0);
  if(old.width) x.drawImage(old,0,0,old.width,old.height,0,0,W,H);
}
addEventListener('resize',fit); addEventListener('orientationchange',function(){setTimeout(fit,150);}); fit();
const sw=document.getElementById('swatches');
PAL.dark.forEach(function(c,i){
  const b=document.createElement('button'); b.className='sw'; b.onclick=function(){ci=i;erase=false;paint();};
  sw.appendChild(b);
});
document.getElementById('size').oninput=function(){size=+this.value;};
document.getElementById('tsize').oninput=function(){tsize=+this.value;};
function paint(){
  const pal=PAL[light?'light':'dark'];
  sw.querySelectorAll('.sw').forEach(function(b,i){
    b.style.background=pal[i]; b.classList.toggle('on',i===ci&&!erase);
  });
  document.getElementById('eraseBtn').classList.toggle('on',erase);
}
function flash(m){ const f=document.getElementById('flash'); f.textContent=m;
  setTimeout(function(){f.textContent='draw \u00b7 share \u00b7 erase \u00b7 tiaga-mode';},1800); }
const undoStack=[],redoStack=[];
function pushUndo(){ try{ if(undoStack.length>9) undoStack.shift(); undoStack.push(cv.toDataURL()); redoStack.length=0; }catch(e){} }
function restore(d){ const im=new Image();
  im.onload=function(){ x.save(); x.setTransform(1,0,0,1,0,0); x.clearRect(0,0,cv.width,cv.height);
  x.drawImage(im,0,0,cv.width,cv.height); x.restore(); moving=null; renderOverlay(); save(); }; im.src=d; }
function undo(){ const d=undoStack.pop(); if(!d) return; redoStack.push(cv.toDataURL()); restore(d); }
function redo(){ const d=redoStack.pop(); if(!d) return; undoStack.push(cv.toDataURL()); restore(d); }
let drawing=false,lx=0,ly=0;
cv.addEventListener('contextmenu',function(e){e.preventDefault();});
cv.addEventListener('pointerdown',function(e){
  cv.setPointerCapture(e.pointerId);
  var w=toWorld(e);
  if(mode==='move'){ panning=true; panSX=e.clientX; panSY=e.clientY; panOX=ox; panOY=oy; return; }
  if(mode==='lift'){
    if(moving){ stamp(); return; }
    liftDownWorld=w;
    sel={x0:w[0],y0:w[1],x1:w[0],y1:w[1]}; selOn=true; return;
  }
  if(mode==='text'){ placeText(w[0],w[1]); return; }
  drawing=true; pushUndo(); lx=w[0]; ly=w[1]; stroke(w[0],w[1],e.pressure,true);
});
cv.addEventListener('pointermove',function(e){
  var w=toWorld(e);
  if(panning){ ox=panOX+(e.clientX-panSX); oy=panOY+(e.clientY-panSY); applyView(); return; }
  if(selOn&&sel){ sel.x1=w[0]; sel.y1=w[1]; renderOverlay(); return; }
  if(moving){ moving.x=w[0]-moving.gx; moving.y=w[1]-moving.gy; renderOverlay(); return; }
  if(drawing) stroke(w[0],w[1],e.pressure,false);
});
['pointerup','pointercancel'].forEach(function(ev){
  cv.addEventListener(ev,function(){
    if(panning){ panning=false; return; }
    if(selOn){ selOn=false;
      var tiny=Math.abs(sel.x1-sel.x0)<6&&Math.abs(sel.y1-sel.y0)<6;
      if(tiny){ var dw=liftDownWorld; sel=null; if(dw) grabAt(dw[0],dw[1]); }
      else lift();
      return; }
    if(drawing){ drawing=false; save(); }
  });
});
function grabAt(wx,wy){
  var dx=Math.round(wx*DPR), dy=Math.round(wy*DPR);
  var Wd=cv.width, Hd=cv.height;
  if(dx<0||dy<0||dx>=Wd||dy>=Hd) return false;
  var img; try{ img=x.getImageData(0,0,Wd,Hd); }catch(e){ return false; }
  var d=img.data, i0=(dy*Wd+dx)*4;
  if(d[i0+3]<12) return false;
  var visited=new Uint8Array(Wd*Hd);
  var stack=[dy*Wd+dx]; visited[dy*Wd+dx]=1;
  var minX=dx,maxX=dx,minY=dy,maxY=dy, pts=[];
  while(stack.length){
    var p=stack.pop(), px=p%Wd, py=(p-px)/Wd;
    pts.push(p);
    if(px<minX)minX=px; if(px>maxX)maxX=px; if(py<minY)minY=py; if(py>maxY)maxY=py;
    if(px>0&&!visited[p-1]&&d[(p-1)*4+3]>=12){visited[p-1]=1;stack.push(p-1);}
    if(px<Wd-1&&!visited[p+1]&&d[(p+1)*4+3]>=12){visited[p+1]=1;stack.push(p+1);}
    if(py>0&&!visited[p-Wd]&&d[(p-Wd)*4+3]>=12){visited[p-Wd]=1;stack.push(p-Wd);}
    if(py<Hd-1&&!visited[p+Wd]&&d[(p+Wd)*4+3]>=12){visited[p+Wd]=1;stack.push(p+Wd);}
  }
  if(pts.length<4) return false;
  pushUndo();
  var bw=maxX-minX+1, bh=maxY-minY+1;
  var t=document.createElement('canvas'); t.width=bw; t.height=bh;
  var tc=t.getContext('2d'), timg=tc.createImageData(bw,bh);
  for(var k=0;k<pts.length;k++){ var p2=pts[k], qx=p2%Wd, qy=(p2-qx)/Wd;
    var sx=qx-minX, sy=qy-minY, si=(sy*bw+sx)*4, di=p2*4;
    timg.data[si]=d[di]; timg.data[si+1]=d[di+1]; timg.data[si+2]=d[di+2]; timg.data[si+3]=d[di+3];

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
  <link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a0d12">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Archive | Inn.Visible</title>
<style>
  :root{--bg:#0a0d12;--panel:#0e141b;--line:#223041;--ink:#e8e4d8;--dim:#93a1b0;
    --gold:#d9a83a;--blue:#3f7fc1;--green:#58a36a;--bone:#e8e4d8;--mut:#5c6875;
    --mono:ui-monospace,"Cascadia Mono","JetBrains Mono",Consolas,monospace;
    --serif:Georgia,"Times New Roman",serif}
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--mono)}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.10;
    background:linear-gradient(var(--line) 1px,transparent 1px) 0 0/100% 140px,
               linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/180px 100%}
  header{display:flex;justify-content:space-between;align-items:center;padding:18px 44px;border-bottom:1px solid var(--line)}
  .brand{font-size:15px;letter-spacing:.35em}
  .back{color:var(--dim);text-decoration:none;font-size:12px;letter-spacing:.15em}
  .back:hover{color:var(--ink)}
  main{max-width:960px;margin:0 auto;padding:44px 24px 0}
  .hook{font-family:var(--serif);font-style:italic;font-size:clamp(15px,2.2vw,20px);text-align:center;color:var(--dim)}
  .bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:22px 0 8px}
  .bar input{background:var(--panel);border:1px solid var(--line);color:var(--ink);
    font-family:var(--mono);font-size:11px;letter-spacing:.08em;padding:9px 12px;width:260px}
  .bar input:focus{outline:none;border-color:var(--dim)}
  .chip{border:1px solid var(--line);color:var(--dim);background:none;font-family:var(--mono);
    font-size:10px;letter-spacing:.15em;padding:9px 12px;cursor:pointer}
  .chip.on{border-color:var(--gold);color:var(--gold)}
  #count{text-align:center;font-size:9px;letter-spacing:.2em;color:var(--mut);margin:10px 0 18px}
  /* tools */
  #tools{margin:0 0 18px}
  .drop{border:1px dashed var(--line);background:var(--panel);padding:14px 16px;margin-bottom:12px}
  .drop h5{font-size:10px;letter-spacing:.25em;color:var(--bone);margin-bottom:10px}
  .drop input,.drop textarea{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--ink);
    font-family:var(--mono);font-size:11px;padding:8px 10px;margin-bottom:8px}
  .drop textarea{min-height:64px;resize:vertical;line-height:1.7}
  .drop input:focus,.drop textarea:focus{outline:none;border-color:var(--dim)}
  .drop .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .btn{border:1px solid var(--gold);color:var(--gold);background:none;font-family:var(--mono);
    font-size:10px;letter-spacing:.15em;padding:7px 12px;cursor:pointer;text-decoration:none;display:inline-block}
  .btn:hover{background:var(--gold);color:#0a0d12}
  .hint{font-size:9px;letter-spacing:.12em;color:var(--mut)}
  .tbd{border:1px dashed var(--line);padding:16px;text-align:center;color:var(--mut);
    font-size:10px;letter-spacing:.2em}
  .tbd b{color:var(--blue)}
  .room iframe{width:100%;height:70vh;border:1px solid var(--line);background:var(--panel);margin-top:10px}
  .room .links{margin-top:10px;font-size:10px;letter-spacing:.12em;color:var(--dim)}
  .room a{color:var(--blue);text-decoration:none} .room a:hover{color:var(--ink)}
  /* schematics section */
  .schematics{border:1px solid var(--bone);background:var(--panel);padding:16px;margin-bottom:12px}
  .schematics h5{font-size:10px;letter-spacing:.25em;color:var(--bone);margin-bottom:12px;display:flex;align-items:center;gap:8px}
  .schematics h5 svg{flex-shrink:0}
  .schematics .tools-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:12px}
  .schematics .tool-card{border:1px dashed var(--line);padding:12px;text-align:center;transition:all .2s}
  .schematics .tool-card:hover{border-color:var(--bone);background:rgba(232,228,216,0.03)}
  .schematics .tool-card .icon{font-size:20px;margin-bottom:6px;opacity:0.6}
  .schematics .tool-card .name{font-size:11px;color:var(--ink);letter-spacing:.1em;margin-bottom:4px}
  .schematics .tool-card .desc{font-size:9px;color:var(--mut);line-height:1.5}
  .schematics .stats{display:flex;gap:16px;justify-content:center;padding:10px 0;border-top:1px solid var(--line);margin-top:10px}
  .schematics .stat{text-align:center}
  .schematics .stat .num{font-size:14px;color:var(--bone);font-family:var(--serif)}
  .schematics .stat .lbl{font-size:8px;color:var(--mut);letter-spacing:.15em;margin-top:2px}
  /* notes */
  .note{border:1px dashed var(--line);border-left:2px solid var(--mut);background:var(--panel);
    padding:14px 16px;margin-bottom:12px}
  .note.axiom{border-left-color:var(--bone)} .note.eigen{border-left-color:var(--green)}
  .note.baseline{border-left-color:var(--blue)} .note.keystone{border-left-color:var(--gold)}
  .note.stoned{opacity:.55}
  .meta{display:flex;gap:14px;align-items:baseline;margin-bottom:8px;flex-wrap:wrap}
  .pil{font-size:9px;letter-spacing:.25em}
  .axiom .pil{color:var(--bone)} .eigen .pil{color:var(--green)}
  .baseline .pil{color:var(--blue)} .keystone .pil{color:var(--gold)}
  .dt,.nid{font-size:9px;letter-spacing:.12em;color:var(--mut)}
  .loc{font-size:9px;letter-spacing:.12em;color:var(--gold)}
  .loc.copied{color:var(--blue)}
  .loc.stoned{color:var(--green)}
  .ttl{display:block;font-size:12px;letter-spacing:.1em;margin-bottom:8px}
  .note p{color:var(--dim);font-size:11px;line-height:1.8}
  .tags{margin-top:8px;font-size:9px;letter-spacing:.12em;color:var(--mut)}
  .roots{margin-top:8px;font-size:10px;color:var(--dim)}
  .roots a{color:var(--blue);text-decoration:none} .roots a:hover{color:var(--ink)}
  .cpy{margin-top:10px}
  /* slate preview */
  #slatePreview{margin-top:10px;border:1px solid var(--blue);background:rgba(63,127,193,0.08);padding:10px;display:none}
  #slatePreview img{max-width:100%;max-height:200px;border:1px solid var(--line);margin:6px 0}
  #slatePreview .prevBody{color:var(--dim);font-size:10px;white-space:pre-wrap;line-height:1.5;max-height:100px;overflow:auto;margin:6px 0}
  footer{margin-top:56px;border-top:1px solid var(--line);padding:24px 16px;text-align:center;color:var(--dim);font-size:11px;letter-spacing:.12em;line-height:2.1}
  @media(max-width:760px){header{padding:14px 16px}.bar input{width:100%}}
</style>
</head>
<body>
<header><div class="brand">THE ARCHIVE</div><a class="back" href="index.html" target="_top">the house ↵</a></header>
<main>
  <p class="hook">the house's pull system. save from any pillar, pull from any pillar.</p>
  <div class="bar">
    <input id="q" type="text" placeholder="pull: search titles, bodies, #tags…" autocomplete="off">
    <button class="chip on" data-p="all">all</button>
    <button class="chip" data-p="axiom">axiom</button>
    <button class="chip" data-p="eigen">eigen</button>
    <button class="chip" data-p="baseline">baseline</button>
    <button class="chip" data-p="keystone">keystone</button>
  </div>
  <div id="count"></div>
  <div id="debug" style="text-align:center;font-size:9px;color:#3a4a5c;margin-bottom:10px;letter-spacing:.1em"></div>
  <div style="text-align:center;margin-bottom:14px">
    <button class="chip" id="inspectBtn" style="font-size:9px;padding:6px 10px">inspect localStorage</button>
    <button class="chip" id="exportLocalBtn" style="font-size:9px;padding:6px 10px;margin-left:6px">export local notes</button>
  </div>
  <div id="tools"></div>
  <div id="list"></div>
</main>
<footer>drop = this browser only · copy json → paste into archive/notes.json → commit = rooted forever.</footer>
<script src="sig.js" defer></script>
<script>
(function(){
  var NOTES=[], q='', pil='all';
  var LOCAL;
  try{
    LOCAL=JSON.parse(localStorage.getItem('arc.local')||'[]');
    console.log('[archive] loaded',LOCAL.length,'local notes from localStorage');
  }catch(e){
    console.error('[archive] failed to parse localStorage:',e);
    LOCAL=[];
  }
  var PENDING_IMG=null;
  var list=document.getElementById('list'), count=document.getElementById('count'), tools=document.getElementById('tools');
  function saveLocal(){
    try{
      localStorage.setItem('arc.local', JSON.stringify(LOCAL));
      console.log('[archive] saved',LOCAL.length,'notes to localStorage');
    }catch(e){
      console.error('[archive] failed to save to localStorage:',e);
    }
  }

  function flash(el,msg){
    var hint=el.querySelector('.hint');
    if(!hint) return;
    var orig=hint.textContent;
    hint.textContent=msg;
    hint.style.color='#c8452c';
    setTimeout(function(){hint.textContent=orig;hint.style.color='';},1500);
  }

  function renderTools(){
    tools.innerHTML='';
    if(pil==='axiom'){
      // ─── SCHEMATICS SECTION ───
      var sch=document.createElement('div'); sch.className='schematics';
      var schNotes=LOCAL.filter(function(n){return n.pillar==='axiom'&&(n.tags||[]).indexOf('schematic')!==-1});
      sch.innerHTML='<h5>'+
        '<svg width="16" height="16" viewBox="0 0 56 56" fill="none" stroke="#e8e4d8" stroke-width="3">'+
        '<circle cx="28" cy="28" r="11"/><line x1="28" y1="8" x2="28" y2="15"/>'+
        '<line x1="28" y1="41" x2="28" y2="48"/><line x1="8" y1="28" x2="15" y2="28"/>'+
        '<line x1="41" y1="28" x2="48" y2="28"/><circle cx="28" cy="28" r="2.5" fill="#e8e4d8" stroke="none"/></svg>'+
        'AXIOM SCHEMATICS · the bench</h5>'+
        '<div class="tools-grid">'+
          '<a class="tool-card btn" href="schematic.html" target="_blank">'+
            '<div class="icon">⚙</div>'+
            '<div class="name">SCHEMATIC BOARD</div>'+
            '<div class="desc">circuit design · component placement · wire routing · BOM · netlist</div>'+
          '</a>'+
          '<a class="tool-card btn" href="alchemy.html" target="_blank">'+
            '<div class="icon">⚗</div>'+
            '<div class="name">ALCHEMY GARDEN</div>'+
            '<div class="desc">organic chemistry · drag reagents · grow molecules · discover</div>'+
          '</a>'+
        '</div>'+
        '<div class="stats">'+
          '<div class="stat"><div class="num">'+schNotes.length+'</div><div class="lbl">schematic notes</div></div>'+
          '<div class="stat"><div class="num">'+LOCAL.filter(function(n){return n.pillar==='axiom'}).length+'</div><div class="lbl">total axiom</div></div>'+
        '</div>';
      tools.appendChild(sch);

      // ─── BENCH DROP ───
      var d=document.createElement('div'); d.className='drop';
      d.innerHTML='<h5>AXIOM DROP · from the bench / slate</h5>'+
        '<input id="nt" placeholder="title (e.g. pump specs, bench log, sourcing)">'+
        '<textarea id="nb" placeholder="the note…"></textarea>'+
        '<div class="row"><button class="btn" id="nd">drop it</button>'+
        '<button class="btn" id="ns">pull from slate</button>'+
        '<button class="btn" id="np" style="border-color:#3f7fc1;color:#3f7fc1">preview</button>'+
        '<label style="font-size:9px;color:#5c6875;display:flex;align-items:center;gap:4px;cursor:pointer">'+
          '<input type="checkbox" id="ntag" style="accent-color:#e8e4d8"> tag as #schematic</label>'+
        '<span class="hint">lives in this browser until you copy json + commit</span></div>'+
        '<div id="slatePreview"></div>';
      tools.appendChild(d);
      d.querySelector('#nd').onclick=function(){
        var t=d.querySelector('#nt').value.trim(), b=d.querySelector('#nb').value.trim();
        var isSch=d.querySelector('#ntag').checked;
        if(!t&&!b&&!PENDING_IMG) return;
        var tags=['bench'];
        if(isSch) tags.push('schematic');
        LOCAL.unshift({id:'ax-L'+Date.now(), pillar:'axiom', date:new Date().toISOString().slice(0,10),
          title:t||'bench note', body:b, tags:tags, local:true, img:PENDING_IMG||undefined});
        PENDING_IMG=null;
        saveLocal(); render(); d.querySelector('#nt').value=''; d.querySelector('#nb').value=''; d.querySelector('#ntag').checked=false;
      };
      d.querySelector('#ns').onclick=function(){
        var s=localStorage.getItem('arc.slate'); var btn=this;
        if(!s){ btn.textContent='slate quiet'; setTimeout(function(){btn.textContent='pull from slate';},1500); return; }
        var o=JSON.parse(s);
        showSlatePreview(o, d);
        btn.textContent='pulled ✓';
        setTimeout(function(){btn.textContent='pull from slate';},1500);
      };
      d.querySelector('#np').onclick=function(){
        var t=d.querySelector('#nt').value.trim(), b=d.querySelector('#nb').value.trim();
        if(!t&&!b&&!PENDING_IMG){ flash(d,'nothing to preview'); return; }
        var pv=document.getElementById('slatePreview');
        pv.style.display='block';
        pv.innerHTML='<div style="font-size:9px;letter-spacing:.2em;color:#5c6875;margin-bottom:6px">how it will render</div>'+
          '<div style="font-size:12px;color:#d9a83a;letter-spacing:.1em">'+clean(t||'bench note')+'</div>'+
          (PENDING_IMG?'<img src="'+PENDING_IMG+'" alt="preview">':'')+
          '<div class="prevBody">'+clean(b||'(no body)')+'</div>'+
          '<div style="font-size:9px;color:#5c6875;margin-top:6px">drop it to save · copy json to commit</div>';
      };
    }
    if(pil==='eigen'){
      var r=document.createElement('div'); r.className='drop room';
      r.innerHTML='<h5>EIGEN READING ROOM · private pdf viewer</h5>'+
        '<div class="row"><input type="file" id="pf" accept="application/pdf" style="border:none;background:none;padding:0">'+
        '</div><iframe id="pv" style="display:none"></iframe>'+
        '<div class="links">on the shelf: <a href="https://innvisible.gumroad.com/l/songbookvolumei" target="_blank">songbook vol. i ↗</a> · '+
        '<a href="https://innvisible.gumroad.com/l/ylwxju" target="_blank">field guide ↗</a><br>'+
        '<span class="hint">full products never live in the public repo. previews only, always.</span></div>';
      tools.appendChild(r);
      r.querySelector('#pf').onchange=function(){
        var f=this.files[0]; if(!f) return;
        var v=r.querySelector('#pv'); v.src=URL.createObjectURL(f); v.style.display='block';
      };
    }
    if(pil==='baseline'){
      var t=document.createElement('div'); t.className='tbd';
      t.innerHTML='<b>[tbd]</b> · music sessions · the booth opens later';
      tools.appendChild(t);
    }
  }

  function stitchBook(cb){
    var pages=[]; try{ pages=JSON.parse(localStorage.getItem('hive_slate_book')||'[]'); }catch(e){}
    pages=pages.filter(function(p){return !!p;});
    if(!pages.length){ cb(null); return; }
    var gap=10, loaded=0, dims=[], imgs=pages.map(function(p){ var im=new Image(); im.src=p; return im; });
    imgs.forEach(function(im,i){ im.onload=function(){ dims[i]={w:im.width,h:im.height}; loaded++;
      if(loaded===imgs.length){
        var W=Math.max.apply(null,dims.map(function(d){return d.w;}));
        var Hh=dims.reduce(function(s,d){return s+d.h;},0)+gap*(pages.length-1);
        var out=document.createElement('canvas'); out.width=W; out.height=Hh;
        var c=out.getContext('2d'); c.fillStyle='#0a0d12'; c.fillRect(0,0,W,Hh);
        var y=0; dims.forEach(function(d,i){ c.drawImage(imgs[i],0,y); y+=d.h+gap; });
        cb(out.toDataURL());
      } }; });
  }
  function showSlatePreview(o, d){
    var pv=document.getElementById('slatePreview');
    pv.style.display='block';
    pv.innerHTML='<div style="font-size:9px;letter-spacing:.2em;color:#3f7fc1;margin-bottom:6px">from the slate</div>'+
      '<div style="font-size:12px;color:#d9a83a;letter-spacing:.1em">'+clean(o.title||'slate')+'</div>'+
      (o.img?'<img src="'+o.img+'" alt="slate preview">':'')+
      '<div class="prevBody" style="color:#5c6875;font-style:italic">'+(o.body?('wall lettering: '+clean(o.body)):'(no lettering · the drawing carries it)')+'</div>'+
      '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">'+
      '<button class="btn" id="usePage" style="border-color:#3f7fc1;color:#3f7fc1">drop page</button>'+
      '<button class="btn" id="useBook" style="border-color:#3f7fc1;color:#3f7fc1">drop whole book</button>'+
      '</div>';
    pv.querySelector('#usePage').onclick=function(){
      if(o.img) PENDING_IMG=o.img;
      d.querySelector('#nt').value=o.title||''; d.querySelector('#nb').value='';
      pv.style.display='none';
    };
    pv.querySelector('#useBook').onclick=function(){
      stitchBook(function(img){
        if(!img){ var b=pv.querySelector('#useBook'); b.textContent='book empty'; setTimeout(function(){b.textContent='drop whole book';},1500); return; }
        PENDING_IMG=img;
        var n=(JSON.parse(localStorage.getItem('hive_slate_book')||'[]').filter(function(p){return !!p;})).length;
        d.querySelector('#nt').value='slate · the whole book · '+n+' page'+(n===1?'':'s'); d.querySelector('#nb').value='';
        pv.style.display='none';
      });
    };
  }

  function card(n){
    var c=document.createElement('div'); c.className='note '+n.pillar+(n.stoned?' stoned':''); c.id='n-'+n.id;
    var m=document.createElement('div'); m.className='meta';
    var rung='';
    if(n.local){
      if(n.stoned) rung='<span class="loc stoned">stoned · '+n.stoned+'</span>';
      else if(n.copied) rung='<span class="loc copied">copied · awaits stone</span>';
      else rung='<span class="loc">local · unpushed</span>';
    }
    m.innerHTML='<span class="pil">'+n.pillar+'</span><span class="dt">'+(n.date||'')+'</span><span class="nid">'+n.id+'</span>'+rung;
    var h=document.createElement('b'); h.className='ttl'; h.textContent=n.title;
    var b=document.createElement('p'); b.textContent=n.body; b.style.whiteSpace='pre-wrap';
    c.appendChild(m); c.appendChild(h); c.appendChild(b);
    if(n.img){ var im=document.createElement('img'); im.src=n.img;
      im.style.cssText='max-width:100%;margin-top:10px;border:1px solid #223041'; c.appendChild(im); }
    if(n.tags&&n.tags.length){var tg=document.createElement('div');tg.className='tags';tg.textContent='# '+n.tags.join('  # ');c.appendChild(tg);}
    if(n.roots&&n.roots.length){var r=document.createElement('div');r.className='roots';
      r.innerHTML='roots: '+n.roots.map(function(x){return '<a href="#n-'+x+'">'+x+'</a>';}).join(' · ');c.appendChild(r);}
    if(n.local){
      var cp=document.createElement('button'); cp.className='btn cpy'; cp.textContent='copy json';
      cp.setAttribute('data-id',n.id); c.appendChild(cp);
      if(n.copied && !n.stoned){
        var st=document.createElement('button'); st.className='btn stone'; st.textContent='stone it ✓';
        st.setAttribute('data-id',n.id); st.style.cssText='margin-left:8px;border-color:#58a36a;color:#58a36a';
        c.appendChild(st);
      }
      var del=document.createElement('button'); del.className='btn del'; del.textContent='delete';
      del.setAttribute('data-id',n.id); del.style.cssText='margin-left:8px;border-color:#c8452c;color:#c8452c';
      c.appendChild(del);
      if(n.img){ var sp=document.createElement('button'); sp.className='btn svgbtn'; sp.textContent='save png';
        sp.setAttribute('data-id',n.id); sp.style.marginLeft='8px'; c.appendChild(sp); }
    }
    return c;
  }

  function clean(s){ return String(s).replace(/[<>&"]/g,''); }

  function render(){
    list.innerHTML=''; var shown=0;
    var allNotes=LOCAL.concat(NOTES);
    console.log('[archive] rendering',allNotes.length,'total notes (',LOCAL.length,'local +',NOTES.length,'from json)');

    allNotes.forEach(function(n){
      if(pil!=='all' && n.pillar!==pil) return;
      var hay=(n.id+' '+n.title+' '+n.body+' '+(n.tags||[]).join(' ')).toLowerCase();
      if(q && hay.indexOf(q)<0) return;
      shown++; list.appendChild(card(n));
    });
    count.textContent=shown+' note'+(shown===1?'':'s')+' pulled';

    // Debug info
    var debug=document.getElementById('debug');
    if(debug){
      debug.textContent='localStorage: '+LOCAL.length+' notes · notes.json: '+NOTES.length+' notes · total: '+allNotes.length;
    }
  }

  list.addEventListener('click',function(e){
    var id=e.target.getAttribute&&e.target.getAttribute('data-id'); if(!id) return;
    var n=LOCAL.filter(function(x){return x.id===id;})[0]; if(!n) return;
    if(e.target.classList.contains('svgbtn')){
      var a=document.createElement('a'); a.href=n.img; a.download=id+'.png'; a.click(); return; }
    if(e.target.classList.contains('del')){
      if(!confirm('unhook this note from this browser?')) return;
      LOCAL=LOCAL.filter(function(x){return x.id!==id;});
      saveLocal(); render(); return; }
    if(e.target.classList.contains('stone')){
      n.stoned=new Date().toISOString().slice(0,10);
      saveLocal(); render(); return;
    }
    if(!e.target.classList.contains('cpy')) return;
    var o={id:n.id,pillar:n.pillar,date:n.date,title:n.title,tags:n.tags,body:n.body};
    if(n.img) o.img='archive/img/'+id+'.png';
    navigator.clipboard.writeText(JSON.stringify(o)).then(function(){
      n.copied=true; saveLocal(); render();
      var btn=e.target; btn.textContent='copied ✓'; setTimeout(function(){btn.textContent='copy json';},1500);
    });
  });

  document.getElementById('q').addEventListener('input',function(){q=this.value.toLowerCase();render();});
  var chips=document.querySelectorAll('.bar .chip');
  chips.forEach(function(ch){ ch.addEventListener('click',function(){
    chips.forEach(function(x){x.classList.remove('on');}); ch.classList.add('on');
    pil=ch.getAttribute('data-p'); renderTools(); render();
  });});

  // Inspect localStorage button
  document.getElementById('inspectBtn').addEventListener('click',function(){
    var data=localStorage.getItem('arc.local');
    if(!data){
      alert('arc.local is empty — no notes in localStorage for this browser/domain');
      return;
    }
    try{
      var parsed=JSON.parse(data);
      var msg='Found '+parsed.length+' notes in localStorage:\n\n';
      parsed.slice(0,5).forEach(function(n,i){
        msg+=(i+1)+'. ['+n.pillar+'] '+n.title+' ('+n.id+')\n';
      });
      if(parsed.length>5) msg+='\n... and '+(parsed.length-5)+' more';
      msg+='\n\nOpen browser console to see full data.';
      alert(msg);
      console.log('[archive] full localStorage data:',parsed);
    }catch(e){
      alert('Error parsing localStorage: '+e.message);
    }
  });

  // Export local notes button
  document.getElementById('exportLocalBtn').addEventListener('click',function(){
    if(LOCAL.length===0){
      alert('No local notes to export');
      return;
    }
    var data=JSON.stringify(LOCAL,null,2);
    var blob=new Blob([data],{type:'application/json'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url;
    a.download='archive-local-notes-'+new Date().toISOString().slice(0,10)+'.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  fetch('archive/notes.json').then(function(r){
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.json();
  }).then(function(d){
    NOTES=d;
    console.log('[archive] loaded',NOTES.length,'notes from notes.json');
    render();
  }).catch(function(err){
    console.warn('[archive] notes.json fetch failed:',err);
    if(LOCAL.length===0){
      count.textContent='the archive is quiet. (notes.json missing or '+LOCAL.length+' local notes)';
    }
    render();
  });
  renderTools();
  render();
})();
</script>

<script>
/* ---- the word · leaf reconnect · sealed leaves wake here ---- */
(function(){
  console.log('[archive-reconnect] script loaded');
  function unb64(str){ var bin=atob(str), a=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i); return a; }
  var SALT=new TextEncoder().encode('hive-vault-v0-salt');
  function derive(pass){ return crypto.subtle.importKey('raw',new TextEncoder().encode(pass),{name:'PBKDF2'},false,['deriveKey'])
    .then(function(k){ return crypto.subtle.deriveKey({name:'PBKDF2',salt:SALT,iterations:100000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt']); }); }
  var _key=null;
  function parentVault(){ try{ if(window.parent&&window.parent!==window&&window.parent.vaultIsOpen&&window.parent.vaultIsOpen()) return window.parent; }catch(e){} return null; }
  function ready(){ return !!parentVault()||!!_key; }
  function decOne(pkgStr){
    var P=parentVault(); if(P) return P.vaultDecrypt(pkgStr);
    if(!_key) return Promise.reject('locked');
    var pkg=JSON.parse(pkgStr);
    return crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(pkg.iv)},_key,unb64(pkg.ct))
      .then(function(pt){ return new TextDecoder().decode(pt); });
  }
  var bar=document.createElement('div');
  bar.style.cssText='text-align:center;margin:0 0 14px';
  bar.innerHTML='<button id="arcV" class="chip">the word · reconnect</button> '
    +'<input id="arcP" type="password" placeholder="house password" style="display:none;background:#0e141b;border:1px solid #223041;color:#e8e4d8;font:11px ui-monospace,monospace;padding:8px 10px;margin-left:6px;width:180px"> '
    +'<span id="arcS" style="font-size:9px;letter-spacing:.15em;color:#5c6875;margin-left:8px"></span>';
  var list=document.getElementById('list');
  if(list&&list.parentNode) list.parentNode.insertBefore(bar,list);
  else document.body.appendChild(bar);
  var btn=bar.querySelector('#arcV'), inp=bar.querySelector('#arcP'), st=bar.querySelector('#arcS');
  function state(){ st.textContent=ready()?('vault · '+(parentVault()?'borrowed from the pillar':'open on this glass')):'vault · shut · leaves stay sealed'; st.style.color=ready()?'#58a36a':'#5c6875'; }
  btn.onclick=function(){ inp.style.display=(inp.style.display==='none')?'inline-block':'none'; if(inp.style.display!=='none') inp.focus(); state(); };
  inp.addEventListener('keydown',function(e){
    if(e.key!=='Enter') return;
    var p=inp.value;
    if(!p) return;
    console.log('[archive-reconnect] attempting derive...');
    derive(p).then(function(k){
      _key=k;
      inp.value='';
      inp.style.display='none';
      state();
      console.log('[archive-reconnect] key derived, waking leaves');
      wake(true);
    }).catch(function(err){
      console.error('[archive-reconnect] derive failed:', err);
      st.textContent='the word refused';
      st.style.color='#c8452c';
    });
  });
  function wake(force){
    var ps=document.querySelectorAll('#list p');
    console.log('[archive-reconnect] wake called, found', ps.length, 'p elements, ready:', ready());
    for(var i=0;i<ps.length;i++){
      var p=ps[i], t=p.textContent||'';
      if(t.indexOf('{"iv":')<0) continue;
      if(p.getAttribute('data-dec')==='1'&&!force) continue;
      if(!ready()){ p.setAttribute('data-dec','0'); continue; }
      p.setAttribute('data-dec','1');
      (function(el,src){
        var re=/\{"iv":"[^"]+","ct":"[^"]+"\}/g, m, jobs=[];
        while((m=re.exec(src))!==null) jobs.push(m[0]);
        console.log('[archive-reconnect] found', jobs.length, 'sealed packages in this leaf');
        if(!jobs.length){ el.setAttribute('data-dec','0'); return; }
        Promise.all(jobs.map(function(j){ return decOne(j).catch(function(){ return null; }); }))
          .then(function(pts){
            var ok=true, res=src;
            jobs.forEach(function(j,k){ if(pts[k]==null){ ok=false; return; } res=res.split(j).join(pts[k]); });
            if(!ok){ el.setAttribute('data-dec','0'); return; }
            el.textContent=res;
            console.log('[archive-reconnect] leaf decrypted successfully');
          });
      })(p,t);
    }
    state();
  }
  setInterval(function(){ wake(false); },700);
  console.log('[archive-reconnect] starting wake loop');
  wake(false);
})();
</script>

<script>
/* ==== the fold, v2 \u00b7 archive density \u00b7 as much or as little as you like ==== */
(function(){
  var DKEY='hive_arc_density';
  var mode=localStorage.getItem(DKEY)||'full'; /* full | preview | compact */
  function metaEls(){
    var out=[], all=document.querySelectorAll('div,span,p');
    for(var i=0;i<all.length;i++){
      var t=(all[i].textContent||'');
      if(t.length>220) continue;
      if(/\b(ax|ex|ba|ke|sl|tp|eg)-[A-Za-z0-9]{3,}\b/.test(t) && /local|unpushed|rooted|stoned|\d{4}-\d{2}-\d{2}/.test(t)) out.push(all[i]);
    }
    return out;
  }
  function cardOf(meta){
    var el=meta;
    for(var up=0; up<3 && el; up++){ el=el.parentElement; if(el && el.children.length>=3) return el; }
    return null;
  }
  function parts(card, meta){
    var kids=[], i;
    for(i=0;i<card.children.length;i++) kids.push(card.children[i]);
    var hi=kids.indexOf(meta);
    if(hi<0){ for(i=0;i<kids.length;i++){ if(kids[i].contains&&kids[i].contains(meta)){ hi=i; break; } } }
    var btnIdx=-1, tagsIdx=-1;
    for(i=hi+1;i<kids.length;i++){
      if(btnIdx<0 && kids[i].querySelector && kids[i].querySelector('button')) btnIdx=i;
      if(tagsIdx<0 && /^\s*#/.test(kids[i].textContent||'')) tagsIdx=i;
    }
    var end=(btnIdx>-1)?btnIdx:kids.length;
    var body=[];
    for(i=hi+2;i<end;i++){ if(i!==tagsIdx) body.push(kids[i]); }
    return {body:body, tags:(tagsIdx>-1&&tagsIdx<end)?kids[tagsIdx]:null};
  }
  function applyCard(card, meta, m){
    var p=parts(card, meta);
    p.body.forEach(function(b){
      if(m==='compact'){ b.style.display='none'; }
      else if(m==='preview'){ b.style.display=''; b.style.maxHeight='4.8em'; b.style.overflow='hidden'; }
      else { b.style.display=''; b.style.maxHeight=''; b.style.overflow=''; }
    });
    if(p.tags) p.tags.style.display=(m==='compact')?'none':'';
    var caret=meta.querySelector('.foldCaret');
    if(caret) caret.textContent={full:' \u25be full', preview:' \u25d0 preview', compact:' \u25b8 compact'}[m];
  }
  function applyAll(){
    metaEls().forEach(function(meta){
      var card=cardOf(meta); if(!card) return;
      if(!meta.querySelector('.foldCaret')){
        var c=document.createElement('span'); c.className='foldCaret';
        c.style.cssText='color:#5c6875;font-size:9px;letter-spacing:.15em;cursor:pointer;margin-left:8px';
        meta.appendChild(c);
        c.onclick=function(e){
          e.stopPropagation();
          var cur=card.getAttribute('data-fold')||mode;
          var next=(cur==='full')?'preview':(cur==='preview'?'compact':'full');
          card.setAttribute('data-fold',next); applyCard(card,meta,next);
        };
      }
      applyCard(card, meta, card.getAttribute('data-fold')||mode);
    });
  }
  var bar=document.createElement('div');
  bar.style.cssText='text-align:center;margin:6px 0 10px';
  bar.innerHTML='<span style="font-size:9px;color:#5c6875;letter-spacing:.2em;margin-right:8px">density</span>'+
    ['full','preview','compact'].map(function(m){
      return '<button data-d="'+m+'" style="background:none;border:1px solid '+(m===mode?'#d9a83a':'#223041')+';color:'+(m===mode?'#d9a83a':'#93a1b0')+';font:9px ui-monospace,Consolas,monospace;letter-spacing:.12em;padding:3px 9px;cursor:pointer;margin:0 2px">'+m+'</button>';
    }).join('');
  function placeBar(){ if(!bar.parentNode && document.body) document.body.insertBefore(bar, document.body.firstChild); }
  bar.querySelectorAll('[data-d]').forEach(function(b){
    b.onclick=function(){
      mode=b.getAttribute('data-d'); localStorage.setItem(DKEY,mode);
      document.querySelectorAll('[data-fold]').forEach(function(c){ c.removeAttribute('data-fold'); });
      bar.querySelectorAll('[data-d]').forEach(function(x){ var on=x.getAttribute('data-d')===mode; x.style.borderColor=on?'#d9a83a':'#223041'; x.style.color=on?'#d9a83a':'#93a1b0'; });
      applyAll();
    };
  });
  placeBar(); applyAll(); setInterval(function(){ placeBar(); applyAll(); },1200);
})();
</script>

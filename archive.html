<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Archive | Inn.Visible</title>
<style>
  :root{--bg:#0a0d12;--panel:#0e141b;--line:#223041;--ink:#e8e4d8;--dim:#93a1b0;
    --gold:#d9a83a;--blue:#3f7fc1;--green:#58a36a;--bone:#e8e4d8;--mut:#5c6875;
    --mono:ui-monospace,"Cascadia Mono","JetBrains Mono",Consolas,monospace;
    --serif:Georgia,"Times New Roman",serif}
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--mono)}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.10;
    background:linear-gradient(var(--line) 1px,transparent 1px) 0 0/100% 140px,
               linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/180px 100%}
  header{display:flex;justify-content:space-between;align-items:center;padding:18px 44px;border-bottom:1px solid var(--line)}
  .brand{font-size:15px;letter-spacing:.35em}
  .back{color:var(--dim);text-decoration:none;font-size:12px;letter-spacing:.15em}
  .back:hover{color:var(--ink)}
  main{max-width:960px;margin:0 auto;padding:44px 24px 0}
  .hook{font-family:var(--serif);font-style:italic;font-size:clamp(15px,2.2vw,20px);text-align:center;color:var(--dim)}
  .bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:22px 0 8px}
  .bar input{background:var(--panel);border:1px solid var(--line);color:var(--ink);
    font-family:var(--mono);font-size:11px;letter-spacing:.08em;padding:9px 12px;width:260px}
  .bar input:focus{outline:none;border-color:var(--dim)}
  .chip{border:1px solid var(--line);color:var(--dim);background:none;font-family:var(--mono);
    font-size:10px;letter-spacing:.15em;padding:9px 12px;cursor:pointer}
  .chip.on{border-color:var(--gold);color:var(--gold)}
  #count{text-align:center;font-size:9px;letter-spacing:.2em;color:var(--mut);margin:10px 0 18px}
  /* tools */
  #tools{margin:0 0 18px}
  .drop{border:1px dashed var(--line);background:var(--panel);padding:14px 16px}
  .drop h5{font-size:10px;letter-spacing:.25em;color:var(--bone);margin-bottom:10px}
  .drop input,.drop textarea{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--ink);
    font-family:var(--mono);font-size:11px;padding:8px 10px;margin-bottom:8px}
  .drop textarea{min-height:64px;resize:vertical;line-height:1.7}
  .drop input:focus,.drop textarea:focus{outline:none;border-color:var(--dim)}
  .drop .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .btn{border:1px solid var(--gold);color:var(--gold);background:none;font-family:var(--mono);
    font-size:10px;letter-spacing:.15em;padding:7px 12px;cursor:pointer}
  .btn:hover{background:var(--gold);color:#0a0d12}
  .hint{font-size:9px;letter-spacing:.12em;color:var(--mut)}
  .tbd{border:1px dashed var(--line);padding:16px;text-align:center;color:var(--mut);
    font-size:10px;letter-spacing:.2em}
  .tbd b{color:var(--blue)}
  .room iframe{width:100%;height:70vh;border:1px solid var(--line);background:var(--panel);margin-top:10px}
  .room .links{margin-top:10px;font-size:10px;letter-spacing:.12em;color:var(--dim)}
  .room a{color:var(--blue);text-decoration:none} .room a:hover{color:var(--ink)}
  /* notes */
  .note{border:1px dashed var(--line);border-left:2px solid var(--mut);background:var(--panel);
    padding:14px 16px;margin-bottom:12px}
  .note.axiom{border-left-color:var(--bone)} .note.eigen{border-left-color:var(--green)}
  .note.baseline{border-left-color:var(--blue)} .note.keystone{border-left-color:var(--gold)}
  .note.stoned{opacity:.55}
  .meta{display:flex;gap:14px;align-items:baseline;margin-bottom:8px;flex-wrap:wrap}
  .pil{font-size:9px;letter-spacing:.25em}
  .axiom .pil{color:var(--bone)} .eigen .pil{color:var(--green)}
  .baseline .pil{color:var(--blue)} .keystone .pil{color:var(--gold)}
  .dt,.nid{font-size:9px;letter-spacing:.12em;color:var(--mut)}
  .loc{font-size:9px;letter-spacing:.12em;color:var(--gold)}
  .loc.copied{color:var(--blue)}
  .loc.stoned{color:var(--green)}
  .ttl{display:block;font-size:12px;letter-spacing:.1em;margin-bottom:8px}
  .note p{color:var(--dim);font-size:11px;line-height:1.8}
  .tags{margin-top:8px;font-size:9px;letter-spacing:.12em;color:var(--mut)}
  .roots{margin-top:8px;font-size:10px;color:var(--dim)}
  .roots a{color:var(--blue);text-decoration:none} .roots a:hover{color:var(--ink)}
  .cpy{margin-top:10px}
  footer{margin-top:56px;border-top:1px solid var(--line);padding:24px 16px;text-align:center;color:var(--dim);font-size:11px;letter-spacing:.12em;line-height:2.1}
  @media(max-width:760px){header{padding:14px 16px}.bar input{width:100%}}
</style>
</head>
<body>
<header><div class="brand">THE ARCHIVE</div><a class="back" href="index.html" target="_top">the house ↵</a></header>
<main>
  <p class="hook">the house's pull system. save from any pillar, pull from any pillar.</p>
  <div class="bar">
    <input id="q" type="text" placeholder="pull: search titles, bodies, #tags…" autocomplete="off">
    <button class="chip on" data-p="all">all</button>
    <button class="chip" data-p="axiom">axiom</button>
    <button class="chip" data-p="eigen">eigen</button>
    <button class="chip" data-p="baseline">baseline</button>
    <button class="chip" data-p="keystone">keystone</button>
  </div>
  <div id="count"></div>
  <div id="tools"></div>
  <div id="list"></div>
</main>
<footer>drop = this browser only · copy json → paste into archive/notes.json → commit = rooted forever.</footer>
<script src="sig.js" defer></script>
<script>
(function(){
  var NOTES=[], q='', pil='all';
  var LOCAL=JSON.parse(localStorage.getItem('arc.local')||'[]');
    var PENDING_IMG=null;
  var list=document.getElementById('list'), count=document.getElementById('count'), tools=document.getElementById('tools');
  function saveLocal(){ localStorage.setItem('arc.local', JSON.stringify(LOCAL)); }

  function renderTools(){
    tools.innerHTML='';
    if(pil==='axiom'){
      var d=document.createElement('div'); d.className='drop';
      d.innerHTML='<h5>AXIOM DROP · from the bench / slate</h5>'+
        '<input id="nt" placeholder="title (e.g. pump specs, bench log, sourcing)">'+
        '<textarea id="nb" placeholder="the note…"></textarea>'+
               '<div class="row"><button class="btn" id="nd">drop it</button>'+
        '<button class="btn" id="ns">pull from slate</button>'+
        '<span class="hint">lives in this browser until you copy json + commit</span></div>';
      tools.appendChild(d);
      d.querySelector('#nd').onclick=function(){
        var t=d.querySelector('#nt').value.trim(), b=d.querySelector('#nb').value.trim();
        if(!t&&!b) return;
        LOCAL.unshift({id:'ax-L'+Date.now(), pillar:'axiom', date:new Date().toISOString().slice(0,10),
          title:t||'bench note', body:b, tags:['bench'], local:true, img:PENDING_IMG||undefined});
        PENDING_IMG=null;
        saveLocal(); render(); d.querySelector('#nt').value=''; d.querySelector('#nb').value='';
      };
        d.querySelector('#ns').onclick=function(){
        var s=localStorage.getItem('arc.slate'); var btn=this;
        if(!s){ btn.textContent='slate quiet'; setTimeout(function(){btn.textContent='pull from slate';},1500); return; }
        var o=JSON.parse(s);
          if(o.img) PENDING_IMG=o.img;
        d.querySelector('#nt').value=o.title||''; d.querySelector('#nb').value=o.body||'';
        localStorage.removeItem('arc.slate'); btn.textContent='pulled ✓';
      };
    }
    if(pil==='eigen'){
      var r=document.createElement('div'); r.className='drop room';
      r.innerHTML='<h5>EIGEN READING ROOM · private pdf viewer</h5>'+
        '<div class="row"><input type="file" id="pf" accept="application/pdf" style="border:none;background:none;padding:0">'+
        '</div><iframe id="pv" style="display:none"></iframe>'+
        '<div class="links">on the shelf: <a href="https://innvisible.gumroad.com/l/songbookvolumei" target="_blank">songbook vol. i ↗</a> · '+
        '<a href="https://innvisible.gumroad.com/l/ylwxju" target="_blank">field guide ↗</a><br>'+
        '<span class="hint">full products never live in the public repo. previews only, always.</span></div>';
      tools.appendChild(r);
      r.querySelector('#pf').onchange=function(){
        var f=this.files[0]; if(!f) return;
        var v=r.querySelector('#pv'); v.src=URL.createObjectURL(f); v.style.display='block';
      };
    }
    if(pil==='baseline'){
      var t=document.createElement('div'); t.className='tbd';
      t.innerHTML='<b>[tbd]</b> · music sessions · the booth opens later';
      tools.appendChild(t);
    }
  }

  function card(n){
    var c=document.createElement('div'); c.className='note '+n.pillar+(n.stoned?' stoned':''); c.id='n-'+n.id;
    var m=document.createElement('div'); m.className='meta';
    var rung='';
    if(n.local){
      if(n.stoned) rung='<span class="loc stoned">stoned \u00b7 '+n.stoned+'</span>';
      else if(n.copied) rung='<span class="loc copied">copied \u00b7 awaits stone</span>';
      else rung='<span class="loc">local \u00b7 unpushed</span>';
    }
    m.innerHTML='<span class="pil">'+n.pillar+'</span><span class="dt">'+(n.date||'')+'</span><span class="nid">'+n.id+'</span>'+rung;
    var h=document.createElement('b'); h.className='ttl'; h.textContent=n.title;
           var b=document.createElement('p'); b.textContent=n.body; b.style.whiteSpace='pre-wrap';
       c.appendChild(m); c.appendChild(h); c.appendChild(b);
    if(n.img){ var im=document.createElement('img'); im.src=n.img;
      im.style.cssText='max-width:100%;margin-top:10px;border:1px solid #223041'; c.appendChild(im); }
    if(n.tags&&n.tags.length){var tg=document.createElement('div');tg.className='tags';tg.textContent='# '+n.tags.join('  # ');c.appendChild(tg);}
    if(n.roots&&n.roots.length){var r=document.createElement('div');r.className='roots';
      r.innerHTML='roots: '+n.roots.map(function(x){return '<a href="#n-'+x+'">'+x+'</a>';}).join(' \u00b7 ');c.appendChild(r);}
                if(n.local){
      var cp=document.createElement('button'); cp.className='btn cpy'; cp.textContent='copy json';
      cp.setAttribute('data-id',n.id); c.appendChild(cp);
      if(n.copied && !n.stoned){
        var st=document.createElement('button'); st.className='btn stone'; st.textContent='stone it \u2713';
        st.setAttribute('data-id',n.id); st.style.cssText='margin-left:8px;border-color:#58a36a;color:#58a36a';
        c.appendChild(st);
      }
      var del=document.createElement('button'); del.className='btn del'; del.textContent='delete';
      del.setAttribute('data-id',n.id); del.style.cssText='margin-left:8px;border-color:#c8452c;color:#c8452c';
      c.appendChild(del);
      if(n.img){ var sp=document.createElement('button'); sp.className='btn svgbtn'; sp.textContent='save png';
        sp.setAttribute('data-id',n.id); sp.style.marginLeft='8px'; c.appendChild(sp); }
    }
    return c;
  }

  function render(){
    list.innerHTML=''; var shown=0;
    LOCAL.concat(NOTES).forEach(function(n){
      if(pil!=='all' && n.pillar!==pil) return;
      var hay=(n.id+' '+n.title+' '+n.body+' '+(n.tags||[]).join(' ')).toLowerCase();
      if(q && hay.indexOf(q)<0) return;
      shown++; list.appendChild(card(n));
    });
    count.textContent=shown+' note'+(shown===1?'':'s')+' pulled';
  }

    list.addEventListener('click',function(e){
    var id=e.target.getAttribute&&e.target.getAttribute('data-id'); if(!id) return;
    var n=LOCAL.filter(function(x){return x.id===id;})[0]; if(!n) return;
       if(e.target.classList.contains('svgbtn')){
      var a=document.createElement('a'); a.href=n.img; a.download=id+'.png'; a.click(); return; }
    if(e.target.classList.contains('del')){
      if(!confirm('unhook this note from this browser?')) return;
      LOCAL=LOCAL.filter(function(x){return x.id!==id;});
      saveLocal(); render(); return; }
    if(e.target.classList.contains('stone')){
      n.stoned=new Date().toISOString().slice(0,10);
      saveLocal(); render(); return;
    }
    if(!e.target.classList.contains('cpy')) return;
    var o={id:n.id,pillar:n.pillar,date:n.date,title:n.title,tags:n.tags,body:n.body};
    if(n.img) o.img='archive/img/'+id+'.png';
    navigator.clipboard.writeText(JSON.stringify(o)).then(function(){
      n.copied=true; saveLocal(); render();
      var btn=e.target; btn.textContent='copied \u2713'; setTimeout(function(){btn.textContent='copy json';},1500);
    });
  });

  document.getElementById('q').addEventListener('input',function(){q=this.value.toLowerCase();render();});
  var chips=document.querySelectorAll('.chip');
  chips.forEach(function(ch){ ch.addEventListener('click',function(){
    chips.forEach(function(x){x.classList.remove('on');}); ch.classList.add('on');
    pil=ch.getAttribute('data-p'); renderTools(); render();
  });});

  fetch('archive/notes.json').then(function(r){return r.json();}).then(function(d){NOTES=d;render();})
    .catch(function(){count.textContent='the archive is quiet. (notes.json missing)';});
  renderTools();
})();
</script>
</body>
</html>

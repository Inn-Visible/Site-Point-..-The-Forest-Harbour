<script>
/* ---- the inbox seat \u00b7 leaves land themselves, no pulling ---- */
(function(){
  var EXCL=['arc.inbox','hive_kit','hive_slate_v2'];
  function excl(k){ for(var i=0;i<EXCL.length;i++){ if(k.indexOf(EXCL[i])===0) return true; } return false; }
  function pagesKey(){ for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i); if(excl(k)) continue;
    try{ var v=JSON.parse(localStorage.getItem(k));
      if(Object.prototype.toString.call(v)==='[object Array]'&&v.length&&typeof v[v.length-1]==='string'&&v[v.length-1].indexOf('data:image')===0) return k; }catch(e){} }
    return null; }
  function notesKey(){ for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i); if(excl(k)) continue;
    try{ var v=JSON.parse(localStorage.getItem(k));
      if(Object.prototype.toString.call(v)==='[object Array]'&&v.length&&v[0]&&typeof v[0]==='object'&&('title' in v[0])&&('body' in v[0]||'text' in v[0])) return k; }catch(e){} }
    return null; }
  function wrap(g,text,x,y,maxW,lh){ var words=String(text).split(/\s+/), line='';
    for(var i=0;i<words.length;i++){ var t=line?line+' '+words[i]:words[i];
      if(g.measureText(t).width>maxW&&line){ g.fillText(line,x,y); y+=lh; line=words[i]; } else line=t; }
    if(line) g.fillText(line,x,y); return y+lh; }
  function card(it){ var CW=1000, CH=1400; var c=document.createElement('canvas'); c.width=CW; c.height=CH;
    var g=c.getContext('2d'); g.fillStyle='#f2efe6'; g.fillRect(0,0,CW,CH);
    g.fillStyle='#1c2430'; g.font='28px ui-monospace,Consolas,monospace'; g.fillText(it.title||'untitled',40,56);
    var y=100;
    if(it.body){ g.font='20px ui-monospace,Consolas,monospace'; g.fillStyle='#3a4150'; y=wrap(g,it.body,40,y,CW-80,28)+20; }
    if(it._im&&it._im.width){ var availH=CH-y-60, s=Math.min((CW-80)/it._im.width, availH/it._im.height);
      if(s>0) g.drawImage(it._im,40,y,it._im.width*s,it._im.height*s); }
    return c.toDataURL('image/png'); }
  function finish(list){
    var pk=pagesKey(), nk=notesKey(), n=0;
    var pages=pk?JSON.parse(localStorage.getItem(pk)):[];
    var notes=nk?JSON.parse(localStorage.getItem(nk)):[];
    list.forEach(function(it){ pages.push(card(it));
      notes.push({title:it.title||'slate leaf', body:it.body||'', img:it.img||null, t:it.t||Date.now(), tag:'slate'}); n++; });
    try{ if(pk) localStorage.setItem(pk,JSON.stringify(pages)); }catch(e){}
    try{ if(nk) localStorage.setItem(nk,JSON.stringify(notes)); }catch(e){}
    localStorage.removeItem('arc.inbox');
    var w=document.getElementById('nbWarn'); if(w) w.textContent=n+' leaf'+(n>1?'s':'')+' seated \u00b7 reseating the book\u2026';
    setTimeout(function(){ location.reload(); },700); }
  function consume(){
    var raw=null; try{ raw=localStorage.getItem('arc.inbox'); }catch(e){}
    if(!raw) return; var list; try{ list=JSON.parse(raw); }catch(e){ return; }
    if(!list||!list.length){ localStorage.removeItem('arc.inbox'); return; }
    var withImg=list.filter(function(it){ return !!it.img; });
    if(!withImg.length){ finish(list); return; }
    var pend=withImg.length;
    function go(){ if(--pend>0) return; finish(list); }
    withImg.forEach(function(it){ var im=new Image(); im.onload=go; im.onerror=go; im.src=it.img; it._im=im; });
  }
  window.hiveArchiveAdd=function(it){ try{ var L=JSON.parse(localStorage.getItem('arc.inbox')||'[]'); L.push(it);
    localStorage.setItem('arc.inbox',JSON.stringify(L)); }catch(e){} consume(); };
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',function(){ setTimeout(consume,500); });
  else setTimeout(consume,500);
})();
</script>

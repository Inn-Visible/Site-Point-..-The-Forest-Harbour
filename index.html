<script>

  } else {

/* ---- THE HOURGLASS & ORB (Aug 4 Original) ---- */
const TOP_DIR = +1, BOT_DIR = -1;
const canvas = document.getElementById('loader'), ctx = canvas.getContext('2d');
let W=0,H=0;
function resize(){const d=devicePixelRatio||1;W=canvas.clientWidth;H=canvas.clientHeight;
  canvas.width=W*d;canvas.height=H*d;ctx.setTransform(d,0,0,d,0,0);}
addEventListener('resize',resize);
addEventListener('load',resize);
resize();

const r=Math.sqrt(8)/3;
const V=[[0,-1,0],[r,1/3,0],[-r/2,1/3,r*.8660254],[-r/2,1/3,-r*.8660254]];
const FACES=[[0,1,2],[0,2,3],[0,3,1],[1,2,3]];
const EDGES=[[0,1],[0,2],[0,3],[1,2],[2,3],[3,1]];
const edgeFaces=EDGES.map(([a,b])=>{const i=[];FACES.forEach((f,k)=>{if(f.includes(a)&&f.includes(b))i.push(k);});return i;});
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];

function drawTetra(cx,cy,size,t,dir,phase,stroke,glow,flip){
  const SPEED=0.35;
  const spin=t*SPEED*dir;
  const tilt=-0.42, wob=0.05*Math.sin(t*0.6+phase);
  const cs=Math.cos(spin),sn=Math.sin(spin),cx_=Math.cos(tilt),sx_=Math.sin(tilt),
        cw=Math.cos(wob),sw=Math.sin(wob);
  const P=V.map(v=>{
    let [x,y,z]=flip?[v[0],-v[1],v[2]]:v;
    let X=x*cs+z*sn,Y=y,Z=-x*sn+z*cs;
    let Y2=Y*cx_-Z*sx_,Z2=Y*sx_+Z*cx_;
    return [X*cw-Y2*sw, X*sw+Y2*cw, Z2];
  });
  const f=4.2;
  const proj=P.map(([x,y,z])=>{const p=f/(f-z);return [cx+x*size*p, cy-y*size*p];});
  const cam=[0,0,f];
  const vis=FACES.map(face=>{
    const [a,b,c]=face.map(i=>P[i]);
    let n=cross(sub(b,a),sub(c,a));
    const cent=[(a[0]+b[0]+c[0])/3,(a[1]+b[1]+c[1])/3,(a[2]+b[2]+c[2])/3];
    if(dot(n,cent)<0)n=n.map(v=>-v);
    return dot(n,sub(cent,cam))<0;
  });
  EDGES.forEach(([a,b],i)=>{
    const hidden=!vis[edgeFaces[i][0]]&&!vis[edgeFaces[i][1]];
    ctx.save();
    if(hidden){ctx.setLineDash([6,7]);ctx.strokeStyle=stroke;ctx.globalAlpha=.3;ctx.lineWidth=1.3;}
    else{ctx.setLineDash([]);ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.shadowColor=glow;ctx.shadowBlur=16;}
    ctx.beginPath();ctx.moveTo(...proj[a]);ctx.lineTo(...proj[b]);ctx.stroke();ctx.restore();
  });
  proj.forEach(([x,y])=>{ctx.save();ctx.fillStyle='#ffedb0';ctx.shadowColor=glow;ctx.shadowBlur=10;
    ctx.beginPath();ctx.arc(x,y,2.2,0,Math.PI*2);ctx.fill();ctx.restore();});
}

const orbDir   = (Math.random()<0.5?-1:1);
const orbSpeed = 0.6 + Math.random()*0.7;
function drawOrb(t){
  const cx=W/2 + Math.sin(t*0.5+1)*2;
  const cy=H/2 + Math.sin(t*0.8)*3;
  ctx.save();
  const halo=ctx.createRadialGradient(cx,cy,0,cx,cy,22);
  halo.addColorStop(0,'rgba(217,139,166,.28)');
  halo.addColorStop(1,'rgba(217,139,166,0)');
  ctx.fillStyle=halo; ctx.beginPath(); ctx.arc(cx,cy,22,0,6.283); ctx.fill();
  ctx.restore();
  ctx.save();
  ctx.translate(cx,cy); ctx.rotate(t*0.25*orbDir);
  ctx.strokeStyle='#ff7bb0'; ctx.globalAlpha=.75; ctx.lineWidth=1;
  ctx.setLineDash([3,4]);
  ctx.beginPath(); ctx.arc(0,0,11,0,6.283); ctx.stroke();
  ctx.restore();
  ctx.save();
  ctx.shadowColor='#c9708d'; ctx.shadowBlur=10;
  const core=ctx.createRadialGradient(cx-1,cy-1,0,cx,cy,5);
  core.addColorStop(0,'#f3cdd8'); core.addColorStop(1,'#c9708d');
  ctx.fillStyle=core; ctx.beginPath(); ctx.arc(cx,cy,4.5,0,6.283); ctx.fill();
  ctx.restore();
  for(let k=0;k<3;k++){
    const sa=t*orbSpeed*orbDir + k*2.094;
    ctx.save(); ctx.fillStyle='#ffedb0'; ctx.shadowColor='#ffcf6e'; ctx.shadowBlur=6;
    ctx.globalAlpha=.9;
    ctx.beginPath(); ctx.arc(cx+Math.cos(sa)*9, cy+Math.sin(sa)*9, 1.2, 0, 6.283); ctx.fill();
    ctx.restore();
  }
}

const start=performance.now();
function frame(now){
  if(W<10||H<10) resize();
  const t=(now-start)/1000;
  ctx.clearRect(0,0,W,H);
  const bg=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*.55);
  bg.addColorStop(0,'rgba(25,35,70,.20)');bg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  const size=Math.max(34, Math.min(W*.28,H*.19)), gap=H*.10;
  drawTetra(W/2, H/2-size-gap/2, size, t, TOP_DIR, 0,   '#d3e0f2','#8aa8d4', false);
  drawTetra(W/2, H/2+size+gap/2, size, t, BOT_DIR, 2.1,'#7f9fd4','#41609c', true );
  drawOrb(t);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>

<script>

     l:[[0,1],[1,2],[2,3],[3,0],[3,4],[4,5],[5,6]]},
    {s:[[2.3,59.15],[10.1,56.54],[14.2,60.72],[21.5,60.24],[28.6,63.67]], l:[[0,1],[1,2],[2,3],[3,4]]},
    {s:[[310.4,45.28],[305.6,40.26],[311.6,33.97],[296.2,45.13],[292.7,27.96]], l:[[0,1],[1,4],[3,1],[1,2]]},
    {s:[[88.8,7.41],[81.3,6.35],[85.2,-1.94],[84.1,-1.20],[83.0,-0.30],[86.9,-9.67],[78.6,-8.20]], l:[[0,2],[1,4],[2,3],[3,4],[2,5],[4,6]]}
  ];
  function lst(){ var d=Date.now()/86400000+2440587.5-2451545.0;
    return ((280.46061837+360.98564736629*d+LON)%360+360)%360; }
  function project(ra,dec,t){
    if(dec>88) return [CX, CY-(90-LAT)*SC, LAT];
    var Hh=rad(t-ra), la=rad(LAT), de=rad(dec);
    var alt=Math.asin(Math.sin(la)*Math.sin(de)+Math.cos(la)*Math.cos(de)*Math.cos(Hh));
    var az=Math.atan2(Math.sin(Hh), Math.cos(Hh)*Math.sin(la)-Math.tan(de)*Math.cos(la))+Math.PI;
    var r=(90-deg(alt))*SC;
    return [CX+r*Math.sin(az), CY-r*Math.cos(az), deg(alt)];
  }
  function watch(d){ var h=d.getHours(); return (h>=5&&h<8)?'dawn':(h>=8&&h<17)?'noon':(h>=17&&h<21)?'dusk':'night'; }
  function sunPos(){
    var d=new Date(), jan=new Date(d.getFullYear(),0,0);

    var az=rad(deg(Math.atan2(Math.sin(HA),Math.cos(HA)*Math.sin(la)-Math.tan(de)*Math.cos(la)))+180);

  }
  /* ---- coaster + hud ---- */

  var C16=['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];

    tapeC.font='9px monospace'; tapeC.textAlign='center';
    var start=Math.floor((h-64)/5)*5;

    if(s.alt>-8){
      var r=(90-Math.max(0,s.alt))*SC;
      var x=CX+r*Math.sin(s.az), y=CY-r*Math.cos(s.az);
      var up=s.alt>0;
      var a=up?0.10+0.08*Math.min(1,s.alt/30):0.05;
      var col=s.alt>10?'217,168,58':(up?'200,120,50':'90,110,150');
      var gr2=g.createRadialGradient(x,y,0,x,y,Math.max(W,H)*0.45);
      gr2.addColorStop(0,'rgba('+col+','+a.toFixed(3)+')');
      gr2.addColorStop(1,'rgba(0,0,0,0)');
      g.fillStyle=gr2; g.fillRect(0,0,W,H);
      if(up){
        g.fillStyle='rgba(241,208,120,0.75)';
        g.beginPath(); g.arc(x,y,2.2,0,7); g.fill();
        g.strokeStyle='rgba(241,208,120,0.35)';
        g.beginPath(); g.arc(x,y,6,0,7); g.stroke();
      }
    }
    /* compass + hud */
    var on=document.body.classList.contains('coasting');
    if(on&&have){
      var dd=((target-cur+540)%360)-180;
      cur=(cur+dd*0.12+360)%360;
      cv.style.transform='rotate('+(-cur).toFixed(2)+'deg)';
      drawTape(cur);
      hdgEl.textContent=Math.round(cur)%360+'\u00b0 \u00b7 '+C16[Math.round(cur/22.5)%16];
    } else if(on){
      hdgEl.textContent='north is up \u00b7 no sensor on this glass';
    }
    if(on) locEl.textContent=Math.abs(LAT).toFixed(1)+'\u00b0'+(LAT>=0?'N':'S')+' '+Math.abs(LON).toFixed(1)+'\u00b0'+(LON>=0?'E':'W')+' \u00b7 '+(locTag==='home'?'home sky':'true local sky');
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();
</script>

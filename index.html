<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inn.Visible // hive entrance</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:#000;
    color:#d6d6d6;
    font-family:"Courier New", ui-monospace, Consolas, monospace;
    display:flex; flex-direction:column; align-items:center;
  }
  .mark{margin-top:26px; letter-spacing:.4em; font-size:15px; color:#dfe3e8}
  .tag{margin:8px 0 2px; letter-spacing:.3em; font-size:11px; color:#697077}
  #loader{width:100%; flex:1; min-height:280px; display:block}
  .status{
    letter-spacing:.28em; font-size:12px; color:#8b939c;
    height:18px; margin:0 0 16px;
  }
  .login{width:min(560px,88%); padding-bottom:36px; font-size:13px}
  .login .head{color:#aeb6bf; letter-spacing:.2em; margin-bottom:12px}
  .field{
    display:flex; align-items:center; gap:12px;
    border:1px solid #262c37; border-radius:4px;
    padding:9px 12px; margin:10px 0;
    background:rgba(255,255,255,0.015);
    transition:border-color .25s;
  }
  .field:focus-within{border-color:rgba(45,212,191,.5)}
  .field label{color:#8b939c; letter-spacing:.14em; white-space:nowrap}
  .field input{
    flex:1; background:transparent; border:none; outline:none;
    color:#e6e8ea; font:inherit; letter-spacing:.08em;
  }
  .links{margin-top:16px; display:flex; flex-direction:column; gap:8px;
    color:#7d8590; letter-spacing:.1em}
  .links a{color:#6d8cff; text-decoration:none}
  .links a:hover{text-decoration:underline}
</style>
</head>
<body>

<div class="mark">Inn.Visible</div>
<div class="tag">[ hive entrance ]</div>
<canvas id="loader"></canvas>
<div class="status" id="status">[ quiet excavations .. ]</div>

<form class="login" onsubmit="return false">
  <div class="head">[ login ]</div>
  <div class="field"><label>user id:</label><input autocomplete="username" spellcheck="false"></div>
  <div class="field"><label>passcode:</label><input type="password" autocomplete="current-password"></div>
  <div class="links">
    <span>passkey purchases — <a href="#">{...}</a></span>
    <span>employee application bypass // — //</span>
  </div>
</form>

<script>
const canvas=document.getElementById('loader');
const ctx=canvas.getContext('2d');
let W=0,H=0;
function resize(){
  const d=window.devicePixelRatio||1;
  W=canvas.clientWidth; H=canvas.clientHeight;
  canvas.width=W*d; canvas.height=H*d;
  ctx.setTransform(d,0,0,d,0,0);
}
addEventListener('resize',resize); resize();

/* regular tetrahedron, centroid at origin (vertex down by default) */
const r=Math.sqrt(8)/3;
const V=[
  [0,-1,0],
  [ r, 1/3, 0],
  [-r/2, 1/3,  r*0.8660254],
  [-r/2, 1/3, -r*0.8660254]
];
const FACES=[[0,1,2],[0,2,3],[0,3,1],[1,2,3]];
const EDGES=[[0,1],[0,2],[0,3],[1,2],[2,3],[3,1]];
const edgeFaces=EDGES.map(([a,b])=>{
  const idx=[]; FACES.forEach((f,i)=>{ if(f.includes(a)&&f.includes(b)) idx.push(i); }); return idx;
});

const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];

/* site-matched palette: teal = QR logo, blue = the 01-04 circles */
const TEAL={line:'#7fe7da',hidden:'rgba(127,231,218,0.30)',glow:'rgba(45,212,191,0.55)',dot:'#d6fff9'};
const BLUE={line:'#8fa3ff',hidden:'rgba(143,163,255,0.30)',glow:'rgba(99,125,255,0.55)',dot:'#e2e9ff'};

function rotVerts(t,dir,phase,flip){
  const spin=t*0.85*dir;
  const tilt=(flip?0.42:-0.42)+0.06*Math.sin(t*0.6+phase);
  const wob=0.09*Math.sin(t*0.8+phase);
  const cs=Math.cos(spin),sn=Math.sin(spin);
  const cx=Math.cos(tilt),sx=Math.sin(tilt);
  const cw=Math.cos(wob),sw=Math.sin(wob);
  return V.map(v=>{
    let [x,y,z]=v;
    if(flip) y=-y;                      // second tetra: base up, vertex up
    let X=x*cs+z*sn, Y=y, Z=-x*sn+z*cs; // spin on its own vertex axis
    let Y2=Y*cx-Z*sx, Z2=Y*sx+Z*cx;
    let X3=X*cw-Y2*sw, Y3=X*sw+Y2*cw;
    return [X3,Y3,Z2];
  });
}

function drawTetra(cx,cy,size,t,dir,phase,flip,pal){
  const P=rotVerts(t,dir,phase,flip);
  const f=4.2;
  const proj=P.map(([x,y,z])=>{
    const p=f/(f-z);
    return [cx+x*size*p, cy-y*size*p];
  });

  const cam=[0,0,f];
  const vis=FACES.map(face=>{
    const [a,b,c]=face.map(i=>P[i]);
    let n=cross(sub(b,a),sub(c,a));
    const cent=[(a[0]+b[0]+c[0])/3,(a[1]+b[1]+c[1])/3,(a[2]+b[2]+c[2])/3];
    if(dot(n,cent)<0) n=n.map(v=>-v);
    return dot(n,sub(cent,cam))<0;
  });

  EDGES.forEach(([a,b],i)=>{
    const hidden=!vis[edgeFaces[i][0]]&&!vis[edgeFaces[i][1]];
    const [x1,y1]=proj[a],[x2,y2]=proj[b];
    ctx.save();
    if(hidden){
      ctx.setLineDash([4,6]);
      ctx.strokeStyle=pal.hidden;
      ctx.lineWidth=1;
    }else{
      ctx.setLineDash([]);
      ctx.strokeStyle=pal.line;
      ctx.lineWidth=1.4;
      ctx.shadowColor=pal.glow;
      ctx.shadowBlur=9;
    }
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    ctx.restore();
  });

  proj.forEach(([x,y])=>{
    ctx.save();
    ctx.fillStyle=pal.dot; ctx.shadowColor=pal.glow; ctx.shadowBlur=6;
    ctx.beginPath(); ctx.arc(x,y,1.8,0,Math.PI*2); ctx.fill();
    ctx.restore();
  });
}

/* the loader whispers the site's own voice while it spins */
const statusEl=document.getElementById('status');
const MSGS=[
  '[ quiet excavations .. ]',
  '[ foggy nights .. ]',
  '[ unscripted wanderings .. ]',
  '[ through digital ruins .. ]'
];
const start=performance.now();
function frame(now){
  const t=(now-start)/1000;
  ctx.clearRect(0,0,W,H);

  const S=Math.min(W*0.16,H*0.22);
  const gap=S*0.24;                          // "slightly apart"
  const cx=W/2;
  const cyT=H*0.5-gap/2-S;                   // top: vertex down
  const cyB=H*0.5+gap/2+S*0.8;               // bottom: flipped, smaller

  /* faint hive haze behind the pair */
  const hz=ctx.createRadialGradient(cx,H*0.5,0,cx,H*0.5,S*2.6);
  hz.addColorStop(0,'rgba(110,130,255,0.07)');
  hz.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=hz; ctx.fillRect(0,0,W,H);

  /* thin dashed axis thread between the two tips */
  ctx.save();
  ctx.strokeStyle='rgba(255,255,255,0.14)';
  ctx.setLineDash([2,6]); ctx.lineWidth=1;
  ctx.beginPath();
  ctx.moveTo(cx,cyT+S*0.85);
  ctx.lineTo(cx,cyB-S*0.68);
  ctx.stroke();
  ctx.restore();

  drawTetra(cx,cyT,S,      t,-1,0,   false,TEAL);  // counter-clockwise
  drawTetra(cx,cyB,S*0.8,  t, 1,2.1, true, BLUE);  // opposite motion

  statusEl.textContent=MSGS[Math.floor(t/2.8)%MSGS.length];
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inn.Visible | Hive Entrance</title>
<style>
  :root{
    --bg:#0a0d12; --panel:#0e141b; --line:#223041;
    --ink:#e8e4d8; --dim:#93a1b0;
    --red:#c8452c; --blue:#3f7fc1; --gold:#d9a83a; --silver:#d8dde3;
    --mono:ui-monospace,"Cascadia Mono","JetBrains Mono",Consolas,monospace;
    --serif:Georgia,"Times New Roman",serif;
  }
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--mono)}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.10;
    background:linear-gradient(var(--line) 1px,transparent 1px) 0 0/100% 140px,
               linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/180px 100%}
  main{max-width:760px;margin:0 auto;padding:56px 24px 40px;text-align:center}
  .qrbox{display:inline-block;background:#f4f6f8;padding:14px;border-radius:10px;
    box-shadow:0 0 24px rgba(216,232,244,.35)}
  .qrbox img{width:150px;height:150px;display:block;image-rendering:pixelated}
  .house{margin-top:22px;font-size:16px;letter-spacing:.5em}
  .tag{margin-top:10px;color:var(--dim);font-size:11px;letter-spacing:.2em}
  .ruins{margin-top:26px;color:var(--dim);font-size:12px;letter-spacing:.2em}
  .tet{margin:30px auto 6px;display:block}
  .login{margin:34px auto 0;border:1px solid var(--line);background:var(--panel);
    padding:22px;max-width:420px;text-align:left}
  .login .h{color:var(--dim);font-size:12px;letter-spacing:.2em;margin-bottom:14px}
  .login input{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--ink);
    font-family:var(--mono);font-size:12px;padding:10px;margin-bottom:10px}
  .login input:focus{outline:none;border-color:var(--gold)}
  .btn{background:none;border:1px solid var(--gold);color:var(--gold);
    font-family:var(--mono);font-size:12px;letter-spacing:.15em;padding:10px 22px;
    cursor:pointer;margin-top:6px;text-decoration:none;display:inline-block}
  .btn:hover{background:var(--gold);color:#0a0d12}
  .lstat{margin-top:12px;font-size:12px;color:var(--dim);min-height:16px}
  .keys{margin-top:22px;color:var(--dim);font-size:12px;line-height:2}
  .keys a{color:var(--blue);text-decoration:none}
  footer{border-top:1px solid var(--line);padding:24px 16px;text-align:center;
    color:var(--dim);font-size:12px;letter-spacing:.12em;line-height:2.1}
</style>
</head>
<body>

<main>
  <div class="qrbox"><img src="qr-code.png" alt="house qr"></div>
  <div class="house">I N N . V I S I B L E</div>
  <div class="tag">[ hive entrance ]</div>

  <svg class="tet" width="220" height="260" viewBox="0 0 220 260" fill="none" stroke-linejoin="round">
    <polygon points="120,14 168,64 118,128 62,58" stroke="#d8dde3" stroke-width="2"/>
    <line x1="120" y1="14" x2="118" y2="128" stroke="#d8dde3" stroke-width="1" stroke-dasharray="4 5"/>
    <line x1="62" y1="58" x2="168" y2="64" stroke="#d8dde3" stroke-width="1" stroke-dasharray="4 5"/>
    <circle cx="112" cy="138" r="5" fill="#c8452c"/>
    <circle cx="112" cy="138" r="10" stroke="#c8452c" stroke-width="1" opacity=".5"/>
    <polygon points="118,146 172,196 122,252 60,200" stroke="#3f7fc1" stroke-width="2"/>
    <line x1="118" y1="146" x2="122" y2="252" stroke="#3f7fc1" stroke-width="1" stroke-dasharray="4 5"/>
    <line x1="60" y1="200" x2="172" y2="196" stroke="#3f7fc1" stroke-width="1" stroke-dasharray="4 5"/>
  </svg>

  <div class="ruins">[ through digital ruins .. ]</div>

  <div class="login">
    <div class="h">[ login ]</div>
    <input id="uid" placeholder="user id:" autocomplete="username">
    <input id="pass" type="password" placeholder="passcode:" autocomplete="current-password"
      onkeydown="if(event.key==='Enter')unlock()">
    <button class="btn" onclick="unlock()">[ unlock ]</button>
    <div class="lstat" id="lstat"></div>
  </div>

  <div class="keys">
    passkey purchases — <a href="donations.html">{...}</a><br>
    employee application bypass // — //
  </div>
</main>

<footer>
  An Inn.Visible Initiative · “Know Thyself; Do No Harm; Hold The Truth.”
</footer>

<script>
const KEY='hive_access', SES='hive_session', SPAN=30*60*1000;
function alive(){
  const a = localStorage.getItem(KEY);
  return sessionStorage.getItem(SES)==='1' && a && +a > Date.now();
}
function refresh(){
  localStorage.setItem(KEY, String(Date.now()+SPAN));
  sessionStorage.setItem(SES,'1');
}
const wantsGate = location.search.indexOf('gate') !== -1;
if(!wantsGate && alive()){ location.replace('core.html'); }
if(wantsGate && alive()){
  const d = document.createElement('div');
  d.className = 'keys';
  d.innerHTML = '<a class="btn" href="core.html">the door is open — enter the house ↗</a>';
  document.querySelector('main').appendChild(d);
}
function unlock(){
  const u = document.getElementById('uid').value.trim();
  const p = document.getElementById('pass').value.trim();
  if(u === 'HIVE-0000-0000' && p === 'HIVE-0000-0000'){
    refresh();
    location.href = 'core.html';
  }else{
    document.getElementById('lstat').textContent = 'the lock does not turn';
  }
}
</script>

</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DEED — the till split simulator</title>
<style>
  body{background:#0a0d12;color:#e8e4d8;font-family:ui-monospace,Consolas,monospace;margin:0}
  header{padding:16px 22px;border-bottom:1px solid #223041;color:#d9a83a;letter-spacing:.3em;font-size:13px}
  main{max-width:860px;margin:0 auto;padding:34px 16px 60px;text-align:center}
  .hook{font-family:Georgia,serif;font-style:italic;font-size:22px}
  .tillrow{margin-top:18px;font-size:12px;color:#93a1b0;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;align-items:center}
  input{background:#0a0d12;border:1px solid #223041;color:#e8e4d8;font-family:inherit;font-size:12px;padding:8px;width:90px}
  button{background:none;border:1px solid #d9a83a;color:#d9a83a;font-family:inherit;font-size:11px;letter-spacing:.1em;padding:8px 14px;cursor:pointer}
  button:hover{background:#d9a83a;color:#0a0d12}
  #bar{display:flex;gap:2px;height:30px;margin:26px 0 8px;border:1px solid #223041}
  #bar div{transition:flex-grow .4s}
  .row{display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap;padding:9px 12px;border-bottom:1px solid #223041;font-size:12px;text-align:left}
  .nm{flex:1;min-width:160px}
  .dw{color:#d9a83a;width:130px}
  .sh{color:#e8e4d8;width:80px}
  .gw{color:#5c6875;font-size:11px;flex-basis:100%}
  .weld{margin-top:22px;color:#5c6875;font-size:11px;letter-spacing:.12em}
</style>
</head>
<body>
<header>DEED · PETRI DISH · PT2</header>
<main>
  <p class="hook">the till splits by deed, not by luck.</p>
  <div class="tillrow">
    season till: $<input id="till" value="100.00">
    <button onclick="spawn(false)">spawn witness</button>
    <button onclick="spawn(true)">spawn patron</button>
    <button onclick="reset()">reset</button>
    · souls: <span id="count">1</span>
  </div>
  <div id="bar"></div>
  <div id="ledger"></div>
  <p class="weld">chance earns glory · tenure earns value · money flows in from the real economy, out through witnessed hands</p>
</main>
<script>
const $=id=>document.getElementById(id);
const COLORS=['#d9a83a','#3f7fc1','#c8452c','#58a36a','#b07fd9','#d97fa8','#7fd9c8','#d9d07f'];
const POOL=['wick','soot','moth','ember','dross','kindling','ash','spark','cinder','lantern','bellows','flue','tinder','hearthstone'];
let patrons=[{name:'Quilliinn Primrose',patron:true,coins:275,drops:453,days:2,bouts:24}];
function deedW(p){return (p.patron?5000:0)+p.coins*5+p.days;}
function gloryW(p){return (p.patron?5000:0)+p.drops*5+p.days+p.bouts*2;}
function spawn(isPatron){
  const base=POOL[Math.floor(Math.random()*POOL.length)];
  const name=base+(Math.random()<0.4?' '+(10+Math.floor(Math.random()*90)):'');
  const coins=Math.floor(Math.random()*(isPatron?300:120));
  patrons.push({name,patron:isPatron,coins,
    drops:coins+Math.floor(Math.random()*600),
    days:1+Math.floor(Math.random()*400),
    bouts:Math.floor(Math.random()*60)});
  render();
}
function reset(){patrons=[{name:'Quilliinn Primrose',patron:true,coins:275,drops:453,days:2,bouts:24}];render();}
function render(){
  const till=parseFloat($('till').value)||0;
  const total=patrons.reduce((s,p)=>s+deedW(p),0)||1;
  const bar=$('bar'); bar.innerHTML='';
  patrons.forEach((p,i)=>{
    const s=document.createElement('div');
    s.style.flexGrow=deedW(p);
    s.style.background=COLORS[i%COLORS.length];
    s.title=p.name;
    bar.appendChild(s);
  });
  const rows=patrons.map((p,i)=>({p,i})).sort((a,b)=>deedW(b.p)-deedW(a.p));
  $('ledger').innerHTML=rows.map(function(r){
    const p=r.p,w=deedW(p),share=till*w/total;
    return '<div class="row"><span class="nm" style="color:'+COLORS[r.i%COLORS.length]+'">'+(p.patron?'\u25c6 ':'\u00b7 ')+p.name+'</span>'+
      '<span class="dw">deed '+w.toLocaleString()+'</span>'+
      '<span class="sh">$'+share.toFixed(2)+'</span>'+
      '<span class="gw">glory '+gloryW(p).toLocaleString()+' \u00b7 light only</span></div>';
  }).join('');
  $('count').textContent=patrons.length;
}
$('till').addEventListener('input',render);
render();
</script>

import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
let app; try{ app = initializeApp({

  authDomain: "innvisible-hearth.firebaseapp.com",
  databaseURL: "https://innvisible-hearth-default-rtdb.firebaseio.com",

      var v=snap.val();

<script type="module">
import { initializeApp, getApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
let app; try{ app=initializeApp({
  apiKey:"AIzaSyBVmjQfXdlDBhLdSXsvkIhe2lGAH6JUFa0", authDomain:"innvisible-hearth.firebaseapp.com",
  databaseURL:"https://innvisible-hearth-default-rtdb.firebaseio.com", projectId:"innvisible-hearth",
  storageBucket:"innvisible-hearth.firebasestorage.app", messagingSenderId:"852474450672",
  appId:"1:852474450672:web:85a8bfa6a75d04ea492835"
}); }catch(e){ app=getApp(); }
const db=getDatabase(app);
const BASE={order:10,saving:12,curiosity:14,independence:12,idealism:16,vengeance:8,tranquility:8,power:18,honour:12,family:14,romance:12,eating:6,'physical exercise':8,'social contact':8,status:10,acceptance:8};
const POOL=[
 ['carry the cove to someone who needs quiet','idealism','performance'],
 ['witness the sky and name the weather in one line','curiosity','insight'],
 ['transcribe one page of the codex into plain words','order','catalog'],
 ['teach one person to read a contract address','idealism','info design'],
 ['keep the radio company for one watch','social contact','performance'],
 ['balance one line of the works ledger','saving','catalog'],
 ['write a field note for the reading nook','curiosity','making sense'],
 ['hold the witness for a new member','honour','social computation']
];
(async function(){
  try{
    const snap=await get(ref(db,'rota'));
    var all={}, open=[];
    if(snap.exists()){ all=snap.val(); for(var id in all){ all[id].id=id; if(all[id].status==='open') open.push(all[id]); } }
    var week=Date.now()-7*864e5;
    for(var i=0;i<open.length;i++){ var d=open[i];
      if(d.poster==='the house'&&(d.when||0)<week){ d.status='expired'; await set(ref(db,'rota/'+d.id),d); } }
    open=open.filter(function(d){return d.status==='open';});
    var pop=0;
    try{ const sw=await get(ref(db,'witness')); if(sw.exists()){ var wv=sw.val(), seen={};
      for(var k in wv){ for(var dd in wv[k]){ if((wv[k][dd].t||0)>=week) seen[k]=1; } } pop=Object.keys(seen).length; } }catch(e){}
    var target=Math.min(40,2+pop);
    var houseOpen=open.filter(function(d){return d.poster==='the house';}).length;
    var openAsks=open.map(function(d){return d.ask;});
    if(houseOpen>=target) return;
    for(var p=0;p<POOL.length&&houseOpen<target;p++){
      var it=POOL[p]; if(openAsks.indexOf(it[0])>-1) continue;
      await set(ref(db,'rota/'+String(Date.now())+p),{ask:it[0],need:it[1],mode:it[2],guard:'the house asks',watches:1,value:BASE[it[1]]||10,poster:'the house',status:'open',when:Date.now()});
      houseOpen++;
    }
  }catch(e){}
})();
</script>

 ['action','object','to someone who needs','quality','idealism','performance'],

 ['transcribe','one page of the codex into plain words','order','catalog'],

];
function fill(template){
  var ask='';
  for(var i=0;i<template.length;i++){
    var slot=template[i];
    if(POOLS[slot]){ var pool=POOLS[slot]; ask+=pool[Math.floor(Math.random()*pool.length)]; }
    else ask+=slot;
    if(i<template.length-1) ask+=' ';
  }
  return ask;
}

      var ask=fill(t);
      if(openAsks.indexOf(ask)>-1) continue;
      var need=t[t.length-2], mode=t[t.length-1];
      await set(ref(db,'rota/'+String(Date.now())+attempts),{ask:ask,need:need,mode:mode,guard:'the house asks',watches:1,value:BASE[need]||10,poster:'the house',status:'open',when:Date.now()});
      openAsks.push(ask);
      houseOpen++;
    }
  }catch(e){}
})();
</script>

  var banbox=document.createElement('div'); banbox.style.cssText='margin-top:14px;border-top:1px solid #223041;padding-top:10px'; sec.appendChild(banbox);
  var w=document.querySelector('.weld');
  if(w&&w.parentNode) w.parentNode.insertBefore(sec,w.nextSibling); else document.body.appendChild(sec);
  function mk(parent,label,fn){ var b=document.createElement('button'); b.textContent=label;
    b.style.cssText='background:none;border:1px solid #223041;color:#93a1b0;font-family:inherit;font-size:10px;padding:3px 8px;cursor:pointer';
    b.onclick=fn; parent.appendChild(b); }
  function safe(s){ return String(s||'').replace(/[^a-zA-Z0-9_-]/g,'_').slice(0,40)||null; }
  async function render(){
    list.innerHTML=''; banbox.innerHTML='';
    try{
      const sf=await get(ref(db,'flags'));
      if(sf.exists()){ var fv=sf.val();

          var r=document.createElement('div'); r.style.cssText='display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 2px;border-bottom:1px solid #223041;font-size:11px;color:#93a1b0';

          mk(r,'dismiss',async function(){ await set(ref(db,'flags/'+id),null); render(); });
          mk(r,'restore',async function(){ await set(ref(db,'rota/'+id+'/status'),'open'); await set(ref(db,'flags/'+id),null); render(); });

}

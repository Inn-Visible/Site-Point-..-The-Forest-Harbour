<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inn.Visible — the house book</title>
<style>
  :root{--bg:#0a0d12;--panel:#0e141b;--line:#223041;--ink:#e8e4d8;--dim:#93a1b0;--gold:#d9a83a;
    --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;--serif:Georgia,serif}
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--mono);padding:40px 16px}
  main{max-width:640px;margin:0 auto;text-align:center}
  h1{font-family:var(--serif);font-style:italic;font-size:22px}
  .sub{color:var(--dim);font-size:11px;letter-spacing:.2em;margin-top:8px}
  .tot{margin-top:18px;font-size:12px;color:var(--dim)}
  .tot b{color:var(--gold)}
  table{width:100%;border-collapse:collapse;margin-top:22px;font-size:12px}
  th{color:#5c6875;font-weight:normal;font-size:10px;letter-spacing:.2em;padding:8px 6px;border-bottom:1px solid var(--line)}
  td{padding:9px 6px;border-bottom:1px solid var(--line);color:var(--dim)}
  td.n{color:var(--ink)}
  td.s{color:var(--gold)}
  .stamp{margin-top:14px;font-size:10px;color:#5c6875}
  a{color:var(--dim);text-decoration:none;font-size:11px;letter-spacing:.15em}
  a:hover{color:var(--ink)}
</style>
</head>
<body>
<main>
  <h1>the house book.</h1>
  <div class="sub">· PATRONS OF THE HEARTH · EVERY ROW A BURNED KEY ·</div>
  <div class="tot" id="tot">the book is opening ..</div>
  <table><thead><tr><th></th><th>the hand that feeds</th><th>coins tossed</th><th>first light</th></tr></thead>
  <tbody id="rows"></tbody></table>
  <div class="stamp" id="stamp"></div>
  <div style="margin-top:26px"><a href="donations.html">↩ the hearth</a></div>
</main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
const app = initializeApp({
  apiKey: "AIzaSyBVmjQfXdlDBhLdSXsvkIhe2lGAH6JUFa0",
  authDomain: "innvisible-hearth.firebaseapp.com",
  databaseURL: "https://innvisible-hearth-default-rtdb.firebaseio.com",
  projectId: "innvisible-hearth",
  storageBucket: "innvisible-hearth.firebasestorage.app",
  messagingSenderId: "852474450672",
  appId: "1:852474450672:web:85a8bfa6a75d04ea492835"
});
const db = getDatabase(app);
function render(rows, live){
  const tb=document.getElementById('rows');
  tb.innerHTML='';
  rows.sort(function(a,b){return (b.seed||0)-(a.seed||0);});
  rows.forEach(function(r,i){
    const tr=document.createElement('tr');
    const d=new Date(r.when||0);
    tr.innerHTML='<td>'+(i+1)+'</td><td class="n">\u25c6 '+r.name+'</td><td class="s">'+(r.seed||0)+'</td><td>'+d.toLocaleDateString()+'</td>';
    tb.appendChild(tr);
  });
  const totSeed=rows.reduce(function(s,r){return s+(r.seed||0);},0);
  document.getElementById('tot').innerHTML='<b>'+rows.length+'</b> patron'+(rows.length===1?'':'s')+' · <b>'+totSeed+'</b> coins tossed · the fire keeps the count';
  document.getElementById('stamp').textContent = live
    ? 'witnessed live · '+new Date().toLocaleTimeString()
    : 'cached · last witnessed '+new Date(parseInt(localStorage.getItem('hive_board_when')||'0',10)).toLocaleString();
}
try{
  const snap = await get(ref(db,'keys'));
  const val = snap.val()||{};
  const rows=[];
  Object.keys(val).forEach(function(k){
    const r=val[k];
    if(r && typeof r==='object' && r.used && r.name) rows.push({name:r.name,when:r.when,seed:r.seed||0});
  });
  localStorage.setItem('hive_board_cache',JSON.stringify(rows));
  localStorage.setItem('hive_board_when',String(Date.now()));
  render(rows,true);
}catch(e){
  try{ render(JSON.parse(localStorage.getItem('hive_board_cache')||'[]'),false); }catch(e2){
    document.getElementById('tot').textContent='the book is closed (offline) — no cached witness yet.';
  }
}
</script>

<script type="module">
/* the roster rides the same rail as the keys */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
const app = initializeApp({
  apiKey: "AIzaSyBVmjQfXdlDBhLdSXsvkIhe2lGAH6JUFa0",
  authDomain: "innvisible-hearth.firebaseapp.com",
  databaseURL: "https://innvisible-hearth-default-rtdb.firebaseio.com",
  projectId: "innvisible-hearth",
  storageBucket: "innvisible-hearth.firebasestorage.app",
  messagingSenderId: "852474450672",
  appId: "1:852474450672:web:85a8bfa6a75d04ea492835"
});
const db = getDatabase(app);

var PEP='ex-umbra-lumen';
function xorr(s){ var o=''; for(var i=0;i<s.length;i++) o+=String.fromCharCode(s.charCodeAt(i)^PEP.charCodeAt(i%PEP.length)); return o; }
function kid(w){ return btoa(xorr(w)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
      for(var lk in local){ if(lk!=='__founder' && !/^[a-z]{6,14}\d{1,2}$/.test(lk)) delete local[lk]; }
  function wordOf(k){ try{ var s=k.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4) s+='='; var w=xorr(atob(s)); return /^[a-z]{6,14}\d{1,2}$/.test(w)?w:null; }catch(e){ return null; } }
  window.hiveCloudSync = async function(roster){
  try{
    for(var name in roster){
      await set(ref(db, 'roster/'+((name==='__founder')?name:kid(name))), roster[name]);
    }
  }catch(e){ /* offline or no signal — local holds */ }
};
async function burnPlain(){
  try{
    const s2=await get(ref(db,'roster')); if(!s2.exists()) return; const v2=s2.val();
    for(var k in v2){ if(k!=='__founder' && /^[a-z]{6,14}\d{1,2}$/.test(k)) await set(ref(db,'roster/'+k), null); }
  }catch(e){}
}
(async function(){
  try{
    const snap = await get(ref(db, 'roster'));
    if(snap.exists()){
      const cloud = snap.val();
      const local = JSON.parse(localStorage.getItem('hive_roster'))||{};
      for(var k in cloud){
        var w=(k==='__founder')?'__founder':wordOf(k); if(!w) continue;
        if(!local[w] || (cloud[k].last||0) > (local[w].last||0)) local[w] = cloud[k];
      }
      localStorage.setItem('hive_roster', JSON.stringify(local));
      window.dispatchEvent(new CustomEvent('hive-roster-synced'));
    }
    await burnPlain();
    window.hiveCloudSync(JSON.parse(localStorage.getItem('hive_roster'))||{});
  }catch(e){ /* offline — local holds */ }
})();
</script>

  <script>
(function(){
  if(localStorage.getItem('hive_user')!=='1') return;
  var TIERS={1:'spark',2:'ember',3:'flame'};
  var PILLARS=['axiom','eigen','baseline','keystone'];
  var sec=document.createElement('section');
  sec.style.cssText='max-width:860px;margin:30px auto;padding:20px 16px;border:1px solid #223041;background:#0e141b;font-family:ui-monospace,Consolas,monospace;text-align:left';
  sec.innerHTML='<div style="text-align:center;font-family:Georgia,serif;font-style:italic;color:#93a1b0;font-size:13px;margin-bottom:14px">the overseer\u2019s desk \u00b7 who stands where, who was seen when</div>';
    var wrap=document.createElement('div'); sec.appendChild(wrap);
  var search=document.createElement('input');
  search.placeholder='search the keyring \u00b7 word, name, or pillar';
  search.style.cssText='display:block;width:100%;margin:0 0 10px;background:rgba(3,4,7,.6);border:1px solid #223041;color:#e8e4d8;font-family:ui-monospace,Consolas,monospace;font-size:11px;padding:8px 10px;letter-spacing:.08em';
  search.oninput=function(){ q=search.value.toLowerCase(); render(); };
  sec.insertBefore(search,wrap);
  wrap.addEventListener('click',function(e){
    var t=e.target, nn=t&&t.getAttribute&&t.getAttribute('data-n');
    if(nn){ revealed[nn]=!revealed[nn]; render(); }
  });
  var q='', revealed={};
  var foot=document.createElement('div'); foot.style.cssText='margin-top:12px;text-align:center;font-size:10px;letter-spacing:.15em;color:#5c6875';
  foot.textContent='roster rides the cloud rail \u00b7 the house takes you at your word';
  sec.appendChild(foot);
  var f=document.querySelector('footer')||document.body;
  f.parentNode.insertBefore(sec,f);

  function roster(){ try{ return JSON.parse(localStorage.getItem('hive_roster'))||{}; }catch(e){ return {}; } }
  function save(r){ localStorage.setItem('hive_roster',JSON.stringify(r)); if(window.hiveCloudSync) window.hiveCloudSync(r); }
  function ago(t){ var d=Date.now()-t; if(d<36e5) return Math.max(1,Math.round(d/6e4))+'m ago'; if(d<864e5) return Math.round(d/36e5)+'h ago'; return Math.round(d/864e5)+'d ago'; }
  function inMonth(t){ return (Date.now()-t)<30*864e5; }

  function render(){
    var r=roster(); wrap.innerHTML='';
    var fr=document.createElement('div');
    fr.style.cssText='display:flex;gap:8px;align-items:center;padding:8px 6px;border-bottom:1px solid #d9a83a;color:#d9a83a;font-size:11px;letter-spacing:.12em;flex-wrap:wrap';
    var acc=localStorage.getItem('hive_access');
        fr.innerHTML='<span style="flex:1;min-width:120px">\u25c6 '+(((r['__founder']||{}).alias)||'quilliinn primrose').replace(/[<>&"]/g,'')+' \u00b7 rag\u00b7\u00b7\u00b7d</span><span style="min-width:70px">all</span><span style="min-width:56px">keeper</span><span style="color:#5c6875">'+(acc?('door open \u00b7 '+Math.max(0,Math.ceil((+acc-Date.now())/864e5))+'d left'):'door shut')+'</span>';
        var fhay=('quilliinn primrose '+(((r['__founder']||{}).alias)||'')+' keeper founder all').toLowerCase();
    if(!q||fhay.indexOf(q)>-1) wrap.appendChild(fr);
               var names=Object.keys(r).filter(function(n){ return n!=='__founder'; }).filter(function(n){
      if(!q) return true; var it=r[n];
      return (n+' '+(it.alias||'')+' '+(it.pillar||'')).toLowerCase().indexOf(q)>-1;
    }).sort(function(a,b){
      var pa=PILLARS.indexOf(r[a].pillar), pb=PILLARS.indexOf(r[b].pillar);
      if(pa!==pb) return pa-pb;
      if((r[b].tier||1)!==(r[a].tier||1)) return (r[b].tier||1)-(r[a].tier||1);
      return a<b?-1:1;
    });
    if(!names.length){
      var e=document.createElement('div'); e.style.cssText='padding:10px 6px;color:#5c6875;font-style:italic;font-size:11px';
      e.textContent='no sparks yet \u00b7 the ferryman\u2019s words are standing by';
      wrap.appendChild(e);
    }
    names.forEach(function(n){
      var it=r[n];
      var row=document.createElement('div');
      row.style.cssText='display:flex;gap:8px;align-items:center;padding:8px 6px;border-bottom:1px solid #223041;color:#93a1b0;font-size:11px;letter-spacing:.08em;flex-wrap:wrap';
      var shown=revealed[n]?String(n):(String(n).slice(0,3)+'\u00b7\u00b7\u00b7'+String(n).slice(-1));       row.innerHTML='<span data-n="'+String(n).replace(/"/g,'')+'" title="tap to '+(revealed[n]?'mask':'reveal')+'" style="flex:1;min-width:120px;color:#e8e4d8;cursor:pointer">'+shown.replace(/[<>&"]/g,'')+'</span>'
        +'<span style="min-width:70px">'+(it.pillar||'\u2014')+'</span>'
        +'<span style="min-width:56px;color:'+(it.tier===3?'#d9a83a':it.tier===2?'#c8452c':'#58a36a')+'">'+(TIERS[it.tier||1]||'spark')+'</span>'
                +'<span style="min-width:90px;color:#5c6875">'+(inMonth(it.last)?('seen '+ago(it.last)):'outside the month')+'</span><span style="min-width:60px;color:#5c6875">'+(it.coins||0)+' coins</span>';
            var now=Date.now();
      var sub=document.createElement('span');
      sub.style.cssText='min-width:80px;font-size:10px;color:'+(it.exempt?'#d9a83a':(it.subUntil||0)>now?'#58a36a':'#c8452c');
      sub.textContent=it.exempt?'exempt':(it.subUntil||0)>now?(it.sub+' \u00b7 '+Math.ceil((it.subUntil-now)/864e5)+'d'):'lapsed';
      row.appendChild(sub);
      [['ember',30],['keeper',365]].forEach(function(sb){
        var b=document.createElement('button'); b.textContent='+'+sb[0];
        b.style.cssText='background:none;border:1px solid #223041;color:#93a1b0;font-family:inherit;font-size:10px;padding:3px 6px;cursor:pointer';
        b.onclick=function(){ it.sub=sb[0]; it.subUntil=now+sb[1]*864e5; r[n]=it; save(r); render(); };
        row.appendChild(b);
      });
      var ex=document.createElement('button'); ex.textContent=it.exempt?'unexempt':'exempt';
      ex.style.cssText='background:none;border:1px solid #223041;color:#93a1b0;font-family:inherit;font-size:10px;padding:3px 6px;cursor:pointer';
      ex.onclick=function(){ it.exempt=!it.exempt; r[n]=it; save(r); render(); };
      row.appendChild(ex);
      var t=it.tier||1;
      if(t<3){
        var up=document.createElement('button');
        up.textContent='raise to '+TIERS[t+1];
        up.style.cssText='background:none;border:1px solid #223041;color:#93a1b0;font-family:inherit;font-size:10px;letter-spacing:.08em;padding:3px 8px;cursor:pointer';
        up.onclick=function(){ it.tier=t+1; r[n]=it; save(r); render(); };
        row.appendChild(up);
      } else {
        var fl=document.createElement('span'); fl.textContent='holds the pillar'; fl.style.cssText='color:#d9a83a;font-size:10px;letter-spacing:.1em';
        row.appendChild(fl);
      }
      wrap.appendChild(row);
    });
  }
  render();
  window.addEventListener('hive-roster-synced', render);
})();
</script>

<script>
(function(){
  if(!(localStorage.getItem('hive_user')||localStorage.getItem('hive_member')||localStorage.getItem('hive_patron'))) return;
  function esc(s){ return String(s).replace(/[<>&"]/g,''); }
  var TIERS={1:'spark',2:'ember',3:'flame'};
  var sec=document.createElement('section');
  sec.style.cssText='max-width:860px;margin:26px auto;padding:18px 16px;border:1px solid #223041;background:#0e141b;font-family:ui-monospace,Consolas,monospace;text-align:left';
  sec.innerHTML='<div style="text-align:center;font-family:Georgia,serif;font-style:italic;color:#93a1b0;font-size:13px;margin-bottom:12px">the muster \u00b7 who stands under which pillar</div>';
  var wrap=document.createElement('div'); sec.appendChild(wrap);
  var f=document.querySelector('footer')||document.body; f.parentNode.insertBefore(sec,f);
  function render(){
    var r={}; try{ r=JSON.parse(localStorage.getItem('hive_roster'))||{}; }catch(e){}
    wrap.innerHTML='';
    var names=Object.keys(r);
    if(!names.length){ wrap.innerHTML='<div style="padding:8px 6px;color:#5c6875;font-style:italic;font-size:11px">no sparks yet \u00b7 the ferryman\u2019s words are standing by</div>'; return; }
    names.sort().forEach(function(n){
      var it=r[n];
      var row=document.createElement('div');
      row.style.cssText='display:flex;gap:8px;padding:7px 6px;border-bottom:1px solid #223041;color:#93a1b0;font-size:11px;letter-spacing:.08em;flex-wrap:wrap';
            var disp=(n==='__founder')?(it.alias||'the founder'):(String(n).slice(0,3)+'\u00b7\u00b7\u00b7'+String(n).slice(-1));
      row.innerHTML='<span style="flex:1;min-width:120px;color:'+(n==='__founder'?'#d9a83a':'#e8e4d8')+'">'+esc(disp)+'</span><span style="min-width:70px">'+esc(it.pillar||'\u2014')+'</span><span style="color:'+(it.tier===0?'#d9a83a':it.tier===3?'#d9a83a':it.tier===2?'#c8452c':'#58a36a')+'">'+(it.tier===0?'keeper':(TIERS[it.tier||1]||'spark'))+'</span><span style="min-width:60px;color:#5c6875">'+(it.coins||0)+' coins</span>';
      wrap.appendChild(row);
    });
  }
  render();
  window.addEventListener('hive-roster-synced',render);
})();
</script>
  
</body>
</html>

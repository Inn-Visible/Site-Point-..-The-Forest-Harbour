<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a0d12">
<title>the wheel | Inn.Visible</title>
<style>
  :root{--bg:#0a0d12;--line:#223041;--ink:#e8e4d8;--dim:#93a1b0;--blue:#3f7fc1;--gold:#d9a83a;--green:#58a36a;--mono:ui-monospace,Consolas,monospace}
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--mono);display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
  header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);flex-shrink:0}
  header .t{font-size:11px;letter-spacing:.3em;color:var(--gold)}
  header .sub{font-size:9px;color:#5c6875;letter-spacing:.15em;font-style:italic}
  header a{color:var(--dim);font-size:10px;letter-spacing:.15em;text-decoration:none;margin-left:8px}
  .bar{display:flex;gap:6px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);background:rgba(3,4,7,.6);flex-shrink:0;flex-wrap:wrap}
  button{background:none;border:1px solid var(--line);color:var(--dim);font:10px var(--mono);letter-spacing:.12em;padding:6px 10px;cursor:pointer}
  button:hover{border-color:var(--gold);color:var(--gold)}
  button.on{border-color:var(--gold);color:var(--gold)}
  #wrap{position:relative;flex:1 1 0;min-height:0;display:flex;gap:0;overflow:hidden}
  #stage{flex:1;position:relative;min-width:0}
  canvas,svg#wheelSvg{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
  #side{width:min(320px,42%);border-left:1px solid var(--line);padding:12px;overflow-y:auto;font-size:10px;line-height:2;letter-spacing:.08em;color:var(--dim);flex-shrink:0}
  #side h3{color:var(--blue);font-size:10px;letter-spacing:.2em;margin:8px 0 2px;font-weight:normal}
  #side .big{color:var(--ink);font-size:13px;letter-spacing:.1em}
  #side .g{color:var(--green)} #side .o{color:#e07856} #side .p{color:#b48ce0} #side .q{color:#ff7bb0}
  #status{flex-shrink:0;padding:6px 12px;border-top:1px solid var(--line);font-size:9px;letter-spacing:.12em;color:#5c6875}
  .sp{flex:1}
  @media(max-width:700px){ #wrap{flex-direction:column} #side{width:100%;max-height:38%;border-left:none;border-top:1px solid var(--line)} }
</style>
</head>
<body>
<header><span class="t">THE WHEEL</span><span class="sub">unit circle & math areas · the two tools that deserved a room</span>
  <span><a href="grid3d.html">the grid ↗</a><a href="axiom.html">axiom ↩</a></span></header>
<div class="bar">
  <button id="tabCircle" class="on">unit circle</button>
  <button id="tabWheel">math areas</button>
  <button id="snapBtn" class="on">snap 15°</button>
  <span class="sp"></span>
  <span style="font-size:9px;color:#5c6875;letter-spacing:.15em">ASTC = All Students Take Calculus</span>
</div>
<div id="wrap">
  <div id="stage"><canvas id="cc"></canvas><svg id="wheelSvg" viewBox="0 0 600 600" style="display:none"></svg></div>
  <div id="side"></div>
</div>
<div id="status">drag the gold point around her · the signs and the exact values follow · the wheel tab unfolds the math areas</div>
<script>
(function(){
var cc=document.getElementById('cc'), g=cc.getContext('2d');
var side=document.getElementById('side'), svg=document.getElementById('wheelSvg');
var stage=document.getElementById('stage');
var tabC=document.getElementById('tabCircle'), tabW=document.getElementById('tabWheel'), snapBtn=document.getElementById('snapBtn');
var tab='circle', snap=true, th=Math.PI/4, W=1, H=1;
var SP={0:['0','1','0'],30:['\u03c0/6','\u221a3/2','1/2'],45:['\u03c0/4','\u221a2/2','\u221a2/2'],60:['\u03c0/3','1/2','\u221a3/2'],90:['\u03c0/2','0','1'],
 120:['2\u03c0/3','-1/2','\u221a3/2'],135:['3\u03c0/4','-\u221a2/2','\u221a2/2'],150:['5\u03c0/6','-\u221a3/2','1/2'],180:['\u03c0','-1','0'],
 210:['7\u03c0/6','-\u221a3/2','-1/2'],225:['5\u03c0/4','-\u221a2/2','-\u221a2/2'],240:['4\u03c0/3','-1/2','-\u221a3/2'],270:['3\u03c0/2','0','-1'],
 300:['5\u03c0/3','1/2','-\u221a3/2'],315:['7\u03c0/4','\u221a2/2','-\u221a2/2'],330:['11\u03c0/6','\u221a3/2','-1/2']};
var QUAD=[['I','All','every function is positive here','#e07856'],['II','Students','sin & csc positive; the rest wear minus','#7fb2e5'],
          ['III','Take','tan & cot positive; the rest wear minus','#78dcc8'],['IV','Calculus','cos & sec positive; the rest wear minus','#b48ce0']];
function qOf(deg){ return QUAD[Math.floor(((deg%360)+360)%360/90)]; }
function fit(){ var d=devicePixelRatio||1; W=stage.clientWidth||1; H=stage.clientHeight||1;
  cc.width=Math.round(W*d); cc.height=Math.round(H*d); g.setTransform(d,0,0,d,0,0); drawCircle(); }
addEventListener('resize',fit);
function drawCircle(){
  if(tab!=='circle') return;
  g.clearRect(0,0,W,H);
  var cx=W/2, cy=H/2, r=Math.min(W,H)*0.36;
  var cols=['rgba(224,120,86,.07)','rgba(127,178,229,.07)','rgba(120,220,200,.07)','rgba(180,140,224,.07)'];
  for(var q=0;q<4;q++){ g.fillStyle=cols[q]; g.beginPath(); g.moveTo(cx,cy);
    g.arc(cx,cy,r,-(q+1)*Math.PI/2,-q*Math.PI/2); g.closePath(); g.fill(); }
  g.strokeStyle='rgba(34,48,65,1)'; g.lineWidth=1;
  g.beginPath(); g.moveTo(cx-r*1.35,cy); g.lineTo(cx+r*1.35,cy); g.stroke();
  g.beginPath(); g.moveTo(cx,cy-r*1.35); g.lineTo(cx,cy+r*1.35); g.stroke();
  g.strokeStyle='rgba(232,228,216,.85)'; g.lineWidth=2;
  g.beginPath(); g.arc(cx,cy,r,0,Math.PI*2); g.stroke();
  g.lineWidth=1;
  for(var d=0;d<360;d+=30){ var a=d*Math.PI/180;
    g.strokeStyle='rgba(92,104,117,.5)';
    g.beginPath(); g.moveTo(cx,cy); g.lineTo(cx+r*Math.cos(a),cy-r*Math.sin(a)); g.stroke();
    g.fillStyle='#58a36a'; g.beginPath(); g.arc(cx+r*Math.cos(a),cy-r*Math.sin(a),3.4,0,7); g.fill(); }
  var px=cx+r*Math.cos(th), py=cy-r*Math.sin(th);
  g.strokeStyle='#b48ce0'; g.beginPath(); g.moveTo(cx,cy); g.lineTo(px,cy); g.stroke();
  g.strokeStyle='#e07856'; g.beginPath(); g.moveTo(px,cy); g.lineTo(px,py); g.stroke();
  g.strokeStyle='rgba(232,228,216,.6)'; g.beginPath(); g.moveTo(cx,cy); g.lineTo(px,py); g.stroke();
  g.fillStyle='#d9a83a'; g.beginPath(); g.arc(px,py,7,0,7); g.fill();
  g.fillStyle='#5c6875'; g.font='9px ui-monospace,Consolas,monospace';
  g.fillText('0', cx+r+6, cy+12); g.fillText('\u03c0/2', cx+4, cy-r-6);
  g.fillText('\u03c0', cx-r-16, cy+12); g.fillText('3\u03c0/2', cx+4, cy+r+14);
  paintSide();
}
function degOf(t){ return ((t*180/Math.PI)%360+360)%360; }
function paintSide(){
  var deg=degOf(th), q=qOf(deg), sp=SP[Math.round(deg/15)*15%360]&& (Math.abs(deg-Math.round(deg/15)*15)<0.6? SP[Math.round(deg/15)*15%360]:null);
  var c=Math.cos(th), s=Math.sin(th), t=Math.abs(c)<1e-9?null:s/c;
  var radFrac= sp? sp[0] : (deg/180).toFixed(2)+'\u03c0';
  side.innerHTML=
   '<h3>THE ANGLE</h3><div class="big">'+deg.toFixed(1)+'\u00b0 \u00b7 '+radFrac+' rad</div>'
  +'<h3>THE POINT (cos \u03b8, sin \u03b8)</h3><div class="big">'+(sp? '('+sp[1]+', '+sp[2]+')' : '('+c.toFixed(3)+', '+s.toFixed(3)+')')+'</div>'
  +'<div><span class="p">cos</span> '+(sp?sp[1]:c.toFixed(3))+' \u00b7 <span class="o">sin</span> '+(sp?sp[2]:s.toFixed(3))+' \u00b7 <span class="g">tan</span> '+(t===null?'undefined':(Math.abs(Math.abs(t)-1)<1e-9?(t>0?'1':'-1'):t.toFixed(3)))+'</div>'
  +'<h3>QUADRANT '+q[0]+' \u00b7 '+q[1]+'</h3><div>'+q[2]+'</div>'
  +'<div>sin '+(s>=0?'+':'\u2212')+' \u00b7 cos '+(c>=0?'+':'\u2212')+' \u00b7 tan '+((t===null)?'\u221e':(t>=0?'+':'\u2212'))+'</div>'
  +'<h3>THE LEGS</h3><div><span class="p">cos leg</span> = x-coordinate \u00b7 <span class="o">sin leg</span> = y-coordinate \u00b7 <span class="g">tan</span> = y/x</div>'
  +'<h3>NEXT DOOR</h3><div>plot her in the grid: polar r = 1 \u00b7 <a href="grid3d.html" style="color:#8ab4ff">the grid \u2197</a></div>';
}
var dragC=false;
cc.addEventListener('pointerdown',function(e){ dragC=true; cc.setPointerCapture(e.pointerId); moveC(e); });
cc.addEventListener('pointermove',function(e){ if(dragC) moveC(e); });
addEventListener('pointerup',function(){ dragC=false; });
function moveC(e){ var r=cc.getBoundingClientRect();
  var dx=(e.clientX-r.left)-W/2, dy=(e.clientY-r.top)-H/2;
  var a=Math.atan2(-dy,dx); if(a<0) a+=Math.PI*2;
  if(snap){ var st15=Math.PI/12; a=Math.round(a/st15)*st15% (Math.PI*2); }
  th=a; drawCircle(); }
/* ---- the math areas wheel ---- */
var AREAS=[['Arithmetic','integers · fractions · decimals · percents'],
 ['Algebra','elementary · linear · polynomials · equations'],
 ['Geometry','euclidean · non-euclidean · analytical'],
 ['Trigonometry','functions · identities · applications · spherical'],
 ['Calculus','differential · integral · multivariable · vector'],
 ['Statistics','probability · regression · random variables · stochastic'],
 ['Logic','symbolic · proofs · model theory'],
 ['Set Theory','sets · cardinals · ordinals · axioms'],
 ['Graph Theory','graphs · trees · networks · algorithms'],
 ['Discrete Math','finite structures · coding · cryptography · numerics'],
 ['Abstract Algebra','groups · rings · fields · spaces · eigenvalues'],
 ['Topology','point-set · algebraic · manifolds'],
 ['Applied Math','physics · modelling · optimization · recursion'],
 ['Mathematical Logic','proof theory · recursion theory · number theory']];
var selArea=4;
function polarPt(cx,cy,r,a){ return [cx+r*Math.cos(a), cy+r*Math.sin(a)]; }
function buildWheel(){
  var n=AREAS.length, cx=300, cy=300, r0=90, r1=210, r2=282;
  var out='<circle cx="300" cy="300" r="'+r0+'" fill="#0e141b" stroke="#223041"/>';
  for(var i=0;i<n;i++){
    var a0=-Math.PI/2+i*2*Math.PI/n, a1=-Math.PI/2+(i+1)*2*Math.PI/n;
    var p0=polarPt(cx,cy,r0,a0), p1=polarPt(cx,cy,r1,a0), p2=polarPt(cx,cy,r1,a1), p3=polarPt(cx,cy,r0,a1);
    var large=(a1-a0)>Math.PI?1:0;
    out+='<path d="M'+p0[0]+' '+p0[1]+' L'+p1[0]+' '+p1[1]+' A'+r1+' '+r1+' 0 '+large+' 1 '+p2[0]+' '+p2[1]+' L'+p3[0]+' '+p3[1]+' A'+r0+' '+r0+' 0 '+large+' 0 '+p0[0]+' '+p0[1]+' Z" '
      +'fill="'+(i===selArea?'rgba(217,168,58,.14)':(i%2?'rgba(14,20,27,.9)':'rgba(10,13,18,.9)'))+'" stroke="#223041" data-area="'+i+'" style="cursor:pointer"/>';
    var am=(a0+a1)/2, lp=polarPt(cx,cy,(r1+r2)/2,am);
    out+='<text x="'+lp[0]+'" y="'+lp[1]+'" fill="'+(i===selArea?'#d9a83a':'#93a1b0')+'" font-size="12" font-family="ui-monospace,Consolas,monospace" text-anchor="middle" transform="rotate('+(am*180/Math.PI+90)+' '+lp[0]+' '+lp[1]+')" style="pointer-events:none">'+AREAS[i][0]+'</text>';
  }
  for(var h=1;h<=12;h++){ var ha=-Math.PI/2+h*Math.PI/6;
    var hp=polarPt(cx,cy,r0*0.62,ha);
    out+='<text x="'+hp[0]+'" y="'+hp[1]+4+'" fill="#5c6875" font-size="12" text-anchor="middle" font-family="ui-monospace,Consolas,monospace">'+h+'</text>'; }
  out+='<text x="300" y="296" fill="#e8e4d8" font-size="14" text-anchor="middle" font-family="ui-monospace,Consolas,monospace">'+AREAS[selArea][0]+'</text>'
     + '<text x="300" y="314" fill="#5c6875" font-size="10" text-anchor="middle" font-family="ui-monospace,Consolas,monospace">'+AREAS[selArea][1].split('·').length+' rooms</text>';
  svg.innerHTML=out;
  var ps=svg.querySelectorAll('path[data-area]');
  for(var j=0;j<ps.length;j++){ ps[j].onclick=function(){ selArea=+this.getAttribute('data-area'); buildWheel(); paintWheelSide(); }; }
}
function paintWheelSide(){
  side.innerHTML='<h3>'+AREAS[selArea][0].toUpperCase()+'</h3>'
   +AREAS[selArea][1].split(' \u00b7 ').map(function(s){ return '<div>\u00b7 '+s+'</div>'; }).join('')
   +'<h3>THE WHEEL SPEAKS</h3><div>fourteen sectors, one house \u00b7 the grid plots calculus & trigonometry & the shapes between \u00b7 <a href="grid3d.html" style="color:#8ab4ff">plot it \u2197</a></div>';
}
function setTab(t){ tab=t;
  tabC.className=t==='circle'?'on':''; tabW.className=t==='wheel'?'on':'';
  cc.style.display=t==='circle'?'':'none'; svg.style.display=t==='wheel'?'':'none';
  try{ localStorage.setItem('hive_wheel_tab',t); }catch(e){}
  if(t==='circle'){ fit(); } else { buildWheel(); paintWheelSide(); } }
tabC.onclick=function(){ setTab('circle'); };
tabW.onclick=function(){ setTab('wheel'); };
snapBtn.onclick=function(){ snap=!snap; snapBtn.className=snap?'on':''; };
try{ tab=localStorage.getItem('hive_wheel_tab')||'circle'; }catch(e){}
setTab(tab); fit();
})();
</script>
</body>
</html>
